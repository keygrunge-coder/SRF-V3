<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Keyword Analyzer & Title Generator - Sandal</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --primary-color: #2563eb;
    --primary-hover: #1d4ed8;
    --text-color: #0f172a;
    --muted-color: #64748b;
    --border-color: #e2e8f0;
    --accent-bg: #f1f5f9;
    --success-color: #16a34a;
    --success-hover: #15803d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: 1.5;
  }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
  }

  h1 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-color);
  }

  h2 {
    margin: 0 0 16px 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-color);
  }

  .muted {
    color: var(--muted-color);
    font-size: 13px;
  }

  textarea, input[type="text"], input[type="number"] {
    width: 100%;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    background: #fff;
    color: var(--text-color);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  textarea:focus, input:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  textarea {
    min-height: 160px;
    resize: vertical;
    margin-top: 10px;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  .field-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-color);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  button:active { transform: scale(0.98); }

  button.primary { background: var(--primary-color); color: white; }
  button.primary:hover { background: var(--primary-hover); }

  button.success { background: var(--success-color); color: white; }
  button.success:hover { background: var(--success-hover); }

  button.secondary { background: var(--accent-bg); color: var(--text-color); }
  button.secondary:hover { background: #e2e8f0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .stat {
    background: var(--accent-bg);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }

  .stat-label { font-size: 12px; color: var(--muted-color); font-weight: 500; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--text-color); margin-top: 4px; }

  .titlebox {
    background: #f8fafc;
    border: 1.5px dashed var(--border-color);
    padding: 18px;
    border-radius: 12px;
    margin: 16px 0;
  }

  .generated-title {
    font-size: 17px;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.5;
    word-break: break-word;
  }

  .char-info {
    font-size: 12px;
    color: var(--muted-color);
    margin-top: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }

  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    font-size: 14px;
  }

  th {
    font-size: 12px;
    color: var(--muted-color);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #f8fafc;
  }

  tr:last-child td { border-bottom: none; }

  @media(max-width: 640px) {
    .filter-grid, .grid { grid-template-columns: 1fr; }
    .actions { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Input Form Card -->
  <div class="card">
    <h1>👡 SEO Keyword Analyzer Sandal</h1>
    <div class="muted">Salin data pencarian Shopee (Tab Terlaris), tempel di bawah untuk menemukan kata kunci populer dan menyusun judul produk.</div>
    
    <textarea id="input" placeholder="Tempel teks mentah hasil pencarian Shopee di sini..."></textarea>
    
    <div class="filter-grid">
      <div class="field-group">
        <label>Kata Buangan Tambahan</label>
        <input type="text" id="customStopWords" placeholder="contoh: promo, gratis, ongkir, diskon">
      </div>
      <div class="field-group">
        <label>Minimal Kemunculan Kata</label>
        <input type="number" id="minFrequency" value="2" min="1" max="50">
      </div>
    </div>

    <div class="actions">
      <button class="primary" onclick="analyze()">🔍 Analisis Kata Kunci</button>
      <button class="secondary" onclick="resetForm()">🔄 Reset Input</button>
    </div>
  </div>

  <!-- Result Output -->
  <div id="result"></div>
</div>

<script>
// Kata buangan standar (Elemen UI Shopee & Kata promosi umum)
const DEFAULT_STOP = new Set(`
dan yang untuk dari dengan di ke pada anak ini itu terbaru model
atau serta ada all the a an of by i harga rp terjual bln hari besok kab kabupaten kota 
produk serupa viral kekinian grosir murah promo diskon gratis ongkir cod toko star seller
sepatu pakaian baju celana tas aksesoris original berkualitas premium import lokal
`.trim().split(/\s+/));

let globalFilteredKeywords = [];

function clean(s){
  return s.toLowerCase()
   .replace(/https?:\/\/\S+/g,' ')
   .replace(/rp\s*[\d.,]+/gi,' ')
   .replace(/\d+[.,]?\d*\s*terjual\/bln/gi,' ')
   .replace(/[^a-z0-9\s-]/g,' ')
   .replace(/\s+/g,' ').trim();
}

function extractTitles(raw){
  const lines = raw.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  let titles = [];
  for(let i = 0; i < lines.length; i++){
    let s = lines[i].replace(/^[-•]+\s*/, '').trim();
    if(s.length >= 18 && s.length <= 250 && /[a-zA-Z]/.test(s)){
      let nearby = lines.slice(i + 1, i + 6).join(' ');
      if(/(\d+\s*terjual|\d+k?\+?\s*terjual|terjual\/bln|rp\s*[\d.,]+)/i.test(nearby)){
        titles.push(s);
      }
    }
  }
  return [...new Map(titles.map(t => [t.toLowerCase(), t])).values()];
}

function getActiveStopWords(){
  const custom = document.getElementById('customStopWords').value.toLowerCase().split(/[\s,]+/);
  const combined = new Set(DEFAULT_STOP);
  custom.forEach(w => { if(w.trim()) combined.add(w.trim()); });
  return combined;
}

function tokenize(t, stopSet){
  return clean(t).split(/\s+/).filter(w => w.length >= 3 && !stopSet.has(w) && !/^\d+$/.test(w));
}

function ngrams(words, n, stopSet){
  let a = [];
  for(let i = 0; i <= words.length - n; i++){
    let x = words.slice(i, i + n);
    if(x.every(w => !stopSet.has(w))) a.push(x.join(' '));
  }
  return a;
}

// LOGIKA BARU: Menyusun judul secara terstruktur dan logis
function generateStructuredTitle() {
  if(!globalFilteredKeywords.length) return;

  const pool = globalFilteredKeywords.map(x => x[0]);

  // Kategori kata spesifik produk sandal
  const targetWords = pool.filter(w => ['pria', 'wanita', 'cowok', 'cewek', 'anak', 'dewasa', 'bayi', 'balita'].includes(w));
  const featureWords = pool.filter(w => ['karet', 'jelly', 'empuk', 'ringan', 'antislip', 'anti-slip', 'tebal', 'soft', 'nyaman', 'tahan'].includes(w));
  const modelWords = pool.filter(w => ['slop', 'baim', 'tali', 'jepit', 'gozal', 'kodok', 'slide', 'crocs', 'selop', 'gunung', 'heels', 'wedges', 'flat'].includes(w));
  
  // Kata-kata pendukung lainnya
  const extraWords = pool.filter(w => 
    !['sandal', 'sendal'].includes(w) && 
    !targetWords.includes(w) && 
    !featureWords.includes(w) && 
    !modelWords.includes(w)
  );

  const getRandom = (arr) => arr.length ? arr[Math.floor(Math.random() * arr.length)] : '';

  const model = getRandom(modelWords);
  const target = getRandom(targetWords);
  const feature = getRandom(featureWords);
  const extra1 = getRandom(extraWords);
  const extra2 = getRandom(extraWords.filter(w => w !== extra1));

  // Pola Baku E-Commerce: [Kata Utama] + [Model] + [Target/Gender] + [Bahan/Fitur] + [Kata Kunci Tambahan]
  let titleParts = ['Sandal'];

  if (model) titleParts.push(model);
  if (target) titleParts.push(target);
  if (feature) titleParts.push(feature);
  if (extra1) titleParts.push(extra1);
  if (extra2) titleParts.push(extra2);

  // Capitalize setiap kata
  let result = titleParts.join(' ').replace(/\b\w/g, x => x.toUpperCase());

  document.getElementById('generatedTitle').innerText = result;
  document.getElementById('charCount').innerText = result.length;
}

function copyTitle() {
  const text = document.getElementById('generatedTitle').innerText;
  if(text && text !== '-') {
    navigator.clipboard.writeText(text);
    alert('Judul berhasil disalin!');
  }
}

function analyze(){
  const raw = document.getElementById('input').value;
  if(!raw.trim()){ alert('Silakan tempelkan hasil copas data Shopee terlebih dahulu.'); return; }

  const minFreq = parseInt(document.getElementById('minFrequency').value) || 2;
  const titles = extractTitles(raw);

  if(!titles.length){
    document.getElementById('result').innerHTML = `
      <div class="card">
        <h2>⚠️ Judul Produk Tidak Terbaca</h2>
        <p class="muted">Sistem tidak menemukan judul produk terlaris. Pastikan Anda menyalin seluruh teks dari halaman pencarian Shopee dengan lengkap.</p>
      </div>`;
    return;
  }

  const stopSet = getActiveStopWords();
  const one = {}, two = {}, three = {};

  titles.forEach(t => {
    const words = tokenize(t, stopSet);
    new Set(words).forEach(w => one[w] = (one[w] || 0) + 1);
    new Set(ngrams(words, 2, stopSet)).forEach(w => two[w] = (two[w] || 0) + 1);
    new Set(ngrams(words, 3, stopSet)).forEach(w => three[w] = (three[w] || 0) + 1);
  });

  const rank = o => Object.entries(o).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  
  // Filter kata kunci yang lolos batas minimal frekuensi
  globalFilteredKeywords = rank(one).filter(item => item[1] >= minFreq);
  const top2 = rank(two).filter(item => item[1] >= minFreq).slice(0, 15);
  const top3 = rank(three).filter(item => item[1] >= minFreq).slice(0, 10);

  document.getElementById('result').innerHTML = `
    <div class="card">
      <div class="grid">
        <div class="stat">
          <div class="stat-label">Produk Terbaca</div>
          <div class="stat-val">${titles.length} Judul</div>
        </div>
        <div class="stat">
          <div class="stat-label">Kata Kunci Lolos Filter</div>
          <div class="stat-val">${globalFilteredKeywords.length} Kata</div>
        </div>
        <div class="stat">
          <div class="stat-label">Batas Min. Kemunculan</div>
          <div class="stat-val">≥ ${minFreq} Kali</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>✨ Generator Judul SEO Terstruktur</h2>
      <div class="muted">Kombinasi terstruktur berdasar pola e-commerce (Sandal + Model + Target + Bahan + Kata Kunci).</div>
      
      <div class="titlebox">
        <div class="generated-title" id="generatedTitle">-</div>
        <div class="char-info">Panjang Karakter: <b id="charCount">0</b> / 255 (Panjang ideal Shopee: 80 - 120)</div>
      </div>

      <div class="actions" style="margin-top:0;">
        <button class="primary" onclick="generateStructuredTitle()">🔀 Buat Variasi Judul</button>
        <button class="success" onclick="copyTitle()">📋 Salin Judul</button>
      </div>
    </div>

    <div class="card">
      <h2>🏆 Kata Kunci Tunggal (Unigram)</h2>
      <div class="muted" style="margin-bottom:12px;">Daftar kata terbanyak yang sering diulang oleh kompetitor terlaris.</div>
      ${renderTable(globalFilteredKeywords.slice(0, 30), 'Kata Kunci', 'Frekuensi Muncul')}
    </div>

    <div class="card">
      <h2>🔗 Frasa 2 Kata (Bigram)</h2>
      <div class="muted" style="margin-bottom:12px;">Kombinasi 2 kata populer untuk kategori sandal.</div>
      ${renderTable(top2, 'Frasa 2 Kata', 'Frekuensi Muncul')}
    </div>

    <div class="card">
      <h2>🔗 Frasa 3 Kata (Trigram)</h2>
      <div class="muted" style="margin-bottom:12px;">Kombinasi 3 kata populer untuk pencarian spesifik.</div>
      ${renderTable(top3, 'Frasa 3 Kata', 'Frekuensi Muncul')}
    </div>
  `;

  generateStructuredTitle();
}

function renderTable(data, col1, col2){
  if(!data.length) return '<p class="muted">Tidak ada kata kunci yang memenuhi batas minimal kemunculan.</p>';
  return `
    <table>
      <thead>
        <tr>
          <th>${col1}</th>
          <th>${col2}</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(x => `
          <tr>
            <td><b>${x[0]}</b></td>
            <td>${x[1]} kali</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function resetForm(){
  document.getElementById('input').value = '';
  document.getElementById('customStopWords').value = '';
  document.getElementById('minFrequency').value = '2';
  document.getElementById('result').innerHTML = '';
  globalFilteredKeywords = [];
}
</script>
</body>
</html>
