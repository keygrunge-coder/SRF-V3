<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO Keyword Analyzer & Generator Judul Sandal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:1100px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #00000008}
h1{margin:0 0 8px;font-size:24px;color:#111827}
h2{margin:0 0 12px;font-size:18px}
.muted{color:#68737d;font-size:14px}
textarea, input[type="text"], input[type="number"]{width:100%;border:1px solid #ccd3da;border-radius:12px;padding:12px;font-size:14px;margin-top:6px}
textarea{min-height:180px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#111827;color:white}
button.secondary{background:#e9edf1;color:#111827;margin-left:8px}
button.accent{background:#2563eb;color:white}
button.success{background:#16a34a;color:white;margin-left:8px}
.actions{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#f7f8fa;border-radius:12px;padding:14px}
.stat b{display:block;font-size:20px;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f2}
th{font-size:13px;color:#66707a}
.titlebox{background:#f7f8fa;padding:16px;border-radius:12px;margin:12px 0;border:1px solid #e2e6ea}
.title-text{font-size:18px;font-weight:700;color:#1e293b;line-height:1.4}
.char-info{font-size:13px;color:#64748b;margin-top:8px}
.filter-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.filter-grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <h1>👡 Analyzer Kata Kunci & Generator Judul Sandal</h1>
    <div class="muted">Copas hasil pencarian Shopee (Tab Terlaris). Alat ini khusus mengekstrak kata kunci produk sandal yang paling laku.</div>
    
    <textarea id="input" placeholder="Paste mentahan hasil copas dari Shopee di sini..."></textarea>
    
    <div class="filter-grid">
      <div>
        <label class="muted"><b>Kata Buangan Tambahan (Pisahkan dengan koma/spasi):</b></label>
        <input type="text" id="customStopWords" placeholder="contoh: promo, gratis, ongkir, diskon">
      </div>
      <div>
        <label class="muted"><b>Ambil Maksimal Produk Terlaris:</b></label>
        <input type="number" id="topLimit" value="20" min="5" max="100">
      </div>
    </div>

    <div class="actions">
      <button onclick="analyze()">ANALISIS PRODUK TERLARIS</button>
      <button class="secondary" onclick="resetForm()">RESET</button>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
// Stop words khusus kategori produk umum & Shopee e-commerce UI
const DEFAULT_STOP = new Set(`
dan yang untuk dari dengan di ke pada anak ini itu terbaru model laki perempuan cowok cewek
atau serta ada all the a an of by i harga rp terjual bln hari besok kab kabupaten kota 
produk serupa viral kekinian grosir murah promo diskon gratis ongkir cod toko star seller
sepatu pakaian baju celana tas aksoris original berkualitas premium import lokal
`.trim().split(/\s+/));

let globalKeywords = [];

function clean(s){
  return s.toLowerCase()
   .replace(/https?:\/\/\S+/g,' ')
   .replace(/rp\s*[\d.,]+/gi,' ')
   .replace(/\d+[.,]?\d*\s*terjual\/bln/gi,' ')
   .replace(/[^a-z0-9\s-]/g,' ')
   .replace(/\s+/g,' ').trim();
}

function extractPrices(raw){
  const prices = [];
  const regex = /rp\s*([\d.,]+)/gi;
  let match;
  while ((match = regex.exec(raw)) !== null) {
    let cleanNum = parseInt(match[1].replace(/[.,]/g, ''));
    if (cleanNum > 1000 && cleanNum < 50000000) prices.push(cleanNum);
  }
  return prices;
}

function extractTitles(raw){
  const lines = raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let titles = [];
  for(let i=0; i<lines.length; i++){
    let s = lines[i].replace(/^[-•]+\s*/,'').trim();
    if(s.length >= 18 && s.length <= 250 && /[a-zA-Z]/.test(s)){
      let nearby = lines.slice(i+1, i+6).join(' ');
      // Filter khusus: Memastikan ada teks penjualan di sekitarnya
      if(/(\d+\s*terjual|\d+k?\+?\s*terjual|terjual\/bln|rp\s*[\d.,]+)/i.test(nearby)){
        titles.push(s);
      }
    }
  }
  return [...new Map(titles.map(t=>[t.toLowerCase(),t])).values()];
}

function getActiveStopWords(){
  const custom = document.getElementById('customStopWords').value.toLowerCase().split(/[\s,]+/);
  const combined = new Set(DEFAULT_STOP);
  custom.forEach(w => { if(w.trim()) combined.add(w.trim()); });
  return combined;
}

function tokenize(t, stopSet){
  return clean(t).split(/\s+/).filter(w => w.length >= 3 && !stopSet.has(w) && !/^\d+$/.test(w));
}

function ngrams(words, n, stopSet){
  let a = [];
  for(let i=0; i<=words.length-n; i++){
    let x = words.slice(i, i+n);
    if(x.every(w => !stopSet.has(w))) a.push(x.join(' '));
  }
  return a;
}

function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateTitle() {
  if(!globalKeywords.length) return;

  const pool = globalKeywords.map(x => x[0]);
  let shuffled = shuffleArray(pool).slice(0, 6);

  // Kunci kata "Sandal" di depan
  let titleParts = [];
  if(pool.includes('sandal')) {
    titleParts.push('Sandal');
    shuffled = shuffled.filter(w => w !== 'sandal' && w !== 'sendal');
  } else if(pool.includes('sendal')) {
    titleParts.push('Sendal');
    shuffled = shuffled.filter(w => w !== 'sandal' && w !== 'sendal');
  } else {
    titleParts.push('Sandal'); // Default jika tidak terdeteksi
  }

  titleParts = titleParts.concat(shuffled);
  let result = titleParts.join(' ').replace(/\b\w/g, x => x.toUpperCase());

  document.getElementById('generatedTitle').innerText = result;
  document.getElementById('charCount').innerText = result.length;
}

function copyTitle() {
  const text = document.getElementById('generatedTitle').innerText;
  if(text) {
    navigator.clipboard.writeText(text);
    alert('Judul berhasil disalin ke clipboard!');
  }
}

function analyze(){
  const raw = document.getElementById('input').value;
  if(!raw.trim()){ alert('Masukkan data copas Shopee terlebih dahulu.'); return; }

  const limit = parseInt(document.getElementById('topLimit').value) || 20;
  const rawTitles = extractTitles(raw);
  const titles = rawTitles.slice(0, limit);
  const prices = extractPrices(raw);

  if(!titles.length){
    document.getElementById('result').innerHTML = '<div class="card"><b>Judul produk terlaris tidak terdeteksi.</b><p class="muted">Pastikan kamu menyalin halaman hasil pencarian Shopee dengan lengkap.</p></div>';
    return;
  }

  const stopSet = getActiveStopWords();
  const one = {}, two = {}, three = {};

  // Perhitungan berbobot (Produk teratas dapat skor lebih tinggi)
  titles.forEach((t, index) => {
    const weight = index < 5 ? 3 : (index < 10 ? 2 : 1);
    const words = tokenize(t, stopSet);

    new Set(words).forEach(w => one[w] = (one[w] || 0) + weight);
    new Set(ngrams(words, 2, stopSet)).forEach(w => two[w] = (two[w] || 0) + weight);
    new Set(ngrams(words, 3, stopSet)).forEach(w => three[w] = (three[w] || 0) + weight);
  });

  const rank = o => Object.entries(o).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  globalKeywords = rank(one);

  const top2 = rank(two).slice(0, 15);
  const top3 = rank(three).slice(0, 10);

  let avgPrice = prices.length ? Math.round(prices.reduce((a,b)=>a+b, 0) / prices.length) : 0;
  const formatRp = val => val ? 'Rp ' + val.toLocaleString('id-ID') : 'N/A';

  document.getElementById('result').innerHTML = `
    <div class="card">
      <div class="grid">
        <div class="stat">Produk Diisi<b>${titles.length} Top Sales</b></div>
        <div class="stat">Kata Unik Khusus<b>${Object.keys(one).length} Kata</b></div>
        <div class="stat">Rata-rata Harga<b>${formatRp(avgPrice)}</b></div>
        <div class="stat">Total Sampel Judul<b>${rawTitles.length} Terdeteksi</b></div>
      </div>
    </div>

    <div class="card">
      <h2>🚀 Generator Judul Sandal Otomatis</h2>
      <div class="muted">Disusun berdasar kata kunci bernilai tinggi dari produk terlaris.</div>
      <div class="titlebox">
        <div class="title-text" id="generatedTitle">-</div>
        <div class="char-info">Panjang Karakter: <b id="charCount">0</b> / 255 (Saran Shopee: 80 - 120 Karakter)</div>
      </div>
      <button class="accent" onclick="generateTitle()">🔀 Acak Judul Baru</button>
      <button class="success" onclick="copyTitle()">📋 Salin Judul</button>
    </div>

    <div class="card"><h2>🏆 Top Kata Kunci Single (Unigram)</h2>${renderTable(globalKeywords.slice(0, 25), 'Kata Kunci', 'Skor Bobot')}</div>
    <div class="card"><h2>Kombinasi 2 Kata Populer (Bigram)</h2>${renderTable(top2, 'Frasa 2 Kata', 'Skor Bobot')}</div>
    <div class="card"><h2>Kombinasi 3 Kata Populer (Trigram)</h2>${renderTable(top3, 'Frasa 3 Kata', 'Skor Bobot')}</div>
  `;

  generateTitle();
}

function renderTable(data, col1, col2){
  if(!data.length) return '<p class="muted">Tidak ada data.</p>';
  return '<table><thead><tr><th>'+col1+'</th><th>'+col2+'</th></tr></thead><tbody>'+
    data.map(x => '<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+' pt</td></tr>').join('')+
    '</tbody></table>';
}

function resetForm(){
  document.getElementById('input').value = '';
  document.getElementById('customStopWords').value = '';
  document.getElementById('result').innerHTML = '';
  globalKeywords = [];
}
</script>
</body>
</html>
