<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner Retur</title>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; }

    .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        font-size: 14px;
        height: 45px;
    }
    .app-header a { color: #94a3b8; text-decoration: none; font-weight: 600; }
    .app-header h3 { font-size: 14px; color: #f8fafc; }

    .scanner-wrapper {
        flex: 1;
        position: relative;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    #reader { width: 100% !important; height: 100% !important; border: none !important; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }

    .camera-overlay-top {
        position: absolute;
        top: 10px; left: 10px; right: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }
    .status-pill-floating {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(4px);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255,255,255,0.15);
        max-width: 95%;
    }
    #bca-indicator {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #ff3333;
        box-shadow: 0 0 8px currentColor;
        flex-shrink: 0;
        transition: background 0.3s;
    }

    .last-item-card {
        position: absolute;
        bottom: 60px; left: 10px; right: 10px;
        background: rgba(30, 41, 59, 0.9);
        backdrop-filter: blur(6px);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 10px 14px;
        z-index: 10;
        display: none;
    }
    .last-item-card.active { display: block; }
    .item-title { font-size: 11px; color: #38bdf8; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 12px; }
    .item-grid span { color: #94a3b8; }
    .item-grid strong { color: #f8fafc; }

    .floating-actions {
        position: absolute;
        bottom: 10px; right: 10px;
        z-index: 10;
        display: flex;
        gap: 8px;
    }
    .float-btn {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(4px);
        color: white;
        border: 1px solid rgba(255,255,255,0.2);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
    }

    .bottom-drawer {
        background: #1e293b;
        border-top: 1px solid #334155;
        transition: max-height 0.3s ease-in-out;
        max-height: 45px;
        overflow: hidden;
        z-index: 20;
    }
    .bottom-drawer.open { max-height: 220px; }
    .drawer-toggle {
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        background: #1e293b;
    }
    .drawer-content { padding: 0 10px 10px 10px; max-height: 160px; overflow-y: auto; }
    .compact-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .compact-table th, .compact-table td { padding: 6px 6px; text-align: left; border-bottom: 1px solid #334155; color: #f8fafc; }

    .badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }
    .badge-kembali { background: #065f46; color: #34d399; }
    .badge-notfound { background: #78350f; color: #fbbf24; }

    #manualModal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(3px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }
    .modal-box {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        width: 85%; max-width: 320px;
        border: 1px solid #334155;
    }
    .modal-box h3 { font-size: 15px; margin-bottom: 5px; }
    .modal-box input {
        width: 100%; padding: 10px; margin: 12px 0;
        background: #0f172a; border: 1px solid #475569;
        color: white; border-radius: 6px; font-size: 14px;
    }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #475569; color: white; }
    #startBtn { display: none; }
</style>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003399">
</head>
<body>

<div class="app-header">
    <a href="index.html">← Menu</a>
    <h3>🔄 SCANNER RETUR</h3>
    <div style="width: 40px;"></div>
</div>

<div class="scanner-wrapper">
    <div class="camera-overlay-top">
        <div class="status-pill-floating">
            <div id="bca-indicator"></div>
            <span id="status-message">Menyalakan Kamera...</span>
        </div>
    </div>

    <div id="reader"></div>

    <div id="lastItemCard" class="last-item-card">
        <div class="item-title">📦 Detail Barang Kembali</div>
        <div class="item-grid">
            <div>SKU: <strong id="infoSku">-</strong></div>
            <div>Warna: <strong id="infoWarna">-</strong></div>
            <div>Size: <strong id="infoSize">-</strong></div>
            <div>Qty: <strong id="infoQty">-</strong></div>
        </div>
    </div>

    <div class="floating-actions">
        <button class="float-btn" onclick="toggleManualModal(true)">⌨ Input Manual</button>
    </div>
</div>

<div class="bottom-drawer" id="bottomDrawer">
    <div class="drawer-toggle" onclick="toggleDrawer()">
        <span>📋 Riwayat Retur</span>
        <span id="drawerArrow">▼</span>
    </div>
    <div class="drawer-content">
        <table class="compact-table">
            <thead>
                <tr>
                    <th>Resi / SKU</th>
                    <th>Detail / Status</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<div id="manualModal">
    <div class="modal-box">
        <h3>Input Manual Resi Retur</h3>
        <input type="text" id="manualResi" placeholder="Ketik nomor resi...">
        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="toggleManualModal(false)">Batal</button>
            <button class="btn btn-primary" onclick="submitManual()">Simpan</button>
        </div>
    </div>
</div>

<button id="startBtn" style="display:none;"></button>


<!-- Memanggil File JS Konfigurasi & Bot Terlebih Dahulu -->
<script src="js/config.js"></script>
<script src="js/botscanretur.js"></script>
<script src="js/scanretur.js"></script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>
</body>
</html>
