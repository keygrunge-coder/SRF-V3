<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>SRF • Scan Retur</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
}

body{
    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:52px;
    flex-shrink:0;

    background:#1e293b;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    z-index:50;
}

.header-title{
    font-size:15px;
    font-weight:900;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:5px;
}

.header-btn{
    border:0;
    border-radius:7px;

    padding:7px 9px;

    color:white;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
    touch-action:manipulation;
}


/* =========================================================
   CAMERA BUTTON
========================================================= */

.camera-btn{
    background:#16a34a;
}

.camera-btn.off{
    background:#dc2626;
}


/* =========================================================
   HASIL & RIWAYAT
========================================================= */

.result-btn{
    background:#2563eb;
}

.history-btn{
    background:#7c3aed;
}


/* =========================================================
   DASHBOARD
========================================================= */

.stats{
    height:52px;
    flex-shrink:0;

    background:#334155;
    color:white;

    display:flex;
    justify-content:space-around;
    align-items:center;

    text-align:center;
}

.stat{
    font-size:10px;
    color:#cbd5e1;
}

.stat strong{
    display:block;

    color:#38bdf8;

    font-size:16px;

    margin-top:1px;
}


/* =========================================================
   SCANNER
========================================================= */

.scanner{
    position:relative;

    flex:1;
    min-height:0;

    background:#000;

    overflow:hidden;
}

#reader{
    position:absolute;

    inset:0;

    width:100%!important;
    height:100%!important;

    border:0!important;

    background:#000;
}

#reader video{
    width:100%!important;
    height:100%!important;

    object-fit:cover!important;
}

#reader img,
#reader__dashboard{
    display:none!important;
}

#reader__scan_region{
    width:100%!important;
    height:100%!important;
}


/* =========================================================
   STATUS
========================================================= */

.status-box{
    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    z-index:20;

    background:rgba(15,23,42,.88);

    backdrop-filter:blur(8px);

    border-radius:10px;

    padding:10px 12px;

    display:flex;
    align-items:center;
    gap:9px;

    color:white;
}

.lamp{
    width:13px;
    height:13px;
    min-width:13px;

    border-radius:50%;

    background:#facc15;

    box-shadow:
        0 0 10px currentColor;
}

.status-text{
    font-size:13px;
    font-weight:800;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notif{
    position:absolute;

    top:75px;
    left:50%;

    transform:translateX(-50%);

    z-index:40;

    padding:10px 18px;

    border-radius:25px;

    font-size:13px;
    font-weight:900;

    display:none;

    white-space:nowrap;

    box-shadow:
        0 5px 15px rgba(0,0,0,.35);
}

.notif.success{
    background:#16a34a;
    color:white;
}

.notif.warning{
    background:#f59e0b;
    color:white;
}

.notif.error{
    background:#dc2626;
    color:white;
}


/* =========================================================
   HASIL SCAN PANEL
========================================================= */

.result-panel{
    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    overflow-y:auto;

    background:#f1f5f9;

    padding:12px;
}

.result-panel.open{
    display:block;
}

.result-top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:10px;
}

.result-title{
    color:#0f172a;

    font-size:16px;
    font-weight:900;
}

.result-close{
    border:0;

    background:#dc2626;
    color:white;

    border-radius:8px;

    padding:8px 12px;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
}

.result-card{
    background:white;

    border-radius:14px;

    padding:14px;

    margin-bottom:12px;

    box-shadow:
        0 4px 14px rgba(15,23,42,.08);
}

.result-header{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:10px;

    margin-bottom:10px;
}

.result-resi{
    color:#0f172a;

    font-size:15px;
    font-weight:900;

    word-break:break-all;
}

.result-status{
    flex-shrink:0;

    background:#dcfce7;
    color:#166534;

    padding:5px 8px;

    border-radius:7px;

    font-size:9px;
    font-weight:900;
}

.result-info{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-bottom:12px;
}

.info-box{
    background:#f8fafc;

    border-radius:8px;

    padding:8px;
}

.info-label{
    color:#64748b;

    font-size:9px;
    font-weight:700;
}

.info-value{
    color:#0f172a;

    font-size:11px;
    font-weight:900;

    margin-top:2px;

    word-break:break-word;
}


/* =========================================================
   TABLE ITEM
========================================================= */

.item-title{
    color:#0f172a;

    font-size:12px;
    font-weight:900;

    margin-bottom:7px;
}

.item-table{
    width:100%;

    border-collapse:collapse;

    font-size:11px;
}

.item-table th{
    background:#f1f5f9;

    color:#64748b;

    padding:8px 6px;

    text-align:left;

    font-size:9px;
    font-weight:900;
}

.item-table td{
    padding:9px 6px;

    border-bottom:
        1px solid #e2e8f0;

    color:#1e293b;

    font-weight:700;

    vertical-align:middle;
}

.item-table th:last-child,
.item-table td:last-child{
    text-align:center;
}

.item-table tbody tr:last-child td{
    border-bottom:0;
}

.qty-badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:28px;

    padding:4px 6px;

    border-radius:6px;

    background:#dbeafe;
    color:#1d4ed8;

    font-size:10px;
    font-weight:900;
}

.total-box{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:10px;

    padding-top:10px;

    border-top:
        2px solid #e2e8f0;

    color:#0f172a;

    font-size:12px;
    font-weight:900;
}

.total-value{
    color:#2563eb;

    font-size:14px;
}


/* =========================================================
   HISTORY
========================================================= */

.history-panel{
    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    overflow-y:auto;

    background:#f1f5f9;

    padding:12px;
}

.history-panel.open{
    display:block;
}

.history-top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:10px;
}

.history-title{
    color:#0f172a;

    font-size:16px;
    font-weight:900;
}

.history-close{
    border:0;

    background:#dc2626;
    color:white;

    border-radius:8px;

    padding:8px 12px;

    font-size:10px;
    font-weight:900;
}

.history-empty{
    background:white;

    border-radius:12px;

    padding:25px 15px;

    text-align:center;

    color:#94a3b8;

    font-size:12px;
    font-weight:700;
}

.history-item{
    background:white;

    border-radius:12px;

    padding:12px;

    margin-bottom:8px;

    box-shadow:
        0 3px 10px rgba(15,23,42,.06);

    cursor:pointer;
}

.history-item-top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:8px;
}

.history-resi{
    color:#0f172a;

    font-size:12px;
    font-weight:900;

    word-break:break-all;
}

.history-time{
    color:#64748b;

    font-size:9px;

    margin-top:4px;
}

.history-count{
    flex-shrink:0;

    background:#dbeafe;
    color:#1d4ed8;

    padding:4px 7px;

    border-radius:6px;

    font-size:9px;
    font-weight:900;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

    .header-title{
        font-size:13px;
    }

    .header-actions{
        gap:3px;
    }

    .header-btn{
        padding:6px 7px;
        font-size:8px;
    }

    .status-text{
        font-size:12px;
    }

}

@media(max-width:360px){

    .header-title{
        font-size:12px;
    }

    .header-btn{
        padding:5px 6px;
        font-size:7px;
    }

    .result-panel,
    .history-panel{
        padding:10px;
    }

    .item-table{
        font-size:10px;
    }

    .item-table th{
        font-size:8px;
    }

    .item-table td{
        padding:8px 4px;
    }

}

</style>

</head>


<body>

     HEADER
========================================================= -->

<!-- =========================================================

<div class="stats">

<!-- =========================================================
     CONFIG
========================================================= -->

<script src="config.js"></script>


<script>

/* =========================================================
   URL APPS SCRIPT
========================================================= */

function getTargetUrl(){

    try{

        if(
            typeof APP_URL !== "undefined" &&
            APP_URL
        ){

            return String(
                APP_URL
            ).trim();

        }


        if(
            typeof CONFIG !== "undefined" &&
            CONFIG &&
            CONFIG.APP_URL
        ){

            return String(
                CONFIG.APP_URL
            ).trim();

        }

    }catch(e){

        console.error(
            "CONFIG ERROR:",
            e
        );

    }

    return "";

}


/* =========================================================
   ROBOT
========================================================= */

const ROBOT_CONFIG = {

    enabled:true,

    bahasa:"id-ID",

    rate:1.15,

    pitch:1.0,

    volume:1.0,

    pesan:{

        siap:
            "Kamera mati, scanner siap",

        kameraAktif:
            "Kamera aktif, siap scan",

        kameraBerhenti:
            "Kamera dimatikan",

        kameraGagal:
            "Tidak dapat membuka kamera",

        barangKembali:
            "Barang sudah kembali",

        resiSudahKembali:
            "Resi sudah kembali",

        resiTidakDitemukan:
            "Resi tidak ditemukan",

        scanGagal:
            "Scan gagal"

    }

};


/* =========================================================
   SCAN CONFIG
========================================================= */

const SCAN_CONFIG = {

    processingDelay:1200,

    beepSuccess:true,

    beepError:true

};


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_HISTORY =
    "srf_scan_retur_history_v3";


let scanHistory = [];


try{

    scanHistory =
        JSON.parse(
            localStorage.getItem(
                STORAGE_HISTORY
            ) || "[]"
        );

}catch(e){

    scanHistory = [];

}


/* =========================================================
   SCANNER VARIABLE
========================================================= */

let html5QrCode = null;

let cameraRunning = false;

let processing = false;


/* =========================================================
   INIT
========================================================= */

window.addEventListener(
    "load",
    function(){

        renderHistory();

        updateDashboard();

        setStatus(
            "yellow",
            ROBOT_CONFIG.pesan.siap
        );

        updateCameraButton();

    }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    type,
    text
){

    const lamp =
        document.getElementById(
            "lamp"
        );


    const status =
        document.getElementById(
            "statusText"
        );


    status.innerText =
        text;


    if(type === "green"){

        lamp.style.background =
            "#22c55e";

        lamp.style.color =
            "#22c55e";

    }

    else if(type === "red"){

        lamp.style.background =
            "#ef4444";

        lamp.style.color =
            "#ef4444";

    }

    else{

        lamp.style.background =
            "#facc15";

        lamp.style.color =
            "#facc15";

    }

}


/* =========================================================
   NOTIFICATION
========================================================= */

function showNotif(
    text,
    type="success"
){

    const el =
        document.getElementById(
            "notif"
        );


    el.innerText =
        text;


    el.className =
        "notif " + type;


    el.style.display =
        "block";


    clearTimeout(
        window.notifTimer
    );


    window.notifTimer =
        setTimeout(
            function(){

                el.style.display =
                    "none";

            },
            1800
        );

}


/* =========================================================
   BEEP
========================================================= */

function beep(
    freq=600,
    duration=.08
){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const osc =
            ctx.createOscillator();


        osc.frequency.value =
            freq;


        osc.connect(
            ctx.destination
        );


        osc.start();


        osc.stop(
            ctx.currentTime +
            duration
        );

    }catch(e){}

}


/* =========================================================
   ROBOT
========================================================= */

function speak(text){

    if(
        !ROBOT_CONFIG.enabled
    ){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                text
            );


        voice.lang =
            ROBOT_CONFIG.bahasa;


        voice.rate =
            ROBOT_CONFIG.rate;


        voice.pitch =
            ROBOT_CONFIG.pitch;


        voice.volume =
            ROBOT_CONFIG.volume;


        speechSynthesis.speak(
            voice
        );

    }catch(e){

        console.error(
            "ROBOT ERROR:",
            e
        );

    }

}


/* =========================================================
   NORMALIZE RESI
========================================================= */

function normalizeResi(resi){

    return String(
        resi || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   PARSE ITEM
========================================================= */

function parseItems(data){

    const skuRaw =
        String(
            data.sku || ""
        ).trim();


    const warnaRaw =
        String(
            data.warna || ""
        ).trim();


    const sizeRaw =
        String(
            data.size || ""
        ).trim();


    const totalQty =
        Number(
            data.qty
        ) || 0;


    const skuList =
        skuRaw
        ? skuRaw
            .split("|")
            .map(
                x => x.trim()
            )
            .filter(Boolean)
        : [];


    const warnaList =
        warnaRaw
        ? warnaRaw
            .split("|")
            .map(
                x => x.trim()
            )
            .filter(Boolean)
        : [];


    const sizeList =
        sizeRaw
        ? sizeRaw
            .split("|")
            .map(
                x => x.trim()
            )
            .filter(Boolean)
        : [];


    const itemCount =
        Math.max(
            skuList.length,
            warnaList.length,
            sizeList.length,
            1
        );


    const items = [];


    /* SATU ITEM */

    if(
        itemCount === 1
    ){

        items.push({

            nama:
                skuList[0] ||
                "-",

            warna:
                warnaList[0] ||
                "-",

            size:
                sizeList[0] ||
                "-",

            qty:
                totalQty || 1

        });


        return items;

    }


    /* BANYAK ITEM */

    let sisaQty =
        totalQty;


    for(
        let i=0;
        i<itemCount;
        i++
    ){

        let qtyItem = 1;


        if(
            i === itemCount - 1 &&
            sisaQty > 0
        ){

            qtyItem =
                sisaQty;

        }


        if(
            sisaQty > 0
        ){

            sisaQty--;

        }


        items.push({

            nama:
                skuList[i] ||
                "-",

            warna:
                warnaList[i] ||
                warnaList[0] ||
                "-",

            size:
                sizeList[i] ||
                sizeList[0] ||
                "-",

            qty:
                qtyItem

        });

    }


    return items;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDateTime(value){

    if(!value){

        return "-";

    }


    try{

        const d =
            new Date(value);


        if(
            isNaN(
                d.getTime()
            )
        ){

            return String(
                value
            );

        }


        return d.toLocaleString(
            "id-ID",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    }catch(e){

        return String(
            value
        );

    }

}


/* =========================================================
   RENDER HASIL
========================================================= */

function renderResult(data){

    const container =
        document.getElementById(
            "resultContainer"
        );


    container.innerHTML =
        "";


    if(!data){

        container.innerHTML = `

            <div class="history-empty">

                Belum ada hasil scan.

            </div>

        `;

        return;

    }


    const items =
        parseItems(data);


    let rows = "";


    items.forEach(
        function(item){

            rows += `

                <tr>

                    <td>
                        ${escapeHTML(
                            item.nama
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.warna
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.size
                        )}
                    </td>

                    <td>

                        <span class="qty-badge">

                            ${escapeHTML(
                                item.qty
                            )}

                        </span>

                    </td>

                </tr>

            `;

        }
    );


    const total =
        items.reduce(
            function(sum,item){

                return sum +
                    Number(
                        item.qty || 0
                    );

            },
            0
        );


    container.innerHTML = `

        <div class="result-card">

            <div class="result-header">

                <div class="result-resi">

                    ${escapeHTML(
                        data.resi
                    )}

                </div>

                <div class="result-status">

                    SUDAH KEMBALI

                </div>

            </div>


            <div class="result-info">

                <div class="info-box">

                    <div class="info-label">
                        EKSPEDISI
                    </div>

                    <div class="info-value">

                        ${escapeHTML(
                            data.ekspedisi ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        ORDER ID
                    </div>

                    <div class="info-value">

                        ${escapeHTML(
                            data.orderId ||
                            "-"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        WAKTU KEMBALI

/* =========================================================
   RESULT PANEL
========================================================= */

function openResultPanel(){

    closeHistoryPanel();


    document
        .getElementById(
            "resultPanel"
        )
        .classList.add(
            "open"
        );


    if(
        scanHistory.length
    ){

        renderResult(
            scanHistory[0]
        );

    }else{

        renderResult(
            null
        );

    }

}


function closeResultPanel(){

    document
        .getElementById(
            "resultPanel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory(data){

    scanHistory.unshift(
        data
    );


    scanHistory =
        scanHistory.slice(
            0,
            100
        );


    localStorage.setItem(
        STORAGE_HISTORY,
        JSON.stringify(
            scanHistory
        )
    );


    renderHistory();

    updateDashboard();

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

    const container =
        document.getElementById(
            "historyContainer"
        );


    if(!container){

        return;

    }


    container.innerHTML =
        "";


    if(
        scanHistory.length === 0
    ){

        container.innerHTML = `

            <div class="history-empty">

                Belum ada riwayat scan.

            </div>

        `;

        return;

    }


    scanHistory.forEach(
        function(item){

            const items =
                parseItems(item);


            const total =
                items.reduce(
                    function(sum,x){

                        return sum +
                            Number(
                                x.qty || 0
                            );

                    },
                    0
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML = `

                <div class="history-item-top">

                    <div>

                        <div class="history-resi">

                            ${escapeHTML(
                                item.resi
                            )}

                        </div>


                        <div class="history-time">

                            ${escapeHTML(
                                item.waktuScan ||
                                "-"
                            )}

                        </div>

                    </div>


                    <div class="history-count">

                        ${total} PASANG

                    </div>

                </div>

            `;


            div.addEventListener(
                "click",
                function(){

                    closeHistoryPanel();


                    document
                        .getElementById(
                            "resultPanel"
                        )
                        .classList.add(
                            "open"
                        );


                    renderResult(
                        item
                    );

                }
            );


            container.appendChild(
                div
            );

        }
    );

}


function openHistoryPanel(){

    closeResultPanel();

    renderHistory();


    document
        .getElementById(
            "historyPanel"
        )
        .classList.add(
            "open"
        );

}


function closeHistoryPanel(){

    document
        .getElementById(
            "historyPanel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

    const now =
        new Date();


    const today =
        now.toDateString();


    const yesterday =
        new Date(
            now.getTime() -
            86400000
        ).toDateString();


    const day =
        now.getDay();


    const mondayOffset =
        day === 0
        ? 6
        : day - 1;


    const monday =
        new Date(
            now.getTime() -
            mondayOffset * 86400000
        );


    monday.setHours(
        0,0,0,0
    );


    let hariIni = 0;
    let kemarin = 0;
    let mingguIni = 0;


    scanHistory.forEach(
        function(item){

            if(!item.waktuScan){

                return;

            }


            const d =
                new Date(
                    item.waktuScan
                );


            if(
                isNaN(
                    d.getTime()
                )
            ){

                return;

            }


            if(
                d.toDateString() ===
                today
            ){

                hariIni++;

            }


            if(
                d.toDateString() ===
                yesterday
            ){

                kemarin++;

            }


            if(
                d >= monday
            ){

                mingguIni++;

            }

        }
    );


    document.getElementById(
        "hariIni"
    ).innerText =
        hariIni;


    document.getElementById(
        "kemarin"
    ).innerText =
        kemarin;


    document.getElementById(
        "mingguIni"
    ).innerText =
        mingguIni;

}


/* =========================================================
   PROSES HASIL SERVER
========================================================= */

function prosesHasilScan(
    result,
    resi
){

    /* =========================================
       RESI TIDAK DITEMUKAN
    ========================================= */

    if(
        result.status ===
        "notfound"
    ){

        if(
            SCAN_CONFIG.beepError
        ){

            beep(
                250,
                .25
            );

        }


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.resiTidakDitemukan
        );


        showNotif(
            "RESI TIDAK DITEMUKAN",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.resiTidakDitemukan
        );


        return;

    }


    /* =========================================
       DOUBLE SCAN
    ========================================= */

    if(
        result.status ===
        "duplicate"
    ){

        if(
            SCAN_CONFIG.beepError
        ){

            beep(
                350,
                .20
            );

        }


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.resiSudahKembali
        );


        showNotif(
            "DOUBLE SCAN — RESI SUDAH KEMBALI",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.resiSudahKembali
        );


        return;

    }


    /* =========================================
       ERROR
    ========================================= */

    if(
        result.status !==
        "success"
    ){

        if(
            SCAN_CONFIG.beepError
        ){

            beep(
                250,
                .25
            );

        }


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.scanGagal
        );


        showNotif(
            "SCAN GAGAL",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.scanGagal
        );


        return;

    }


    /* =========================================
       DATA HASIL
    ========================================= */

    const now =
        new Date();


    const data = {

        resi:
            normalizeResi(
                result.resi ||
                resi
            ),

        status:
            "SUDAH KEMBALI",

        orderId:
            result.orderId ||
            "",

        sku:
            result.sku ||
            "",

        warna:
            result.warna ||
            "",

        size:
            result.size ||
            "",

        qty:
            Number(
                result.qty
            ) || 0,

        ekspedisi:
            result.ekspedisi ||
            "",

        waktuKembali:
            result.tglKembali
            ? formatDateTime(
                result.tglKembali
            )
            : formatDateTime(
                now
            ),

        waktuScan:
            formatDateTime(
                now
            )

    };


    /* SIMPAN RIWAYAT */

    saveHistory(
        data
    );


    /* FEEDBACK */

    if(
        SCAN_CONFIG.beepSuccess
    ){

        beep(
            750,
            .08
        );

    }


    setStatus(
        "green",
        ROBOT_CONFIG.pesan.barangKembali
    );


    showNotif(
        "✓ BARANG SUDAH KEMBALI",
        "success"
    );


    /* ROBOT HANYA STATUS */

    speak(
        ROBOT_CONFIG.pesan.barangKembali
    );


    /* TAMPILKAN HASIL */

    renderResult(
        data
    );

}


/* =========================================================
   REQUEST KE APPS SCRIPT
========================================================= */

async function scanKeServer(
    resi
){

    const url =
        getTargetUrl();


    if(!url){

        setStatus(
            "red",
            "URL Apps Script tidak ditemukan"
        );


        showNotif(
            "APP_URL TIDAK DITEMUKAN",
            "error"
        );


        return;

    }


    try{

        const response =
            await fetch(

                url,

                {

                    method:"POST",

                    mode:"cors",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            source:
                                "scanRetur",

                            resi:
                                resi

                        })

                }

            );


        const text =
            await response.text();


        console.log(
            "SCAN RETUR RESPONSE:",
            text
        );


        let result;


        try{

            result =
                JSON.parse(
                    text
                );

        }catch(e){

            throw new Error(
                "Response server bukan JSON"
            );

        }


        prosesHasilScan(
            result,
            resi
        );


    }catch(error){

        console.error(
            "SCAN RETUR ERROR:",
            error
        );


        setStatus(
            "red",
            "Koneksi ke server gagal"
        );


        showNotif(
            "KONEKSI SERVER GAGAL",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.scanGagal
        );

    }

}


/* =========================================================
   START CAMERA
========================================================= */

async function mulaiScan(){

    if(
        cameraRunning
    ){

        return;

    }


    cameraRunning =
        true;


    updateCameraButton();


    setStatus(
        "yellow",
        "Menyalakan kamera..."
    );


    try{

        if(!html5QrCode){

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps:15,

                qrbox:{
                    width:280,
                    height:180
                },

                aspectRatio:
                    1.777778

            },


            function(decodedText){

                if(
                    processing
                ){

                    return;

                }


                processing =
                    true;


                const resi =
                    normalizeResi(
                        decodedText
                    );


                if(!resi){

                    processing =
                        false;

                    return;

                }


                scanKeServer(
                    resi
                );


                setTimeout(
                    function(){

                        processing =
                            false;

                    },
                    SCAN_CONFIG.processingDelay
                );

            }

        );


        setStatus(
            "green",
            ROBOT_CONFIG.pesan.kameraAktif
        );


        speak(
            ROBOT_CONFIG.pesan.kameraAktif
        );


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraRunning =
            false;


        updateCameraButton();


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.kameraGagal
        );


        showNotif(
            "IZINKAN AKSES KAMERA",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.kameraGagal
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function berhentiScan(){

    if(
        !cameraRunning
    ){

        updateCameraButton();

        return;

    }


    cameraRunning =
        false;


    updateCameraButton();


    try{

        if(html5QrCode){

            await html5QrCode.stop();

        }

    }catch(e){

        console.error(
            "STOP CAMERA ERROR:",
            e
        );

    }


    setStatus(
        "yellow",
        ROBOT_CONFIG.pesan.kameraBerhenti
    );

}


/* =========================================================
   TOGGLE CAMERA
========================================================= */

function toggleCamera(){

    if(
        cameraRunning
    ){

        berhentiScan();

    }else{

        mulaiScan();

    }

}


/* =========================================================
   UPDATE CAMERA BUTTON
========================================================= */

function updateCameraButton(){

    const btn =
        document.getElementById(
            "cameraButton"
        );


    if(!btn){

        return;

    }


    if(
        cameraRunning
    ){

        btn.innerText =
            "KAMERA OFF";


        btn.classList.add(
            "off"
        );

    }else{

        btn.innerText =
            "KAMERA ON";


        btn.classList.remove(
            "off"
        );

    }

}

========================================================= */

    function(e){

        if(

                ".result-panel"
            ) &&
            !e.target.closest(
                ".history-panel"
            )
        ){

            e.preventDefault();

        }

    },

    {
        passive:false
    }

);
