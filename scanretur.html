
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>SRF • Scan Retur</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
}

body{
    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:52px;
    flex-shrink:0;

    background:#1e293b;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;
}

.back-btn{
    color:#cbd5e1;
    text-decoration:none;

    font-size:11px;
    font-weight:800;

    padding:7px 9px;

    border-radius:7px;
    background:#334155;
}

.header-title{
    font-size:14px;
    font-weight:900;
}

.header-right{
    display:flex;
    gap:5px;
}

.header-btn{
    border:0;
    color:white;

    padding:7px 9px;

    border-radius:7px;

    font-size:9px;
    font-weight:900;

    cursor:pointer;
}

.result-btn{
    background:#2563eb;
}

.manual-btn{
    background:#7c3aed;
}


/* =========================================================
   SCANNER
========================================================= */

.scanner{
    position:relative;

    flex:1;
    min-height:0;

    background:#000;

    overflow:hidden;
}

#reader{
    position:absolute;
    inset:0;

    width:100%!important;
    height:100%!important;

    border:0!important;
    background:#000;
}

#reader video{
    width:100%!important;
    height:100%!important;

    object-fit:cover!important;
}

#reader img,
#reader__dashboard{
    display:none!important;
}

#reader__scan_region{
    width:100%!important;
    height:100%!important;
}


/* =========================================================
   STATUS
========================================================= */

.status-box{
    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    z-index:20;

    background:rgba(15,23,42,.88);

    backdrop-filter:blur(8px);

    border-radius:10px;

    padding:9px 11px;

    display:flex;
    align-items:center;
    gap:8px;

    color:white;
}

.lamp{
    width:12px;
    height:12px;
    min-width:12px;

    border-radius:50%;

    background:#facc15;

    box-shadow:0 0 10px currentColor;
}

.status-text{
    flex:1;

    font-size:12px;
    font-weight:800;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notif{
    position:absolute;

    top:60px;
    left:50%;

    transform:translateX(-50%);

    z-index:40;

    display:none;

    padding:9px 15px;

    border-radius:20px;

    font-size:11px;
    font-weight:900;

    white-space:nowrap;

    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.notif.success{
    background:#16a34a;
    color:white;
}

.notif.warning{
    background:#d97706;
    color:white;
}

.notif.error{
    background:#dc2626;
    color:white;
}

.notif.info{
    background:#2563eb;
    color:white;
}


/* =========================================================
   CAMERA BUTTON
========================================================= */

.camera-area{
    position:absolute;

    left:12px;
    right:12px;
    bottom:12px;

    z-index:25;
}

.camera-btn{
    width:100%;
    height:52px;

    border:0;
    border-radius:27px;

    background:#334155;
    color:white;

    font-size:14px;
    font-weight:900;

    box-shadow:0 5px 15px rgba(0,0,0,.45);

    cursor:pointer;

    touch-action:manipulation;
}

.camera-btn.active{
    background:#16a34a;
}

.camera-btn:active{
    transform:scale(.98);
}


/* =========================================================
   PANEL
========================================================= */

.panel{
    position:absolute;
    inset:0;

    z-index:100;

    display:none;

    overflow-y:auto;

    background:#f1f5f9;

    padding:12px;
}

.panel.open{
    display:block;
}

.panel-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:10px;
}

.panel-title{
    color:#0f172a;

    font-size:16px;
    font-weight:900;
}

.close-btn{
    border:0;

    background:#dc2626;
    color:white;

    padding:8px 11px;

    border-radius:8px;

    font-size:9px;
    font-weight:900;
}


/* =========================================================
   RESULT ITEM
========================================================= */

.result-item{
    background:white;

    border-radius:12px;

    padding:11px;

    margin-bottom:8px;

    box-shadow:0 3px 10px rgba(15,23,42,.07);
}

.result-item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:8px;
}

.result-resi{
    color:#0f172a;

    font-size:12px;
    font-weight:900;

    word-break:break-all;
}

.result-time{
    margin-top:3px;

    color:#64748b;

    font-size:9px;
}

.result-status{
    flex-shrink:0;

    padding:5px 7px;

    border-radius:6px;

    font-size:8px;
    font-weight:900;
}

.status-process{
    background:#fef3c7;
    color:#92400e;
}

.status-success{
    background:#dcfce7;
    color:#166534;
}

.status-double{
    background:#fee2e2;
    color:#991b1b;
}

.status-notfound{
    background:#ffedd5;
    color:#9a3412;
}

.status-timeout{
    background:#e0e7ff;
    color:#3730a3;
}

.status-error{
    background:#fee2e2;
    color:#991b1b;
}

.retry-btn{
    margin-top:8px;

    border:0;

    background:#2563eb;
    color:white;

    padding:7px 10px;

    border-radius:7px;

    font-size:9px;
    font-weight:900;
}

.result-detail{
    display:none;

    margin-top:9px;

    padding-top:9px;

    border-top:1px solid #e2e8f0;
}

.result-item.detail-open .result-detail{
    display:block;
}

.detail-row{
    display:grid;
    grid-template-columns:90px 1fr;

    gap:5px;

    padding:4px 0;

    font-size:10px;
}

.detail-label{
    color:#64748b;
    font-weight:700;
}

.detail-value{
    color:#0f172a;
    font-weight:900;

    word-break:break-word;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    background:white;

    border-radius:12px;

    padding:25px 15px;

    text-align:center;

    color:#94a3b8;

    font-size:12px;
    font-weight:700;
}


/* =========================================================
   MANUAL MODAL
========================================================= */

.manual-modal{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.65);

    backdrop-filter:blur(4px);

    padding:15px;
}

.manual-modal.open{
    display:flex;
}

.manual-box{
    width:100%;
    max-width:390px;

    background:#1e293b;

    border:1px solid #334155;

    border-radius:14px;

    padding:15px;
}

.manual-title{
    color:white;

    font-size:15px;
    font-weight:900;

    margin-bottom:5px;
}

.manual-info{
    color:#94a3b8;

    font-size:10px;

    line-height:1.5;

    margin-bottom:10px;
}

#manualInput{
    width:100%;

    min-height:180px;

    resize:none;

    background:#0f172a;

    color:white;

    border:1px solid #475569;

    border-radius:9px;

    padding:10px;

    outline:none;

    font-size:12px;
    font-weight:700;
}

.manual-actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-top:8px;
}

.manual-actions button{
    border:0;

    padding:11px;

    border-radius:8px;

    color:white;

    font-size:10px;
    font-weight:900;
}

.cancel-btn{
    background:#475569;
}

.process-btn{
    background:#2563eb;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:380px){

    .header-title{
        font-size:12px;
    }

    .header-btn{
        padding:6px;
        font-size:8px;
    }

    .status-text{
        font-size:11px;
    }

    .camera-btn{
        height:50px;
        font-size:13px;
    }

}

</style>

<!-- =========================================================
     CONFIG
     
     APP_URL DIAMBIL DARI config.js
     JANGAN TARUH URL APPS SCRIPT DI SINI
========================================================= -->

<script src="config.js"></script>


<script>

/* =========================================================
   SETTINGS
========================================================= */

/*
 * Timeout dibuat 20 detik.
 *
 * Ini bukan waktu backend bekerja,
 * tetapi batas maksimum browser menunggu response.
 *
 * Apps Script kadang membutuhkan beberapa detik
 * ketika Spreadsheet baru dibuka / sedang idle.
 */

const REQUEST_TIMEOUT = 20000;

const CAMERA_RESUME_DELAY = 1200;

const STORAGE_KEY =
    "srf_scan_retur_results_v5";


/* =========================================================
   STATE
========================================================= */

let html5QrCode = null;

let cameraRunning = false;

let cameraStarting = false;

let scanLocked = false;

let results = [];

let activeRequests = new Map();


/* =========================================================
   LOAD LOCAL
========================================================= */

try{

    results =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "[]"
        );

    if(!Array.isArray(results)){

        results = [];

    }

}catch(e){

    results = [];

}


/* =========================================================
   INIT
========================================================= */

window.addEventListener(
    "load",
    function(){

        renderResults();

        setStatus(
            "yellow",
            "Kamera mati, scanner siap"
        );

        /*
         * Pastikan config.js memang menyediakan APP_URL.
         */

        if(
            typeof APP_URL === "undefined" ||
            !String(APP_URL || "").trim()
        ){

            setStatus(
                "red",
                "APP_URL tidak ditemukan"
            );

            showNotif(
                "CONFIG.JS TIDAK TERBACA",
                "error"
            );

        }

    }
);


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeResi(value){

    return String(value || "")
        .trim()
        .toUpperCase();

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   TIME
========================================================= */

function getTime(){

    return new Date().toLocaleString(
        "id-ID",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(type,text){

    const lamp =
        document.getElementById("lamp");

    const status =
        document.getElementById("statusText");


    if(type === "green"){

        lamp.style.background="#22c55e";
        lamp.style.color="#22c55e";

    }
    else if(type === "red"){

        lamp.style.background="#ef4444";
        lamp.style.color="#ef4444";

    }
    else if(type === "blue"){

        lamp.style.background="#38bdf8";
        lamp.style.color="#38bdf8";

    }
    else{

        lamp.style.background="#facc15";
        lamp.style.color="#facc15";

    }


    status.innerText = text;

}


/* =========================================================
   NOTIFICATION
========================================================= */

function showNotif(text,type="info"){

    const el =
        document.getElementById("notif");

    el.innerText = text;

    el.className =
        "notif " + type;

    el.style.display="block";


    clearTimeout(
        window.notifTimer
    );


    window.notifTimer =
        setTimeout(
            function(){

                el.style.display="none";

            },
            2200
        );

}


/* =========================================================
   BEEP
========================================================= */

function beep(
    frequency=700,
    duration=.08
){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        oscillator.frequency.value =
            frequency;

        oscillator.connect(
            ctx.destination
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime +
            duration
        );

    }catch(e){}

}


/* =========================================================
   ROBOT
========================================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                text
            );

        voice.lang="id-ID";
        voice.rate=1.1;
        voice.pitch=1;
        voice.volume=1;


        speechSynthesis.speak(
            voice
        );

    }catch(e){}

}


/* =========================================================
   SAVE
========================================================= */

function saveResults(){

    try{

        results =
            results.slice(
                0,
                100
            );

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(results)
        );

    }catch(e){

        console.error(
            "LOCAL STORAGE ERROR",
            e
        );

    }

}


/* =========================================================
   ADD PROCESS ITEM
========================================================= */

function addProcessing(resi){

    const item = {

        id:
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        resi:resi,

        status:"MEMERIKSA",

        waktu:getTime(),

        orderId:"",
        sku:"",
        warna:"",
        size:"",
        qty:"",
        ekspedisi:"",

        retry:false,

        error:""

    };


    results.unshift(item);

    results =
        results.slice(
            0,
            100
        );

    saveResults();

    renderResults();


    return item;

}


/* =========================================================
   UPDATE RESULT
========================================================= */

function updateResult(
    item,
    data
){

    Object.assign(
        item,
        data
    );


    saveResults();

    renderResults();

}


/* =========================================================
   REQUEST SERVER
========================================================= */

async function requestServer(resi){

    /*
     * APP_URL HARUS BERASAL DARI config.js
     */

    if(
        typeof APP_URL === "undefined"
    ){

        throw new Error(
            "APP_URL tidak ditemukan dari config.js"
        );

    }


    const url =
        String(APP_URL || "").trim();


    if(!url){

        throw new Error(
            "APP_URL kosong"
        );

    }


    const controller =
        new AbortController();


    let timeoutId = null;


    try{

        /*
         * Timeout 20 detik.
         */

        timeoutId =
            setTimeout(
                function(){

                    controller.abort();

                },
                REQUEST_TIMEOUT
            );


        /*
         * Apps Script Web App.
         *
         * text/plain digunakan agar browser
         * tidak melakukan preflight OPTIONS
         * seperti application/json.
         */

        const response =
            await fetch(
                url,
                {
                    method:"POST",

                    mode:"cors",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({

                            source:
                                "scanRetur",

                            resi:
                                resi

                        }),

                    signal:
                        controller.signal,

                    cache:"no-store"

                }
            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                text
            );

        }


        if(!text){

            throw new Error(
                "Response server kosong"
            );

        }


        let json;


        try{

            json =
                JSON.parse(
                    text
                );

        }catch(parseError){

            console.error(
                "RAW SERVER RESPONSE:",
                text
            );

            throw new Error(
                "Response server bukan JSON: " +
                text.substring(0,200)
            );

        }


        return json;

    }finally{

        if(timeoutId){

            clearTimeout(
                timeoutId
            );

        }

    }

}


/* =========================================================
   PROCESS ONE RESI
========================================================= */

async function processResi(
    rawResi,
    fromScanner=false
){

    const resi =
        normalizeResi(
            rawResi
        );


    if(!resi){

        return false;

    }


    /*
     * Satu resi tidak boleh memiliki
     * dua request aktif bersamaan.
     */

    if(
        activeRequests.has(resi)
    ){

        showNotif(
            resi +
            " masih diproses",
            "warning"
        );

        return false;

    }


    activeRequests.set(
        resi,
        true
    );


    if(fromScanner){

        scanLocked = true;

    }


    const item =
        addProcessing(
            resi
        );


    setStatus(
        "blue",
        "Memeriksa " + resi + "..."
    );


    try{

        const result =
            await requestServer(
                resi
            );


        console.log(
            "SCAN RETUR RESPONSE:",
            result
        );


        /* =================================================
           SUCCESS
        ================================================= */

        if(
            result &&
            result.status === "success"
        ){

            updateResult(
                item,
                {

                    status:
                        "BERHASIL",

                    waktu:
                        getTime(),

                    orderId:
                        result.orderId ||
                        "",

                    sku:
                        result.sku ||
                        "",

                    warna:
                        result.warna ||
                        "",

                    size:
                        result.size ||
                        "",

                    qty:
                        result.qty ||
                        "",

                    ekspedisi:
                        result.ekspedisi ||
                        "",

                    retry:false,

                    error:""

                }
            );


            beep(
                800,
                .08
            );


            setStatus(
                "green",
                "Barang sudah kembali"
            );


            showNotif(
                "BERHASIL • " + resi,
                "success"
            );


            speak(
                "Barang sudah kembali"
            );


            return true;

        }


        /* =================================================
           DUPLICATE
           
           Backend scanRetur() mengirim:
           status: "duplicate"
           
           Bukan "already_scanned".
        ================================================= */

        if(
            result &&
            (
                result.status === "duplicate" ||
                result.status === "already_scanned"
            )
        ){

            updateResult(
                item,
                {

                    status:
                        "DOUBLE SCAN",

                    waktu:
                        getTime(),

                    orderId:
                        result.orderId ||
                        "",

                    sku:
                        result.sku ||
                        "",

                    warna:
                        result.warna ||
                        "",

                    size:
                        result.size ||
                        "",

                    qty:
                        result.qty ||
                        "",

                    ekspedisi:
                        result.ekspedisi ||
                        "",

                    retry:false,

                    error:
                        result.message ||
                        "Resi sudah kembali"

                }
            );


            beep(
                300,
                .15
            );


            setStatus(
                "red",
                "Resi sudah pernah kembali"
            );


            showNotif(
                "DOUBLE SCAN • " + resi,
                "warning"
            );


            speak(
                "Resi sudah pernah kembali"
            );


            return false;

        }


        /* =================================================
           NOT FOUND
        ================================================= */

        if(
            result &&
            result.status === "notfound"
        ){

            updateResult(
                item,
                {

                    status:
                        "TIDAK DITEMUKAN",

                    waktu:
                        getTime(),

                    retry:false,

                    error:
                        result.message ||
                        "Resi tidak ditemukan"

                }
            );


            beep(
                250,
                .2
            );


            setStatus(
                "red",
                "Resi tidak ditemukan"
            );


            showNotif(
                "TIDAK DITEMUKAN • " + resi,
                "error"
            );


            speak(
                "Resi tidak ditemukan"
            );


            return false;

        }


        /* =================================================
           SERVER ERROR
        ================================================= */

        if(
            result &&
            result.status === "error"
        ){

            updateResult(
                item,
                {

                    status:
                        "ERROR",

                    waktu:
                        getTime(),

                    retry:true,

                    error:
                        result.message ||
                        "Server mengembalikan error"

                }
            );


            setStatus(
                "red",
                "Server mengembalikan error"
            );


            showNotif(
                "ERROR • " +
                (result.message || resi),
                "error"
            );


            return false;

        }


        /* =================================================
           UNKNOWN RESPONSE
        ================================================= */

        updateResult(
            item,
            {

                status:
                    "ERROR",

                waktu:
                    getTime(),

                retry:true,

                error:
                    "Response server tidak dikenali"

            }
        );


        setStatus(
            "red",
            "Response server tidak dikenali"
        );


        showNotif(
            "RESPONSE TIDAK DIKENALI",
            "error"
        );


        return false;


    }catch(error){

        console.error(
            "SCAN RETUR ERROR:",
            error
        );


        /* =================================================
           TIMEOUT
        ================================================= */

        if(
            error &&
            error.name === "AbortError"
        ){

            updateResult(
                item,
                {

                    status:
                        "TIMEOUT",

                    waktu:
                        getTime(),

                    retry:true,

                    error:
                        "Server tidak merespons dalam " +
                        (REQUEST_TIMEOUT / 1000) +
                        " detik"

                }
            );


            setStatus(
                "red",
                "Server terlalu lama merespons"
            );


            showNotif(
                "TIMEOUT • " + resi,
                "warning"
            );


            return false;

        }


        /* =================================================
           ERROR BIASA
        ================================================= */

        const message =
            error &&
            error.message
                ? error.message
                : "Koneksi gagal";


        updateResult(
            item,
            {

                status:
                    "ERROR",

                waktu:
                    getTime(),

                retry:true,

                error:
                    message

            }
        );


        setStatus(
            "red",
            "Koneksi gagal"
        );


        showNotif(
            "ERROR • " + resi,
            "error"
        );


        return false;


    }finally{

        /*
         * WAJIB dilepas di finally.
         * Apapun hasil request,
         * resi tidak boleh terkunci selamanya.
         */

        activeRequests.delete(
            resi
        );


        if(fromScanner){

            setTimeout(
                function(){

                    scanLocked = false;

                    if(cameraRunning){

                        setStatus(
                            "green",
                            "Siap scan resi berikutnya"
                        );

                    }

                },
                CAMERA_RESUME_DELAY
            );

        }

    }

}


/* =========================================================
   CAMERA CALLBACK
========================================================= */

function onScanSuccess(
    decodedText
){

    if(scanLocked){

        return;

    }


    const resi =
        normalizeResi(
            decodedText
        );


    if(!resi){

        return;

    }


    scanLocked = true;


    beep(
        600,
        .05
    );


    processResi(
        resi,
        true
    );

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

    if(
        cameraRunning ||
        cameraStarting
    ){

        return;

    }


    cameraStarting = true;


    setStatus(
        "yellow",
        "Menyalakan kamera..."
    );


    try{

        if(!html5QrCode){

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps:5,

                qrbox:{
                    width:280,
                    height:160
                },

                aspectRatio:
                    1.777778

            },

            onScanSuccess,

            function(){

                /*
                 * Error frame scanner
                 * tidak ditampilkan.
                 */

            }

        );


        cameraRunning = true;

        cameraStarting = false;


        const btn =
            document.getElementById(
                "cameraButton"
            );


        btn.classList.add(
            "active"
        );


        btn.innerText =
            "MATIKAN KAMERA";


        setStatus(
            "green",
            "Kamera aktif, siap scan"
        );


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraRunning = false;

        cameraStarting = false;


        const btn =
            document.getElementById(
                "cameraButton"
            );


        btn.classList.remove(
            "active"
        );


        btn.innerText =
            "AKTIFKAN KAMERA";


        setStatus(
            "red",
            "Tidak dapat membuka kamera"
        );


        showNotif(
            "IZINKAN AKSES KAMERA",
            "error"
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopCamera(){

    if(!cameraRunning){

        return;

    }


    cameraRunning = false;

    scanLocked = false;


    const btn =
        document.getElementById(
            "cameraButton"
        );


    btn.classList.remove(
        "active"
    );


    btn.innerText =
        "AKTIFKAN KAMERA";


    try{

        if(html5QrCode){

            await html5QrCode.stop();

        }

    }catch(e){

        console.error(
            "STOP CAMERA ERROR:",
            e
        );

    }


    setStatus(
        "yellow",
        "Kamera mati, scanner siap"
    );

}


/* =========================================================
   CAMERA BUTTON
========================================================= */

document
    .getElementById(
        "cameraButton"
    )
    .addEventListener(
        "click",
        function(){

            if(cameraRunning){

                stopCamera();

            }else{

                startCamera();

            }

        }
    );


/* =========================================================
   MANUAL MODAL
========================================================= */

function openManual(){

    document
        .getElementById(
            "manualModal"
        )
        .classList.add(
            "open"
        );


    setTimeout(
        function(){

            document
                .getElementById(
                    "manualInput"
                )
                .focus();

        },
        100
    );

}


function closeManual(){

    document
        .getElementById(
            "manualModal"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   PARSE MANUAL
========================================================= */

function parseManualInput(text){

    return String(text || "")

        .split(
            /[\s,;]+/
        )

        .map(
            function(x){

                return normalizeResi(x);

            }
        )

        .filter(Boolean);

}


/* =========================================================
   MANUAL PROCESS
========================================================= */

async function processManual(){

    const input =
        document.getElementById(
            "manualInput"
        );


    const button =
        document.getElementById(
            "manualProcessButton"
        );


    const text =
        input.value.trim();


    if(!text){

        showNotif(
            "Masukkan resi dulu",
            "warning"
        );

        return;

    }


    /* =====================================================
       CLEAR
    ===================================================== */

    if(
        text.toUpperCase() === "CLEAR"
    ){

        const yakin =
            confirm(
                "Hapus semua riwayat scan lokal?"
            );


        if(yakin){

            results = [];

            saveResults();

            renderResults();

            showNotif(
                "RIWAYAT DIBERSIHKAN",
                "success"
            );

        }


        input.value = "";

        return;

    }


    const list =
        parseManualInput(
            text
        );


    if(!list.length){

        showNotif(
            "Tidak ada resi valid",
            "warning"
        );

        return;

    }


    /*
     * Tombol dikunci selama proses.
     * Ini mencegah klik PROSES berkali-kali
     * untuk resi yang sama.
     */

    button.disabled = true;

    button.innerText =
        "MEMPROSES...";


    try{

        closeManual();


        /*
         * Diproses satu per satu.
         *
         * Kalau hanya satu resi,
         * hanya satu request yang dikirim.
         */

        for(
            const resi of list
        ){

            await processResi(
                resi,
                false
            );

        }


        openResults();


    }finally{

        button.disabled = false;

        button.innerText =
            "PROSES";

    }

}


/* =========================================================
   RESULT PANEL
========================================================= */

function openResults(){

    document
        .getElementById(
            "resultPanel"
        )
        .classList.add(
            "open"
        );


    renderResults();

}


function closeResults(){

    document
        .getElementById(
            "resultPanel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
){

    switch(status){

        case "MEMERIKSA":
            return "status-process";

        case "BERHASIL":
            return "status-success";

        case "DOUBLE SCAN":
            return "status-double";

        case "TIDAK DITEMUKAN":
            return "status-notfound";

        case "TIMEOUT":
            return "status-timeout";

        default:
            return "status-error";

    }

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(){

    const container =
        document.getElementById(
            "resultList"
        );


    if(!container){

        return;

    }


    if(!results.length){

        container.innerHTML = `

            <div class="empty">

                Belum ada hasil scan.

            </div>

        `;

        return;

    }


    container.innerHTML =
        results.map(
            function(item){

                return `

                    <div
                        class="result-item"
                        data-id="${escapeHTML(item.id)}">

                        <div
                            class="result-item-top">

                            <div>

                                <div
                                    class="result-resi">

                                    ${escapeHTML(
                                        item.resi
                                    )}

                                </div>

                                <div
                                    class="result-time">

                                    ${escapeHTML(
                                        item.waktu || "-"
                                    )}

                                </div>

                            </div>

                            <div
                                class="result-status ${getStatusClass(item.status)}">

                                ${escapeHTML(
                                    item.status
                                )}

                            </div>

                        </div>


                        <div class="result-detail">

                            <div class="detail-row">

                                <div class="detail-label">
                                    Order ID
                                </div>

                                <div class="detail-value">
                                    ${escapeHTML(
                                        item.orderId || "-"
                                    )}
                                </div>

                            </div>


                            <div class="detail-row">

                                <div class="detail-label">
                                    SKU
                                </div>

                                <div class="detail-value">
                                    ${escapeHTML(
                                        item.sku || "-"
                                    )}
                                </div>

                            </div>


                            <div class="detail-row">

                                <div class="detail-label">
                                    Warna
                                </div>

                                <div class="detail-value">
                                    ${escapeHTML(
                                        item.warna || "-"
                                    )}
                                </div>

                            </div>


                            <div class="detail-row">

                                <div class="detail-label">
                                    Size
                                </div>

                                <div class="detail-value">
                                    ${escapeHTML(
                                        item.size || "-"
                                    )}
                                </div>

                            </div>


                            <div class="detail-row">

                                <div class="detail-label">
                                    Qty
                                </div>

                                <div class="detail-value">
                                    ${escapeHTML(
                                        item.qty || "-"
                                    )}
                                </div>

                            </div>


                            <div class="detail-row">

                                <div class="detail-label">
                                    Ekspedisi
                                </div>

                                <div class="detail-value">
                                    ${escapeHTML(
                                        item.ekspedisi || "-"
                                    )}
                                </div>

                            </div>


                            ${
                                item.error
                                ?
                                `

                                <div class="detail-row">

                                    <div class="detail-label">
                                        Keterangan
                                    </div>

                                    <div class="detail-value">
                                        ${escapeHTML(
                                            item.error
                                        )}
                                    </div>

                                </div>

                                `
                                :
                                ""
                            }


                            ${
                                item.retry
                                ?
                                `

                                <button
                                    class="retry-btn"
                                    onclick="retryResult('${escapeHTML(item.id)}')">

                                    COBA LAGI

                                </button>

                                `
                                :
                                ""
                            }

                        </div>

                    </div>

                `;

            }
        )
        .join("");


    container
        .querySelectorAll(
            ".result-item"
        )
        .forEach(
            function(card){

                card.addEventListener(
                    "click",
                    function(e){

                        if(
                            e.target.closest(
                                ".retry-btn"
                            )
                        ){

                            return;

                        }


                        card.classList.toggle(
                            "detail-open"
                        );

                    }
                );

            }
        );

}


/* =========================================================
   RETRY
========================================================= */

async function retryResult(id){

    const item =
        results.find(
            function(x){

                return String(x.id) ===
                       String(id);

            }
        );


    if(!item){

        return;

    }


    if(
        activeRequests.has(
            item.resi
        )
    ){

        showNotif(
            "Resi masih diproses",
            "warning"
        );

        return;

    }


    await processResi(
        item.resi,
        false
    );

}


/* =========================================================
   CLOSE MANUAL OUTSIDE
========================================================= */

document
    .getElementById(
        "manualModal"
    )
    .addEventListener(
        "click",
        function(e){

            if(
                e.target === this
            ){

                closeManual();

            }

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document
    .getElementById(
        "manualInput"
    )
    .addEventListener(
        "keydown",
        function(e){

            if(
                e.key === "Enter" &&
                e.ctrlKey
            ){

                e.preventDefault();

                processManual();

            }

        }
    );

</script>
