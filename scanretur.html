/* =========================================================
   BEEP
========================================================= */

function beep(
    freq=600,
    duration=.08
){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        osc.frequency.value =
            freq;

        osc.connect(
            ctx.destination
        );

        osc.start();

        osc.stop(
            ctx.currentTime +
            duration
        );

    }catch(e){}

}


/* =========================================================
   ROBOT
========================================================= */

function speak(text){

    if(
        !ROBOT_CONFIG.enabled
    ){

        return;

    }

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                text
            );


        voice.lang =
            ROBOT_CONFIG.bahasa;

        voice.rate =
            ROBOT_CONFIG.rate;

        voice.pitch =
            ROBOT_CONFIG.pitch;

        voice.volume =
            ROBOT_CONFIG.volume;


        speechSynthesis.speak(
            voice
        );

    }catch(e){

        console.error(
            "ROBOT ERROR:",
            e
        );

    }

}


/* =========================================================
   NORMALIZE RESI

function normalizeResi(resi){

    return String(
        resi || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PARSE ITEM DARI DATA GOOGLE SHEET
=========================================================

   Contoh:

   SKU:
   069 | MACKER ROBLOX BAIM

   WARNA:
   abu | abu

   SIZE:
   30-31 | 34-35

   QTY:
   2

   Hasil:

   069                abu  30-31  1
   MACKER ROBLOX BAIM abu  34-35  1

========================================================= */

function parseItems(data){

    const skuRaw =
        String(
            data.sku || ""
        ).trim();

    const warnaRaw =
        String(
            data.warna || ""
        ).trim();

    const sizeRaw =
        String(
            data.size || ""
        ).trim();

    const totalQty =
        Number(data.qty) || 0;


    const skuList =
        skuRaw
            ? skuRaw
                .split("|")
                .map(x => x.trim())
                .filter(Boolean)
            : [];


    const warnaList =
        warnaRaw
            ? warnaRaw
                .split("|")
                .map(x => x.trim())
            : [];


    const sizeList =
        sizeRaw
            ? sizeRaw
                .split("|")
                .map(x => x.trim())
            : [];


    /*
     * Jumlah item ditentukan
     * dari SKU.
     */

    const itemCount =
        Math.max(
            skuList.length,
            warnaList.length,
            sizeList.length,
            1
        );


    const items = [];


    /*
     * Jika satu item,
     * gunakan seluruh qty.
     */

    if(itemCount === 1){

        items.push({

            nama:
                skuList[0] ||
                "-",

            warna:
                warnaList[0] ||
                "-",

            size:
                sizeList[0] ||
                "-",

            qty:
                totalQty || 1

        });


        return items;

    }


    /*
     * Jika banyak item:
     *
     * Qty total dibagi ke
     * jumlah item.
     *
     * Contoh:
     * 2 item + qty 2
     * = masing-masing 1.
     */

    let sisaQty =
        totalQty;


    for(
        let i=0;
        i<itemCount;
        i++
    ){

        let qtyItem = 1;


        if(
            i === itemCount - 1 &&
            sisaQty > 0
        ){

            qtyItem =
                sisaQty;

        }


        if(
            sisaQty > 0
        ){

            sisaQty--;

        }


        items.push({

            nama:
                skuList[i] ||
                "-",

            warna:
                warnaList[i] ||
                warnaList[0] ||
                "-",

            size:
                sizeList[i] ||
                sizeList[0] ||
                "-",

            qty:
                qtyItem

        });

    }


    return items;

}


/* =========================================================
   FORMAT TANGGAL
========================================================= */

function formatDateTime(value){

    if(!value){

        return "-";

    }


    try{

        const d =
            new Date(value);


        if(
            isNaN(
                d.getTime()
            )
        ){

            return String(value);

        }


        return d.toLocaleString(
            "id-ID",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    }catch(e){

        return String(value);

    }

}


/* =========================================================
   RENDER HASIL SCAN
========================================================= */

function renderResult(data){

    const container =
        document.getElementById(
            "resultContainer"
        );


    container.innerHTML = "";


    if(!data){

        container.innerHTML = `

            <div class="history-empty">

                Belum ada hasil scan.

            </div>

        `;

        return;

    }


    const items =
        parseItems(data);


    let rows = "";


    items.forEach(
        function(item){

            rows += `

                <tr>

                    <td>

                        ${escapeHTML(
                            item.nama
                        )}

                    </td>

                    <td>

                        ${escapeHTML(
                            item.warna
                        )}

                    </td>

                    <td>

                        ${escapeHTML(
                            item.size
                        )}

                    </td>

                    <td>

                        <span
                            class="qty-badge">

                            ${escapeHTML(
                                item.qty
                            )}

                        </span>

                    </td>

                </tr>

            `;

        }
    );


    const total =
        items.reduce(
            function(sum,item){

                return sum +
                    Number(item.qty || 0);

            },
            0
        );


    container.innerHTML = `

        <div class="result-card">

            <div class="result-header">

                <div class="result-resi">

                    ${escapeHTML(
                        data.resi
                    )}

                </div>

                <div class="result-status">

                    SUDAH KEMBALI

                </div>

            </div>

/* =========================================================
   HASIL SCAN PANEL
========================================================= */

function openResultPanel(){

    closeHistoryPanel();

    document
        .getElementById(
            "resultPanel"
        )
        .classList.add(
            "open"
        );


    if(scanHistory.length){

        renderResult(
            scanHistory[0]
        );

    }else{

        renderResult(null);

    }

}


function closeResultPanel(){

    document
        .getElementById(
            "resultPanel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   RIWAYAT
========================================================= */

function saveHistory(data){

    scanHistory.unshift(
        data
    );


    /*
     * Maksimal 100 hasil.
     */

    scanHistory =
        scanHistory.slice(
            0,
            100
        );


    localStorage.setItem(
        STORAGE_HISTORY,
        JSON.stringify(
            scanHistory
        )
    );


    renderHistory();

}


function renderHistory(){

    const container =
        document.getElementById(
            "historyContainer"
        );


    if(!container){

        return;

    }


    container.innerHTML =
        "";


    if(
        scanHistory.length === 0
    ){

        container.innerHTML = `

            <div class="history-empty">

                Belum ada riwayat scan.

            </div>

        `;

        return;

    }


    scanHistory.forEach(
        function(item,index){

            const items =
                parseItems(item);


            const total =
                items.reduce(
                    function(sum,x){

                        return sum +
                            Number(x.qty || 0);

                    },
                    0
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML = `

                <div class="history-item-top">

                    <div>

                        <div class="history-resi">

                            ${escapeHTML(
                                item.resi
                            )}

                        </div>

                        <div class="history-time">

                            ${escapeHTML(
                                item.waktuScan ||
                                "-"
                            )}

                        </div>

                    </div>


                    <div class="history-count">

                        ${total} PASANG

                    </div>

                </div>

            `;


            div.addEventListener(
                "click",
                function(){

                    closeHistoryPanel();

                    document
                        .getElementById(
                            "resultPanel"
                        )
                        .classList.add(
                            "open"
                        );

                    renderResult(
                        item
                    );

                }
            );


            container.appendChild(
                div
            );

        }
    );

}


function openHistoryPanel(){

    closeResultPanel();

    renderHistory();

    document
        .getElementById(
            "historyPanel"
        )
        .classList.add(
            "open"
        );

}


function closeHistoryPanel(){

    document
        .getElementById(
            "historyPanel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   PROSES HASIL DARI SERVER
========================================================= */

function prosesHasilScan(
    result,
    resi
){

    /*
     * NOT FOUND
     */

    if(
        result.status ===
        "notfound"
    ){

        if(
            SCAN_CONFIG.beepError
        ){

            beep(
                250,
                .25
            );

        }


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.resiTidakDitemukan
        );


        showNotif(
            "RESI TIDAK DITEMUKAN",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.resiTidakDitemukan
        );


        return;

    }


    /*
     * ERROR
     */

    if(
        result.status !==
        "success"
    ){

        if(
            SCAN_CONFIG.beepError
        ){

            beep(
                250,
                .25
            );

        }


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.scanGagal
        );


        showNotif(
            "SCAN GAGAL",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.scanGagal
        );


        return;

    }


    /*
     * DATA HASIL
     */

    const data = {

        resi:
            normalizeResi(
                result.resi ||
                resi
            ),

        status:
            "SUDAH KEMBALI",

        orderId:
            result.orderId ||
            "",

        sku:
            result.sku ||
            "",

        warna:
            result.warna ||
            "",

        size:
            result.size ||
            "",

        qty:
            Number(
                result.qty
            ) || 0,

        ekspedisi:
            result.ekspedisi ||
            "",

        waktuKembali:
            formatDateTime(
                new Date()
            ),

        waktuScan:
            formatDateTime(
                new Date()
            )

    };


    /*
     * Simpan riwayat
     */

    saveHistory(
        data
    );


    /*
     * Feedback
     */

    if(
        SCAN_CONFIG.beepSuccess
    ){

        beep(
            750,
            .08
        );

    }


    setStatus(
        "green",
        "Barang sudah kembali"
    );


    showNotif(
        "✓ BARANG SUDAH KEMBALI",
        "success"
    );


    /*
     * ROBOT HANYA STATUS
     */

    speak(
        ROBOT_CONFIG.pesan.barangKembali
    );


    /*
     * Buka hasil otomatis
     */

    renderResult(
        data
    );

}


/* =========================================================
   REQUEST SCAN RETUR
========================================================= */

async function scanKeServer(
    resi
){

    const url =
        getTargetUrl();


    if(!url){

        setStatus(
            "red",
            "URL Apps Script tidak ditemukan"
        );


        showNotif(
            "APP_URL TIDAK DITEMUKAN",
            "error"
        );


        return;

    }


    try{

        const response =
            await fetch(

                url,

                {

                    method:"POST",

                    mode:"cors",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            source:
                                "scanRetur",

                            resi:
                                resi

                        })

                }

            );


        const text =
            await response.text();


        console.log(
            "SCAN RETUR RESPONSE:",
            text
        );


        let result;


        try{

            result =
                JSON.parse(
                    text
                );

        }catch(e){

            throw new Error(
                "Response server bukan JSON"
            );

        }


        prosesHasilScan(
            result,
            resi
        );


    }catch(error){

        console.error(
            "SCAN RETUR ERROR:",
            error
        );


        setStatus(
            "red",
            "Koneksi ke server gagal"
        );


        showNotif(
            "KONEKSI SERVER GAGAL",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.scanGagal
        );

    }

}


/* =========================================================
   START CAMERA
========================================================= */

async function mulaiScan(){

    if(
        cameraRunning
    ){

        return;

    }


    cameraRunning =
        true;


    const btn =
        document.getElementById(
            "scanButton"
        );


    btn.classList.add(
        "active"
    );


    btn.innerText =
        "🔴 LEPASKAN UNTUK BERHENTI";


    setStatus(
        "yellow",
        "Menyalakan kamera..."
    );


    try{

        if(!html5QrCode){

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps:15,

                qrbox:{

                    width:280,

                    height:180

                },

                aspectRatio:
                    1.777778

            },


            function(decodedText){

                if(
                    processing
                ){

                    return;

                }


                processing =
                    true;


                const resi =
                    normalizeResi(
                        decodedText
                    );


                if(!resi){

                    processing =
                        false;

                    return;

                }


                scanKeServer(
                    resi
                );


                setTimeout(
                    function(){

                        processing =
                            false;

                    },
                    SCAN_CONFIG.processingDelay
                );

            }

        );


        setStatus(
            "green",
            ROBOT_CONFIG.pesan.kameraAktif
        );


        speak(
            ROBOT_CONFIG.pesan.kameraAktif
        );


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraRunning =
            false;


        btn.classList.remove(
            "active"
        );


        btn.innerText =
            "📷 TAHAN UNTUK SCAN";


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.kameraGagal
        );


        showNotif(
            "IZINKAN AKSES KAMERA",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.kameraGagal
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function berhentiScan(){

    if(
        !cameraRunning
    ){

        return;

    }


    cameraRunning =
        false;


    const btn =
        document.getElementById(
            "scanButton"
        );


    btn.classList.remove(
        "active"
    );


    btn.innerText =
        "📷 TAHAN UNTUK SCAN";


    try{

        if(html5QrCode){

            await html5QrCode.stop();

        }

    }catch(e){}


    setStatus(
        "yellow",
        ROBOT_CONFIG.pesan.kameraBerhenti
    );

}

scanButton.addEventListener(
