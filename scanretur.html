
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0f172a">

<title>SRF V3 - Scan Retur</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
    color:#fff;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:48px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:#0f172a;
    border-bottom:1px solid #334155;
}

.header a{
    color:#cbd5e1;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.header-title{
    font-size:14px;
    font-weight:900;
}

.header-right{
    width:45px;
}

/* =========================
   CAMERA
========================= */

.camera-area{
    position:relative;
    flex:1;

    min-height:0;

    background:#000;
    overflow:hidden;
}

#reader{
    width:100% !important;
    height:100% !important;

    border:none !important;
}

#reader video{
    width:100% !important;
    height:100% !important;

    object-fit:cover !important;
}

/* Hilangkan UI bawaan html5-qrcode */
#reader__dashboard{
    display:none !important;
}

#reader__scan_region{
    width:100% !important;
    height:100% !important;
}

/* =========================
   CAMERA OVERLAY
========================= */

.camera-status{
    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.status-pill{
    display:flex;
    align-items:center;
    gap:8px;

    padding:7px 11px;

    background:rgba(15,23,42,.82);
    border:1px solid rgba(255,255,255,.12);

    border-radius:20px;

    font-size:11px;
    font-weight:800;

    backdrop-filter:blur(5px);
}

.status-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#f59e0b;

    box-shadow:0 0 8px currentColor;
}

.count-pill{
    padding:7px 11px;

    background:rgba(15,23,42,.82);
    border:1px solid rgba(255,255,255,.12);

    border-radius:20px;

    font-size:11px;
    font-weight:900;

    backdrop-filter:blur(5px);
}

/* =========================
   CAMERA FRAME
========================= */

.scan-frame{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:min(72vw,300px);
    height:150px;

    border:2px solid rgba(255,255,255,.8);

    border-radius:16px;

    z-index:10;

    pointer-events:none;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.15);
}

.scan-line{
    position:absolute;

    left:10px;
    right:10px;

    top:50%;

    height:2px;

    background:#22c55e;

    box-shadow:0 0 10px #22c55e;

    animation:scanLine 1.8s linear infinite;
}

@keyframes scanLine{
    0%{top:15%}
    50%{top:85%}
    100%{top:15%}
}

/* =========================
   FLOATING BUTTON
========================= */

.camera-buttons{
    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    z-index:30;

    display:flex;
    justify-content:flex-end;
}

.float-btn{
    border:1px solid rgba(255,255,255,.18);

    background:rgba(15,23,42,.88);

    color:#fff;

    padding:9px 13px;

    border-radius:9px;

    font-size:11px;
    font-weight:800;

    cursor:pointer;

    backdrop-filter:blur(5px);
}

/* =========================
   BOTTOM PANEL
========================= */

.bottom-panel{
    flex-shrink:0;

    height:40vh;
    min-height:220px;
    max-height:380px;

    background:#0f172a;

    border-top:1px solid #334155;

    display:flex;
    flex-direction:column;
}

/* =========================
   TABS
========================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    height:43px;

    flex-shrink:0;

    border-bottom:1px solid #334155;
}

.tab{
    border:0;

    background:#1e293b;

    color:#94a3b8;

    font-size:10px;
    font-weight:900;

    cursor:pointer;

    border-right:1px solid #334155;
}

.tab:last-child{
    border-right:0;
}

.tab.active{
    background:#334155;
    color:#fff;
}

/* =========================
   TAB CONTENT
========================= */

.tab-content{
    flex:1;

    min-height:0;

    overflow:hidden;
}

.tab-pane{
    display:none;

    height:100%;

    overflow-y:auto;

    padding:8px;
}

.tab-pane.active{
    display:block;
}

/* =========================
   PROCESS ITEM
========================= */

.item{
    background:#1e293b;

    border:1px solid #334155;

    border-radius:9px;

    padding:9px 10px;

    margin-bottom:7px;
}

.item-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:8px;
}

.resi{
    font-size:12px;
    font-weight:900;

    word-break:break-all;
}

.time{
    color:#64748b;
    font-size:9px;
    margin-top:3px;
}

.badge{
    flex-shrink:0;

    padding:4px 7px;

    border-radius:5px;

    font-size:9px;
    font-weight:900;
}

.badge-process{
    background:#78350f;
    color:#fbbf24;
}

.badge-success{
    background:#064e3b;
    color:#34d399;
}

.badge-notfound{
    background:#7f1d1d;
    color:#f87171;
}

.badge-timeout{
    background:#713f12;
    color:#fde047;
}

.badge-already{
    background:#4c1d95;
    color:#c4b5fd;
}

.retry-btn{
    margin-top:7px;

    width:100%;

    border:0;

    background:#2563eb;
    color:#fff;

    padding:7px;

    border-radius:6px;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;

    color:#64748b;

    font-size:11px;
    font-weight:700;

    padding:25px 10px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.65);

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:360px;

    background:#1e293b;

    border:1px solid #334155;

    border-radius:14px;

    padding:16px;
}

.modal-title{
    font-size:15px;
    font-weight:900;

    margin-bottom:5px;
}

.modal-desc{
    font-size:10px;

    color:#94a3b8;

    line-height:1.5;

    margin-bottom:10px;
}

textarea{
    width:100%;
    height:150px;

    resize:none;

    padding:10px;

    border-radius:8px;

    border:1px solid #475569;

    background:#0f172a;

    color:#fff;

    outline:none;

    font-size:12px;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:10px;
}

.modal-btn{
    border:0;

    padding:10px;

    border-radius:7px;

    font-size:11px;
    font-weight:900;

    cursor:pointer;
}

.btn-cancel{
    background:#475569;
    color:#fff;
}

.btn-submit{
    background:#2563eb;
    color:#fff;
}

.btn-clear{
    width:100%;

    margin-top:8px;

    background:#991b1b;
    color:#fff;

    border:0;

    padding:9px;

    border-radius:7px;

    font-size:10px;
    font-weight:900;

    cursor:pointer;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:calc(40vh + 15px);

    transform:translateX(-50%) translateY(20px);

    z-index:200;

    opacity:0;

    pointer-events:none;

    min-width:230px;
    max-width:90%;

    text-align:center;

    padding:10px 13px;

    border-radius:9px;

    background:#020617;

    border:1px solid #334155;

    color:#fff;

    font-size:11px;
    font-weight:900;

    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-height:650px){

    .bottom-panel{
        height:38vh;
        min-height:190px;
    }

    .scan-frame{
        height:125px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <a href="index.html">← Menu</a>

    <div class="header-title">
        SCAN RETUR
    </div>

    <div class="header-right"></div>

</header>


<!-- =========================
     CAMERA
========================= -->

<section class="camera-area">

    <div id="reader"></div>

    <div class="camera-status">

        <div class="status-pill">
            <span class="status-dot" id="statusDot"></span>
            <span id="cameraStatus">
                MENYALAKAN KAMERA...
            </span>
        </div>

        <div class="count-pill">
            ANTREAN <span id="processCount">0</span>
        </div>

    </div>

    <div class="scan-frame">
        <div class="scan-line"></div>
    </div>

    <div class="camera-buttons">

        <button
            class="float-btn"
            onclick="openManual()">

            INPUT MANUAL

        </button>

    </div>

</section>


<!-- =========================
     BOTTOM PANEL
========================= -->

<section class="bottom-panel">

    <div class="tabs">

        <button
            class="tab active"
            data-tab="process"
            onclick="openTab('process')">

            PROSES
            (<span id="processTabCount">0</span>)

        </button>

        <button
            class="tab"
            data-tab="history"
            onclick="openTab('history')">

            RIWAYAT
            (<span id="historyCount">0</span>)

        </button>

        <button
            class="tab"
            data-tab="notfound"
            onclick="openTab('notfound')">

            TIDAK DITEMUKAN
            (<span id="notfoundCount">0</span>)

        </button>

    </div>


    <div class="tab-content">

        <div
            id="tab-process"
            class="tab-pane active">

            <div
                id="processList">
            </div>

        </div>


        <div
            id="tab-history"
            class="tab-pane">

            <div
                id="historyList">
            </div>

        </div>


        <div
            id="tab-notfound"
            class="tab-pane">

            <div
                id="notfoundList">
            </div>

        </div>

    </div>

</section>


<!-- =========================
     MANUAL MODAL
========================= -->

<div
    id="manualModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Input Manual Resi
        </div>

        <div class="modal-desc">

            Bisa masukkan satu atau banyak resi.
            Pisahkan dengan Enter atau spasi.

        </div>

        <textarea
            id="manualInput"
            placeholder="JY1261687193
JY1262837600
JY1197060858"></textarea>

        <div class="modal-actions">

            <button
                class="modal-btn btn-cancel"
                onclick="closeManual()">

                TUTUP

            </button>

            <button
                class="modal-btn btn-submit"
                onclick="submitManual()">

                PROSES

            </button>

        </div>

        <button
            class="btn-clear"
            onclick="clearLocalData()">

            CLEAR RIWAYAT & CACHE

        </button>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const APP_URL =
"https://script.google.com/macros/s/AKfycbyuJTOZaFhOZ52fKFKPCxFIulD5rTFJb6VehsELtOZgjmaJf0Epc4Jm71gcPVLtE9sJK/exec";


/* =========================================================
   SETTINGS
========================================================= */

const REQUEST_TIMEOUT = 10000;

/*
   Maksimal request yang berjalan bersamaan.
   Dibuat terbatas agar Apps Script tidak dibanjiri
   ketika user scan sangat cepat.
*/
const MAX_CONCURRENT = 3;


/* =========================================================
   LOCAL STORAGE
========================================================= */

const STORAGE_PROCESS =
"SRF_V3_RETUR_PROCESS";

const STORAGE_HISTORY =
"SRF_V3_RETUR_HISTORY";

const STORAGE_NOTFOUND =
"SRF_V3_RETUR_NOTFOUND";


let processList =
loadStorage(STORAGE_PROCESS);

let historyList =
loadStorage(STORAGE_HISTORY);

let notFoundList =
loadStorage(STORAGE_NOTFOUND);


/* =========================================================
   RUNTIME
========================================================= */

let html5QrCode = null;

let cameraStarted = false;

let runningRequests = 0;

let requestQueue = [];

let lastCameraText = "";

let lastCameraTime = 0;


/* =========================================================
   STORAGE
========================================================= */

function loadStorage(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(key) || "[]"
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(e){

        return [];

    }

}


function saveStorage(){

    localStorage.setItem(
        STORAGE_PROCESS,
        JSON.stringify(processList)
    );

    localStorage.setItem(
        STORAGE_HISTORY,
        JSON.stringify(historyList)
    );

    localStorage.setItem(
        STORAGE_NOTFOUND,
        JSON.stringify(notFoundList)
    );

}


/* =========================================================
   NORMALIZE RESI
========================================================= */

function normalizeResi(value){

    return String(value || "")
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"")
        .trim();

}


/* =========================================================
   CEK RESI LOKAL
========================================================= */

function findLocalResi(resi){

    const r =
        normalizeResi(resi);

    if(
        processList.some(
            x => x.resi === r
        )
    ){

        return "process";

    }

    if(
        historyList.some(
            x => x.resi === r
        )
    ){

        return "history";

    }

    if(
        notFoundList.some(
            x => x.resi === r
        )
    ){

        return "notfound";

    }

    return null;

}


/* =========================================================
   ADD PROCESS
========================================================= */

function addToProcess(resi){

    const item = {

        resi: resi,

        status:"MEMERIKSA",

        time:new Date().toISOString(),

        retrying:false

    };

    processList.unshift(item);

    saveStorage();

    renderAll();

    return item;

}


/* =========================================================
   REMOVE PROCESS
========================================================= */

function removeProcess(resi){

    const index =
        processList.findIndex(
            x => x.resi === resi
        );

    if(index !== -1){

        return processList.splice(
            index,
            1
        )[0];

    }

    return null;

}


/* =========================================================
   ADD HISTORY
========================================================= */

function addHistory(
    resi,
    status
){

    /*
       Hapus kalau ternyata masih ada
       di process.
    */

    removeProcess(resi);

    /*
       Jangan masukkan dua kali.
    */

    if(
        historyList.some(
            x => x.resi === resi
        )
    ){

        saveStorage();

        renderAll();

        return;

    }

    historyList.unshift({

        resi:resi,

        status:status,

        time:new Date().toISOString()

    });

    /*
       Batasi history lokal.
       Bisa dinaikkan kalau diperlukan.
    */

    historyList =
        historyList.slice(0,500);

    saveStorage();

    renderAll();

}


/* =========================================================
   ADD NOT FOUND
========================================================= */

function addNotFound(resi){

    removeProcess(resi);

    if(
        notFoundList.some(
            x => x.resi === resi
        )
    ){

        saveStorage();

        renderAll();

        return;

    }

    notFoundList.unshift({

        resi:resi,

        status:"TIDAK DITEMUKAN",

        time:new Date().toISOString()

    });

    notFoundList =
        notFoundList.slice(0,500);

    saveStorage();

    renderAll();

}


/* =========================================================
   SCAN BARCODE
========================================================= */

function onScanSuccess(decodedText){

    const resi =
        normalizeResi(decodedText);

    if(!resi){

        return;

    }


    /*
       Anti spam dari kamera.
       Tetap ada walaupun local check
       sudah bekerja.
    */

    const now =
        Date.now();

    if(
        resi === lastCameraText &&
        now - lastCameraTime < 1000
    ){

        return;

    }

    lastCameraText = resi;

    lastCameraTime = now;


    /*
       PENTING:
       CEK LOKAL SEBELUM REQUEST.
    */

    const localStatus =
        findLocalResi(resi);


    if(localStatus === "process"){

        showToast(
            "RESI SUDAH MASUK DAFTAR PROSES"
        );

        speak(
            "Resi sudah masuk daftar proses"
        );

        return;

    }


    if(localStatus === "history"){

        showToast(
            "RESI SUDAH PERNAH DIPROSES"
        );

        speak(
            "Resi sudah pernah diproses"
        );

        return;

    }


    if(localStatus === "notfound"){

        showToast(
            "RESI SUDAH ADA DI DAFTAR TIDAK DITEMUKAN"
        );

        speak(
            "Resi sudah ada di daftar tidak ditemukan"
        );

        return;

    }


    /*
       Resi baru.
       LANGSUNG masukkan antrean.
    */

    addToProcess(resi);

    requestQueue.push(resi);

    updateProcessCount();

    runQueue();

}


/* =========================================================
   QUEUE PROCESSOR
========================================================= */

function runQueue(){

    while(
        runningRequests < MAX_CONCURRENT &&
        requestQueue.length > 0
    ){

        const resi =
            requestQueue.shift();

        checkResi(resi);

    }

}


/* =========================================================
   CHECK RESI
========================================================= */

async function checkResi(resi){

    runningRequests++;

    updateProcessStatus(
        resi,
        "MEMERIKSA"
    );

    try{

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                () => controller.abort(),
                REQUEST_TIMEOUT
            );


        const response =
            await fetch(
                APP_URL,
                {
                    method:"POST",

                    body:JSON.stringify({

                        resi:resi,

                        source:"scanRetur"

                    }),

                    signal:controller.signal

                }
            );


        clearTimeout(timeout);


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const json =
            await response.json();


        /*
           =========================
           SUCCESS
           =========================
        */

        if(
            json.status === "success"
        ){

            addHistory(
                resi,
                "BERHASIL"
            );

            showToast(
                resi + " • BERHASIL"
            );

            speak(
                "Barang sudah kembali"
            );

        }


        /*
           =========================
           ALREADY SCANNED
           =========================
        */

        else if(
            json.status === "already_scanned"
        ){

            /*
               Dari sisi scanner,
               backend bilang resi sudah
               pernah diproses.

               Masukkan ke history supaya
               scan berikutnya langsung ditolak.
            */

            addHistory(
                resi,
                "SUDAH PERNAH DIPROSES"
            );

            showToast(
                resi + " • SUDAH PERNAH DIPROSES"
            );

            speak(
                "Resi sudah pernah diproses"
            );

        }


        /*
           =========================
           NOT FOUND
           =========================
        */

        else if(
            json.status === "not_found" ||
            json.status === "notfound" ||
            json.status === "error_not_found"
        ){

            addNotFound(resi);

            showToast(
                resi + " • TIDAK DITEMUKAN"
            );

            speak(
                "Resi tidak ditemukan"
            );

        }


        /*
           =========================
           UNKNOWN RESPONSE
           =========================
        */

        else{

            /*
               Jangan langsung dianggap
               tidak ditemukan.

               Supaya aman, tetap dianggap
               error dan bisa dicoba lagi.
            */

            setProcessTimeout(
                resi,
                "RESPON TIDAK DIKENALI"
            );

            showToast(
                resi + " • RESPON TIDAK DIKENALI"
            );

        }


    }catch(error){

        console.error(
            "Scan retur error:",
            error
        );


        /*
           Abort = TIMEOUT.
           Error jaringan juga dibuat
           sebagai status coba lagi.
        */

        setProcessTimeout(
            resi,
            "TIMEOUT"
        );

        showToast(
            resi + " • TIMEOUT / COBA LAGI"
        );

        speak(
            "Pengecekan gagal, coba lagi"
        );

    }


    runningRequests--;

    updateProcessCount();

    renderAll();

    /*
       Jalankan antrean berikutnya.
    */

    runQueue();

}


/* =========================================================
   UPDATE PROCESS STATUS
========================================================= */

function updateProcessStatus(
    resi,
    status
){

    const item =
        processList.find(
            x => x.resi === resi
        );

    if(!item){

        return;

    }

    item.status =
        status;

    item.retrying = false;

    saveStorage();

    renderAll();

}


/* =========================================================
   TIMEOUT
========================================================= */

function setProcessTimeout(
    resi,
    message
){

    const item =
        processList.find(
            x => x.resi === resi
        );

    if(!item){

        return;

    }

    item.status =
        "TIMEOUT";

    item.message =
        message;

    item.retrying =
        false;

    saveStorage();

    renderAll();

}


/* =========================================================
   RETRY
========================================================= */

function retryResi(resi){

    /*
       Jangan retry kalau sudah ada request
       aktif untuk resi tersebut.
    */

    const item =
        processList.find(
            x => x.resi === resi
        );

    if(!item){

        return;

    }


    if(
        item.status === "MEMERIKSA"
    ){

        showToast(
            "Resi masih sedang diperiksa"
        );

        return;

    }


    /*
       Pastikan belum masuk history/notfound.
    */

    if(
        historyList.some(
            x => x.resi === resi
        )
    ){

        return;

    }

    if(
        notFoundList.some(
            x => x.resi === resi
        )
    ){

        return;

    }


    item.status =
        "MEMERIKSA";

    item.retrying =
        true;

    item.time =
        new Date().toISOString();


    saveStorage();

    renderAll();


    requestQueue.push(
        resi
    );

    runQueue();

}


/* =========================================================
   MANUAL INPUT
========================================================= */

function openManual(){

    document
        .getElementById("manualModal")
        .classList.add("show");

    setTimeout(
        () => {
            document
                .getElementById("manualInput")
                .focus();
        },
        100
    );

}


function closeManual(){

    document
        .getElementById("manualModal")
        .classList.remove("show");

}


/* =========================================================
   PARSE MANUAL
========================================================= */

function submitManual(){

    const text =
        document
            .getElementById("manualInput")
            .value;


    if(!text.trim()){

        showToast(
            "Masukkan resi terlebih dahulu"
        );

        return;

    }


    /*
       Bisa dipisahkan:
       Enter
       spasi
       koma
       titik koma
       tab
    */

    const rawList =
        text
            .toUpperCase()
            .split(/[\s,;]+/)
            .map(x => normalizeResi(x))
            .filter(Boolean);


    /*
       Hilangkan duplikat dari input
       manual sendiri.
    */

    const uniqueList =
        [...new Set(rawList)];


    let masuk = 0;
    let ditolak = 0;


    uniqueList.forEach(
        resi => {

            const localStatus =
                findLocalResi(resi);


            if(localStatus){

                ditolak++;

                return;

            }


            addToProcess(resi);

            requestQueue.push(resi);

            masuk++;

        }
    );


    document
        .getElementById("manualInput")
        .value = "";


    closeManual();


    renderAll();

    updateProcessCount();

    runQueue();


    showToast(
        `${masuk} resi masuk antrean` +
        (ditolak
            ? ` • ${ditolak} ditolak`
            : "")
    );

}


/* =========================================================
   CLEAR LOCAL DATA
========================================================= */

function clearLocalData(){

    const yakin =
        confirm(
            "Hapus semua Riwayat, Daftar Proses, dan Daftar Tidak Ditemukan di HP ini?"
        );


    if(!yakin){

        return;

    }


    /*
       Jangan hapus request yang sedang berjalan
       secara diam-diam.
    */

    if(runningRequests > 0){

        alert(
            "Masih ada proses yang berjalan. Tunggu sampai selesai sebelum CLEAR."
        );

        return;

    }


    processList = [];

    historyList = [];

    notFoundList = [];

    requestQueue = [];


    localStorage.removeItem(
        STORAGE_PROCESS
    );

    localStorage.removeItem(
        STORAGE_HISTORY
    );

    localStorage.removeItem(
        STORAGE_NOTFOUND
    );


    renderAll();

    updateProcessCount();

    showToast(
        "CACHE & RIWAYAT BERHASIL DIBERSIHKAN"
    );

    speak(
        "Data lokal sudah dibersihkan"
    );

}


/* =========================================================
   TABS
========================================================= */

function openTab(name){

    document
        .querySelectorAll(".tab")
        .forEach(
            btn => {

                btn.classList.toggle(
                    "active",
                    btn.dataset.tab === name
                );

            }
        );


    document
        .querySelectorAll(".tab-pane")
        .forEach(
            pane => {

                pane.classList.toggle(
                    "active",
                    pane.id === "tab-" + name
                );

            }
        );

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

    renderProcess();

    renderHistory();

    renderNotFound();

    updateCounts();

}


/* =========================================================
   RENDER PROCESS
========================================================= */

function renderProcess(){

    const box =
        document.getElementById(
            "processList"
        );


    if(!processList.length){

        box.innerHTML =
            `<div class="empty">
                Tidak ada resi yang sedang diproses.
             </div>`;

        return;

    }


    box.innerHTML =
        processList.map(
            item => {

                let badgeClass =
                    "badge-process";

                let button = "";


                if(
                    item.status === "TIMEOUT"
                ){

                    badgeClass =
                        "badge-timeout";


                    button =
                        `<button
                            class="retry-btn"
                            onclick="retryResi('${escapeHtml(item.resi)}')">
                            COBA LAGI
                         </button>`;

                }


                return `
                    <div class="item">

                        <div class="item-top">

                            <div>
                                <div class="resi">
                                    ${escapeHtml(item.resi)}
                                </div>

                                <div class="time">
                                    ${formatTime(item.time)}
                                </div>
                            </div>

                            <span
                                class="badge ${badgeClass}">
                                ${escapeHtml(item.status)}
                            </span>

                        </div>

                        ${button}

                    </div>
                `;

            }
        ).join("");

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory(){

    const box =
        document.getElementById(
            "historyList"
        );


    if(!historyList.length){

        box.innerHTML =
            `<div class="empty">
                Belum ada riwayat.
             </div>`;

        return;

    }


    box.innerHTML =
        historyList.map(
            item => {

                let badgeClass =
                    "badge-success";


                if(
                    item.status ===
                    "SUDAH PERNAH DIPROSES"
                ){

                    badgeClass =
                        "badge-already";

                }


                return `
                    <div class="item">

                        <div class="item-top">

                            <div>

                                <div class="resi">
                                    ${escapeHtml(item.resi)}
                                </div>

                                <div class="time">
                                    ${formatTime(item.time)}
                                </div>

                            </div>

                            <span
                                class="badge ${badgeClass}">
                                ${escapeHtml(item.status)}
                            </span>

                        </div>

                    </div>
                `;

            }
        ).join("");

}


/* =========================================================
   RENDER NOT FOUND
========================================================= */

function renderNotFound(){

    const box =
        document.getElementById(
            "notfoundList"
        );


    if(!notFoundList.length){

        box.innerHTML =
            `<div class="empty">
                Belum ada resi tidak ditemukan.
             </div>`;

        return;

    }


    box.innerHTML =
        notFoundList.map(
            item => {

                return `
                    <div class="item">

                        <div class="item-top">

                            <div>

                                <div class="resi">
                                    ${escapeHtml(item.resi)}
                                </div>

                                <div class="time">
                                    ${formatTime(item.time)}
                                </div>

                            </div>

                            <span
                                class="badge badge-notfound">
                                TIDAK DITEMUKAN
                            </span>

                        </div>

                    </div>
                `;

            }
        ).join("");

}


/* =========================================================
   COUNTS
========================================================= */

function updateCounts(){

    document
        .getElementById("processCount")
        .innerText =
        processList.length;


    document
        .getElementById("processTabCount")
        .innerText =
        processList.length;


    document
        .getElementById("historyCount")
        .innerText =
        historyList.length;


    document
        .getElementById("notfoundCount")
        .innerText =
        notFoundList.length;

}


function updateProcessCount(){

    updateCounts();

}


/* =========================================================
   CAMERA STATUS
========================================================= */

function setCameraStatus(
    text,
    color
){

    document
        .getElementById(
            "cameraStatus"
        )
        .innerText =
        text;


    document
        .getElementById(
            "statusDot"
        )
        .style.background =
        color;

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    if(cameraStarted){

        return;

    }


    try{

        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        await html5QrCode.start(

            {
                facingMode:"environment"
            },

            {
                fps:10,

                qrbox:{
                    width:260,
                    height:140
                },

                aspectRatio:1.777

            },

            onScanSuccess,

            () => {}

        );


        cameraStarted = true;


        setCameraStatus(
            "KAMERA SIAP SCAN",
            "#22c55e"
        );


        speak(
            "Scanner retur siap"
        );


    }catch(error){

        console.error(
            "Camera error:",
            error
        );


        setCameraStatus(
            "KAMERA GAGAL / IZINKAN KAMERA",
            "#ef4444"
        );


        showToast(
            "Kamera tidak dapat digunakan. Pastikan izin kamera diberikan."
        );

    }

}


/* =========================================================
   SPEECH
========================================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        speechSynthesis.cancel();

        const voice =
            new SpeechSynthesisUtterance(
                text
            );

        voice.lang =
            "id-ID";

        voice.rate =
            1;

        voice.pitch =
            1;

        speechSynthesis.speak(
            voice
        );

    }catch(e){}

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(value){

    try{

        return new Date(value)
            .toLocaleString(
                "id-ID",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric",
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

    }catch(e){

        return "";

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    () => {

        renderAll();

        updateProcessCount();

        startCamera();

    }
);


/* =========================================================
   MANUAL MODAL ENTER
========================================================= */

document
    .getElementById("manualInput")
    .addEventListener(
        "keydown",
        function(event){

            /*
               Ctrl + Enter = proses
            */

            if(
                event.key === "Enter" &&
                event.ctrlKey
            ){

                event.preventDefault();

                submitManual();

            }

        }
    );


/* =========================================================
   BACKGROUND TAB
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        /*
           Tidak mematikan antrean ketika
           user berpindah tab sebentar.
        */

        if(
            !document.hidden
        ){

            renderAll();

            updateProcessCount();

        }

    }
);

</script>
