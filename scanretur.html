<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SRF • Scan Retur</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
    color:#fff;
}

body{
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:52px;
    flex-shrink:0;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    border-bottom:1px solid #334155;
    z-index:50;
}

.header-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.back-btn{
    border:0;
    background:#334155;
    color:#fff;
    border-radius:7px;
    padding:7px 9px;
    font-size:11px;
    font-weight:800;
    text-decoration:none;
}

.header-title{
    font-size:14px;
    font-weight:900;
}

.header-actions{
    display:flex;
    gap:5px;
}

.header-btn{
    border:0;
    color:#fff;
    border-radius:7px;
    padding:7px 8px;
    font-size:9px;
    font-weight:900;
}

.result-btn{
    background:#2563eb;
}

.history-btn{
    background:#7c3aed;
}

/* CAMERA */

.scanner{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
    overflow:hidden;
}

#reader{
    position:absolute;
    inset:0;
    width:100%!important;
    height:100%!important;
    border:0!important;
    background:#000;
}

#reader video{
    width:100%!important;
    height:100%!important;
    object-fit:cover!important;
}

#reader img,
#reader__dashboard,
#reader__dashboard_section,
#reader__dashboard_section_csr,
#reader__header_message{
    display:none!important;
}

#reader__scan_region{
    width:100%!important;
    height:100%!important;
}

/* CAMERA STATUS */

.status-box{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;

    background:rgba(15,23,42,.82);
    backdrop-filter:blur(8px);

    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;

    padding:9px 11px;

    display:flex;
    align-items:center;
    gap:8px;

    pointer-events:none;
}

.lamp{
    width:11px;
    height:11px;
    min-width:11px;
    border-radius:50%;
    background:#facc15;
    box-shadow:0 0 10px currentColor;
}

.status-text{
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* CAMERA BUTTON */

.camera-control{
    position:absolute;
    bottom:12px;
    left:12px;
    right:12px;
    z-index:30;
}

.camera-btn{
    width:100%;
    height:52px;

    border:0;
    border-radius:27px;

    background:#334155;
    color:#fff;

    font-size:14px;
    font-weight:900;

    box-shadow:0 5px 15px rgba(0,0,0,.45);
}

.camera-btn.active{
    background:#16a34a;
}

/* NOTIFICATION */

.notif{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);

    z-index:90;

    display:none;

    max-width:90%;

    padding:9px 15px;
    border-radius:22px;

    font-size:11px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.notif.success{
    background:#16a34a;
}

.notif.warning{
    background:#d97706;
}

.notif.error{
    background:#dc2626;
}

.notif.info{
    background:#2563eb;
}

/* PANELS */

.panel{
    position:absolute;
    inset:0;
    z-index:100;

    display:none;

    background:#f1f5f9;
    color:#0f172a;

    overflow-y:auto;

    padding:12px;
}

.panel.open{
    display:block;
}

.panel-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.panel-title{
    font-size:16px;
    font-weight:900;
}

.close-btn{
    border:0;
    background:#dc2626;
    color:#fff;
    border-radius:7px;
    padding:8px 11px;
    font-size:9px;
    font-weight:900;
}

/* RESULT */

.result-card{
    background:#fff;
    border-radius:13px;
    padding:12px;
    margin-bottom:9px;
    box-shadow:0 3px 12px rgba(15,23,42,.08);
}

.result-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
}

.resi{
    font-size:14px;
    font-weight:900;
    word-break:break-all;
}

.time{
    color:#64748b;
    font-size:9px;
    margin-top:4px;
}

.status-badge{
    flex-shrink:0;
    padding:5px 7px;
    border-radius:6px;
    font-size:8px;
    font-weight:900;
}

.waiting{
    background:#fef3c7;
    color:#92400e;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.duplicate{
    background:#fee2e2;
    color:#991b1b;
}

.notfound{
    background:#ffedd5;
    color:#9a3412;
}

.timeout{
    background:#fef3c7;
    color:#92400e;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.result-message{
    margin-top:9px;
    font-size:11px;
    color:#475569;
    font-weight:700;
}

.retry-btn{
    margin-top:9px;
    width:100%;
    border:0;
    border-radius:7px;
    padding:9px;
    background:#2563eb;
    color:#fff;
    font-size:10px;
    font-weight:900;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:10px;
}

.detail{
    background:#f8fafc;
    border-radius:7px;
    padding:7px;
}

.detail-label{
    color:#64748b;
    font-size:8px;
    font-weight:700;
}

.detail-value{
    color:#0f172a;
    font-size:10px;
    font-weight:900;
    margin-top:2px;
    word-break:break-word;
}

.items{
    margin-top:10px;
    border-top:1px solid #e2e8f0;
    padding-top:9px;
}

.items-title{
    font-size:10px;
    font-weight:900;
    margin-bottom:6px;
}

.item-row{
    display:grid;
    grid-template-columns:1fr 55px 55px 35px;
    gap:4px;
    padding:6px 0;
    border-bottom:1px solid #f1f5f9;
    font-size:9px;
    font-weight:700;
}

.item-row.header-row{
    color:#64748b;
    font-size:8px;
    font-weight:900;
}

/* HISTORY */

.history-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.history-item{
    background:#fff;
    border-radius:11px;
    padding:10px;
    box-shadow:0 2px 8px rgba(15,23,42,.06);
    cursor:pointer;
}

.history-item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.history-resi{
    font-size:11px;
    font-weight:900;
    word-break:break-all;
}

.history-arrow{
    font-size:13px;
    font-weight:900;
    color:#64748b;
}

.history-time{
    margin-top:3px;
    color:#64748b;
    font-size:8px;
}

.empty{
    background:#fff;
    border-radius:11px;
    padding:25px 15px;
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
}

/* MANUAL MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:300;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(4px);

    padding:15px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:400px;

    background:#1e293b;
    border:1px solid #334155;

    border-radius:14px;
    padding:15px;
}

.modal-title{
    font-size:15px;
    font-weight:900;
}

.modal-info{
    margin-top:5px;
    color:#94a3b8;
    font-size:9px;
    line-height:1.5;
}

.manual-input{
    width:100%;
    height:150px;

    resize:none;

    margin-top:12px;

    padding:10px;

    background:#0f172a;
    border:1px solid #475569;
    border-radius:8px;

    color:#fff;

    font-size:12px;
    font-weight:700;

    outline:none;
}

.manual-input:focus{
    border-color:#2563eb;
}

.modal-actions{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.modal-btn{
    flex:1;
    border:0;
    border-radius:8px;
    padding:10px;

    font-size:10px;
    font-weight:900;
}

.cancel-btn{
    background:#475569;
    color:#fff;
}

.process-btn{
    background:#2563eb;
    color:#fff;
}

/* MOBILE */

@media(max-width:380px){

    .header-title{
        font-size:12px;
    }

    .header-btn{
        padding:6px;
        font-size:8px;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .item-row{
        grid-template-columns:1fr 45px 45px 30px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <a href="index.html" class="back-btn">
            MENU
        </a>

        <div class="header-title">
            SRF • SCAN RETUR
        </div>

    </div>

    <div class="header-actions">

        <button
            class="header-btn result-btn"
            onclick="openResultPanel()">

            HASIL

        </button>

        <button
            class="header-btn history-btn"
            onclick="openHistoryPanel()">

            RIWAYAT

        </button>

    </div>

</header>

<div class="scanner">

    <div id="reader"></div>

    <div class="status-box">

        <div
            id="lamp"
            class="lamp">
        </div>

        <div
            id="statusText"
            class="status-text">

            Kamera belum aktif

        </div>

    </div>

    <div
        id="notif"
        class="notif">
    </div>

    <div class="camera-control">

        <button
            id="cameraButton"
            class="camera-btn">

            AKTIFKAN KAMERA

        </button>

    </div>

    <!-- HASIL -->

    <div
        id="resultPanel"
        class="panel">

        <div class="panel-top">

            <div class="panel-title">
                HASIL SCAN
            </div>

            <button
                class="close-btn"
                onclick="closeResultPanel()">

                TUTUP

            </button>

        </div>

        <div id="resultList"></div>

    </div>

    <!-- RIWAYAT -->

    <div
        id="historyPanel"
        class="panel">

                RIWAYAT SCAN
            </div>

            <button
                class="close-btn"
                onclick="closeHistoryPanel()">

                TUTUP

            </button>

        </div>

        <div
            id="historyList"
            class="history-list">
        </div>

    </div>

</div>

<!-- INPUT MANUAL -->

<div
    id="manualModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-title">
            INPUT MANUAL
        </div>

        <div class="modal-info">

            Masukkan satu atau banyak resi.
            Bisa dipisahkan dengan Enter,
            spasi, koma, atau baris baru.

            <br><br>

            Ketik <b>CLEAR</b> untuk menghapus
            riwayat lokal perangkat.

        </div>

        <textarea
            id="manualInput"
            class="manual-input"
            placeholder="Contoh:

JY1261687193
JY1262837600
JY1197060858">
        </textarea>

        <div class="modal-actions">

            <button
                class="modal-btn cancel-btn"
                onclick="closeManual()">

                BATAL

            </button>

            <button
                class="modal-btn process-btn"
                onclick="processManual()">

                PROSES

            </button>

        </div>

    </div>

</div>

<script src="config.js"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

function getAppUrl(){

    try{

        if(
            typeof APP_URL !== "undefined" &&
            APP_URL
        ){

            return String(APP_URL).trim();

        }

        if(
            typeof CONFIG !== "undefined" &&
            CONFIG &&
            CONFIG.APP_URL
        ){

            return String(CONFIG.APP_URL).trim();

        }

    }catch(e){}

    return "";

}


/*
 * Timeout sengaja cukup panjang.
 *
 * Karena sebelumnya terbukti:
 * request bisa masuk Sheet tetapi
 * response browser terlambat.
 */

const REQUEST_TIMEOUT = 15000;


/*
 * Jeda minimum sebelum barcode yang
 * sama boleh diproses lagi.
 */

const SAME_RESI_COOLDOWN = 2500;


/*
 * Riwayat lokal.
 */

const HISTORY_KEY =
    "srf_scan_retur_history_v4";


let history = [];

try{

    history =
        JSON.parse(
            localStorage.getItem(
                HISTORY_KEY
            ) || "[]"
        );

    if(!Array.isArray(history)){
        history = [];
    }

}catch(e){

    history = [];

}


/*
 * Hasil scan aktif.
 */

let results = [];


/*
 * Resi yang sedang diproses.
 *
 * Map:
 * resi -> true
 */

const processingResi =
    new Set();


/*
 * Waktu scan terakhir per resi.
 */

const lastProcessed =
    new Map();


/*
 * Scanner.
 */

let html5QrCode = null;

let cameraRunning = false;


/* =========================================================
   INIT
========================================================= */

window.addEventListener(
    "load",
    function(){

        renderHistory();

        renderResults();

        setStatus(
            "yellow",
            "Kamera belum aktif"
        );

    }
);


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeResi(value){

    return String(
        value || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    type,
    text
){

    const lamp =
        document.getElementById(
            "lamp"
        );

    const status =
        document.getElementById(
            "statusText"
        );

    status.innerText =
        text;


    if(type === "green"){

        lamp.style.background =
            "#22c55e";

        lamp.style.color =
            "#22c55e";

    }

    else if(type === "red"){

        lamp.style.background =
            "#ef4444";

        lamp.style.color =
            "#ef4444";

    }

    else{

        lamp.style.background =
            "#facc15";

        lamp.style.color =
            "#facc15";

    }

}


/* =========================================================
   NOTIFICATION
========================================================= */

function showNotif(
    text,
    type="info",
    duration=2200
){

    const el =
        document.getElementById(
            "notif"
        );

    el.innerText =
        text;

    el.className =
        "notif " + type;

    el.style.display =
        "block";


    clearTimeout(
        window.notifTimer
    );


    window.notifTimer =
        setTimeout(
            function(){

                el.style.display =
                    "none";

            },
            duration
        );

}


/* =========================================================
   ROBOT
========================================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }

    try{

        speechSynthesis.cancel();

        const voice =
            new SpeechSynthesisUtterance(
                text
            );

        voice.lang =
            "id-ID";

        voice.rate =
            1.05;

        voice.pitch =
            1;

        voice.volume =
            1;

        speechSynthesis.speak(
            voice
        );

    }catch(e){}

}


/* =========================================================
   BEEP
========================================================= */

function beep(
    frequency=700,
    duration=.08
){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return;
        }

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        oscillator.frequency.value =
            frequency;

        oscillator.connect(
            ctx.destination
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime +
            duration
        );

    }catch(e){}

}


/* =========================================================
   CAMERA
========================================================= */

const cameraButton =
    document.getElementById(
        "cameraButton"
    );


cameraButton.addEventListener(
    "click",
    function(){

        if(cameraRunning){

            stopCamera();

        }else{

            startCamera();

        }

    }
);


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

    if(cameraRunning){
        return;
    }


    const url =
        getAppUrl();


    if(!url){

        setStatus(
            "red",
            "APP_URL tidak ditemukan"
        );

        showNotif(
            "CONFIG / APP_URL TIDAK DITEMUKAN",
            "error",
            3500
        );

        return;

    }


    try{

        setStatus(
            "yellow",
            "Menyalakan kamera..."
        );


        if(!html5QrCode){

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps:8,

                qrbox:{
                    width:260,
                    height:160
                },

                aspectRatio:
                    1.777778

            },

            function(decodedText){

                const resi =
                    normalizeResi(
                        decodedText
                    );


                if(!resi){
                    return;
                }


                handleScan(
                    resi
                );

            }

        );


        cameraRunning =
            true;


        cameraButton.classList.add(
            "active"
        );

        cameraButton.innerText =
            "MATIKAN KAMERA";


        setStatus(
            "green",
            "Kamera aktif • Siap scan"
        );


        speak(
            "Kamera aktif, siap scan"
        );


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraRunning =
            false;


        setStatus(
            "red",
            "Kamera gagal dibuka"
        );


        showNotif(
            "IZINKAN AKSES KAMERA",
            "error",
            3000
        );


        speak(
            "Tidak dapat membuka kamera"
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopCamera(){

    if(!html5QrCode){
        return;
    }


    try{

        await html5QrCode.stop();

    }catch(e){}


    cameraRunning =
        false;


    cameraButton.classList.remove(
        "active"
    );

    cameraButton.innerText =
        "AKTIFKAN KAMERA";


    setStatus(
        "yellow",
        "Kamera dimatikan"
    );

}


/* =========================================================
   SCAN HANDLER
========================================================= */

function handleScan(resi){

    resi =
        normalizeResi(
            resi
        );


    if(!resi){
        return;
    }


    /*
     * Jika resi sedang diproses,
     * ABAIKAN hasil kamera berikutnya.
     */

    if(
        processingResi.has(
            resi
        )
    ){

        return;

    }


    /*
     * Cooldown tambahan.
     */

    const last =
        lastProcessed.get(
            resi
        ) || 0;


    if(
        Date.now() - last <
        SAME_RESI_COOLDOWN
    ){

        return;

    }


    lastProcessed.set(
        resi,
        Date.now()
    );


    prosesResi(
        resi,
        "kamera"
    );

}


/* =========================================================
   ADD RESULT
========================================================= */

function addProcessingResult(
    resi
){

    const item = {

        id:
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        resi:
            resi,

        status:
            "processing",

        waktu:
            new Date().toISOString(),

        data:
            null,

        error:
            ""

    };


    results.unshift(
        item
    );


    /*
     * Maksimal 100 hasil aktif.
     */

    results =
        results.slice(
            0,
            100
        );


    renderResults();

    return item;

}


/* =========================================================
   REQUEST SERVER DENGAN TIMEOUT
========================================================= */

async function requestServer(
    resi
){

    const url =
        getAppUrl();


    if(!url){

        throw new Error(
            "APP_URL tidak ditemukan"
        );

    }


    const controller =
        new AbortController();


    const timer =
        setTimeout(
            function(){

                controller.abort();

            },
            REQUEST_TIMEOUT
        );


    try{

        const response =
            await fetch(

                url,

                {

                    method:"POST",

                    mode:"cors",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            source:
                                "scanRetur",

                            resi:
                                resi

                        }),

                    signal:
                        controller.signal

                }

            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        let json;


        try{

            json =
                JSON.parse(
                    text
                );

        }catch(e){

            throw new Error(
                "Response server bukan JSON"
            );

        }


        return json;

    }catch(error){

        if(
            error.name ===
            "AbortError"
        ){

            const timeoutError =
                new Error(
                    "TIMEOUT"
                );

            timeoutError.code =
                "TIMEOUT";

            throw timeoutError;

        }

        throw error;

    }finally{

        clearTimeout(
            timer
        );

    }

}


/* =========================================================
   PROSES SATU RESI
========================================================= */

async function prosesResi(
    resi,
    source="manual"
){

    resi =
        normalizeResi(
            resi
        );


    if(!resi){
        return;
    }


    /*
     * Lock.
     */

    if(
        processingResi.has(
            resi
        )
    ){

        return;

    }


    processingResi.add(
        resi
    );


    /*
     * Tampilkan langsung
     * MEMERIKSA...
     */

    const resultItem =
        addProcessingResult(
            resi
        );


    setStatus(
        "yellow",
        "Memeriksa " + resi + "..."
    );


    try{

        const json =
            await requestServer(
                resi
            );


        /*
         * SUCCESS
         */

        if(
            json.status ===
            "success"
        ){

            resultItem.status =
                "success";

            resultItem.data =
                json;

            resultItem.error =
                "";

            saveHistory(
                resultItem
            );


            beep(
                800,
                .08
            );


            speak(
                "Barang sudah kembali"
            );


            setStatus(
                "green",
                "Barang sudah kembali"
            );


            showNotif(
                "✓ " + resi +
                " • BARANG SUDAH KEMBALI",
                "success"
            );

        }


        /*
         * DUPLICATE
         *
         * Mendukung backend lama:
         * already_scanned
         *
         * dan backend baru:
         * duplicate
         */

        else if(

            json.status ===
            "duplicate" ||

            json.status ===
            "already_scanned"

        ){

            resultItem.status =
                "duplicate";

            resultItem.data =
                json;


            saveHistory(
                resultItem
            );


            beep(
                300,
                .12
            );


            speak(
                "Resi sudah kembali"
            );


            setStatus(
                "red",
                "Double scan • " + resi
            );


            showNotif(
                "DOUBLE SCAN • " + resi,
                "warning"
            );

        }


        /*
         * NOT FOUND
         */

        else if(
            json.status ===
            "notfound"
        ){

            resultItem.status =
                "notfound";

            resultItem.data =
                json;


            saveHistory(
                resultItem
            );


            beep(
                250,
                .18
            );


            speak(
                "Resi tidak ditemukan"
            );


            setStatus(
                "red",
                "Resi tidak ditemukan"
            );


            showNotif(
                "RESI TIDAK DITEMUKAN • " +
                resi,
                "error"
            );

        }


        /*
         * ERROR DARI BACKEND
         */

        else{

            resultItem.status =
                "error";

            resultItem.data =
                json;

            resultItem.error =
                json.message ||
                "Server mengembalikan error";


            saveHistory(
                resultItem
            );


            beep(
                250,
                .18
            );


            setStatus(
                "red",
                "Server error"
            );


            showNotif(
                "ERROR • " +
                (json.message || "Server error"),
                "error",
                3000
            );

        }


    }catch(error){

        console.error(
            "PROSES RESI ERROR:",
            error
        );


        /*
         * TIMEOUT
         */

        if(
            error.code ===
            "TIMEOUT"
        ){

            resultItem.status =
                "timeout";

            resultItem.error =
                "Server terlalu lama merespons";

            saveHistory(
                resultItem
            );


            beep(
                250,
                .18
            );


            setStatus(
                "red",
                "Timeout • " + resi
            );


            showNotif(
                "TIMEOUT • COBA LAGI",
                "warning",
                3500
            );

        }


        /*
         * ERROR KONEKSI
         */

        else{

            resultItem.status =
                "error";

            resultItem.error =
                error.message ||
                "Koneksi gagal";


            saveHistory(
                resultItem
            );


            beep(
                250,
                .18
            );


            setStatus(
                "red",
                "Koneksi gagal"
            );


            showNotif(
                "KONEKSI GAGAL • COBA LAGI",
                "error",
                3500
            );

        }

    }finally{

        /*
         * Request sudah selesai.
         * Barcode sekarang boleh diproses lagi.
         */

        processingResi.delete(
            resi
        );


        renderResults();

        renderHistory();

    }

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(
    resultItem
){

    /*
     * Jangan simpan MEMERIKSA.
     */

    if(
        resultItem.status ===
        "processing"
    ){

        return;

    }


    const historyItem = {

        id:
            resultItem.id,

        resi:
            resultItem.resi,

        status:
            resultItem.status,

        waktu:
            resultItem.waktu,

        data:
            resultItem.data,

        error:
            resultItem.error || ""

    };


    /*
     * Jika ID yang sama sudah ada,
     * jangan duplikasi.
     */

    history =
        history.filter(
            function(x){

                return x.id !==
                    historyItem.id;

            }
        );


    history.unshift(
        historyItem
    );


    history =
        history.slice(
            0,
            100
        );


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history
        )
    );


    renderHistory();

}


/* =========================================================
   RENDER RESULT
========================================================= */

function renderResults(){

    const container =
        document.getElementById(
            "resultList"
        );


    if(!results.length){

        container.innerHTML = `

            <div class="empty">

                Belum ada hasil scan.

            </div>

        `;

        return;

    }


    container.innerHTML =
        results.map(
            function(item){

                return renderResultCard(
                    item
                );

            }
        ).join("");

}


/* =========================================================
   RESULT CARD
========================================================= */

function renderResultCard(
    item
){

    let badgeClass =
        "waiting";

    let badgeText =
        "MEMERIKSA...";


    if(
        item.status ===
        "success"
    ){

        badgeClass =
            "success";

        badgeText =
            "BERHASIL";

    }

    else if(
        item.status ===
        "duplicate"
    ){

        badgeClass =
            "duplicate";

        badgeText =
            "DOUBLE SCAN";

    }

    else if(
        item.status ===
        "notfound"
    ){

        badgeClass =
            "notfound";

        badgeText =
            "TIDAK DITEMUKAN";

    }

    else if(
        item.status ===
        "timeout"
    ){

        badgeClass =
            "timeout";

        badgeText =
            "TIMEOUT";

    }

    else if(
        item.status ===
        "error"
    ){

        badgeClass =
            "error";

        badgeText =
            "ERROR";

    }


    const data =
        item.data || {};


    let detail = "";


    if(
        item.status ===
        "success" ||
        item.status ===
        "duplicate"
    ){

        detail = `

            <div class="detail-grid">

                <div class="detail">

                    <div class="detail-label">
                        EKSPEDISI
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            data.ekspedisi || "-"
                        )}
                    </div>

                </div>

                <div class="detail">

                    <div class="detail-label">
                        ORDER ID
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            data.orderId || "-"
                        )}
                    </div>

                </div>

                <div class="detail">

                    <div class="detail-label">
                        SKU
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            data.sku || "-"
                        )}
                    </div>

                </div>

                <div class="detail">

                    <div class="detail-label">
                        WARNA
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            data.warna || "-"
                        )}
                    </div>

                </div>

                <div class="detail">

                    <div class="detail-label">
                        SIZE
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            data.size || "-"
                        )}
                    </div>

                </div>

                <div class="detail">

                    <div class="detail-label">
                        QTY
                    </div>

                    <div class="detail-value">
                        ${escapeHTML(
                            data.qty || "-"
                        )}
                    </div>

                </div>

            </div>

        `;

    }


    let retry = "";


    if(
        item.status ===
        "timeout" ||
        item.status ===
        "error"
    ){

        retry = `

            <button
                class="retry-btn"
                onclick="retryResi('${escapeHTML(
                    item.resi
                )}')">

                ↻ COBA LAGI

            </button>

        `;

    }


    let message = "";


    if(
        item.status ===
        "processing"
    ){

        message =
            "Sedang memeriksa data retur di Google Sheet...";

    }

    else if(
        item.status ===
        "timeout"
    ){

        message =
            "Server terlalu lama merespons. Data belum dapat dikonfirmasi.";

    }

    else if(
        item.status ===
        "error"
    ){

        message =
            item.error ||
            "Terjadi kesalahan saat memeriksa resi.";

    }

    else if(
        item.status ===
        "duplicate"
    ){

        message =
            "Resi sudah tercatat sebagai SUDAH KEMBALI.";

    }

    else if(
        item.status ===
        "notfound"
    ){

        message =
            "Resi tidak ditemukan di data retur.";

    }

    else if(
        item.status ===
        "success"
    ){

        message =
            "Barang sudah kembali dan tanggal kembali telah dicatat.";

    }


    return `

        <div class="result-card">

            <div class="result-head">

                <div>

                    <div class="resi">
                        ${escapeHTML(
                            item.resi
                        )}
                    </div>

                    <div class="time">

                        ${formatDateTime(
                            item.waktu
                        )}

                    </div>

                </div>

                <div
                    class="status-badge ${badgeClass}">

                    ${badgeText}

                </div>

            </div>

            <div class="result-message">

                ${escapeHTML(
                    message
                )}

            </div>

            ${detail}

            ${retry}

        </div>

    `;

}


/* =========================================================
   RETRY
========================================================= */

function retryResi(
    resi
){

    resi =
        normalizeResi(
            resi
        );


    if(
        processingResi.has(
            resi
        )
    ){

        return;

    }


    /*
     * Buat hasil baru khusus retry.
     */

    prosesResi(
        resi,
        "retry"
    );

}

========================================================= */

){

            }
        );


    if(!item){

    }


    /*
     * Tampilkan hanya item ini
     * di panel HASIL.
     *

    results = [{

/*
 * Input manual dibuka dengan
 * tombol keyboard kecil di status.
 *
 * Kita buat juga shortcut:
 * M
 */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key.toLowerCase() ===
            "m" &&
            !e.ctrlKey &&
            !e.altKey &&
            !e.metaKey
        ){

            const active =
                document.activeElement;

            if(
                active &&
                (
                    active.tagName ===
                    "INPUT" ||

                    active.tagName ===
                    "TEXTAREA"
                )
            ){

                return;

            }

            openManual();

        }

    }
);


/* =========================================================
   MANUAL INPUT
========================================================= */

function extractResiList(
    text
){

    return String(
        text || ""
    )

    /*
     * Semua pemisah:
     * enter
     * spasi
     * tab
     * koma
     * titik koma
     */

    .split(
        /[\s,;]+/
    )

    .map(
        function(x){

            return normalizeResi(
                x
            );

        }
    )

    .filter(
        function(x){

            return x &&
                x !== "CLEAR";

        }
    );

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearLocalHistory(){

    history = [];

    results = [];

    localStorage.removeItem(
        HISTORY_KEY
    );


    renderHistory();

    renderResults();


    showNotif(
        "RIWAYAT LOKAL DIHAPUS",
        "success",
        2500
    );

}


/* =========================================================
   PROCESS MANUAL
========================================================= */

function processManual(){

    const input =
        document.getElementById(
            "manualInput"
        );


    const raw =
        input.value.trim();


    if(!raw){

        showNotif(
            "MASUKKAN RESI DULU",
            "warning"
        );

        return;

    }


    /*
     * CLEAR hanya jika input
     * tepat CLEAR.
     */

    if(
        normalizeResi(raw) ===
        "CLEAR"
    ){

        const yakin =
            confirm(
                "Hapus semua riwayat scan di perangkat ini?\n\nData Google Sheet TIDAK akan dihapus."
            );


        if(yakin){

            clearLocalHistory();

            input.value = "";

            closeManual();

        }

        return;

    }


    const resiList =
        extractResiList(
            raw
        );


    if(!resiList.length){

        showNotif(
            "RESI TIDAK TERBACA",
            "warning"
        );

        return;

    }


    /*
     * Hilangkan duplikat dalam
     * input manual yang sama.
     */

    const uniqueResi =
        [...new Set(
            resiList
        )];


    input.value = "";

    closeManual();


    /*
     * Semua langsung dibuat
     * MEMERIKSA.
     *
     * Request tetap diproses
     * per-resi agar satu error
     * tidak menghentikan yang lain.
     */

    uniqueResi.forEach(
        function(resi){

            prosesResi(
                resi,
                "manual"
            );

        }
    );

}
