<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Retur - SRF PROJECT</title>

<!-- PWA & Styling Eksternal -->
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#003399">
</head>
<body>

<div class="header-page" style="display:flex; align-items:center; justify-content:space-between; text-align:left; padding:15px;">
    <h2>Scan Retur Masuk</h2>
    <a href="index.html" class="btn-back">Kembali</a>
</div>

<div class="card" style="box-shadow:0 3px 8px rgba(0,0,0,.08);">
    <label for="alasan">Alasan Retur:</label>
    <select id="alasan">
        <option value="Tidak Dikenal / Alamat Salah">Tidak Dikenal / Alamat Salah</option>
        <option value="Pembeli Menolak COD">Pembeli Menolak COD</option>
        <option value="Kurir Gagal Kirim / Max Attempt">Kurir Gagal Kirim / Max Attempt</option>
        <option value="Barang Rusak / Salah Kirim">Barang Rusak / Salah Kirim</option>
    </select>

    <label for="resiRetur">Scan / Masukkan No. Resi Retur:</label>
    <input type="text" id="resiRetur" placeholder="Scan barcode retur di sini..." autofocus>
    
    <button id="btnProsesRetur">Proses Retur Masuk</button>
    
    <!-- Tombol Play Ulang Suara Bot -->
    <button id="btnUlangSuara" style="background:#4b5563; margin-top:8px;">🔊 Play Ulang Suara Terakhir</button>
</div>

<div class="card" style="box-shadow:0 3px 8px rgba(0,0,0,.08);">
    <h3>Log Retur Masuk & Detail SKU</h3>
    <div id="logRetur" class="log-box">Sistem retur siap...</div>
</div>

<!-- Script Eksternal Terpisah -->
<script src="config.js"></script>
<script src="tts.js"></script>
<script src="scanretur.js"></script>

</body>
</html>
