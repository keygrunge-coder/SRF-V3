<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Pro - Push-to-Scan</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #0f172a; color: #fff; height: 100vh; overflow: hidden; user-select: none; }
        
        .scanner-container { position: relative; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
        #reader { flex: 1; width: 100%; background: #000; }
        
        /* Status Bar Atas */
        .status-top { position: absolute; top: 15px; left: 15px; right: 15px; padding: 12px; background: rgba(0,0,0,0.7); border-radius: 10px; font-size: 14px; text-align: center; backdrop-filter: blur(5px); }
        
        /* Tombol Tahan & Scan */
        .hold-btn-area { position: absolute; bottom: 40px; left: 0; right: 0; padding: 20px; }
        #holdScanBtn { 
            width: 100%; height: 80px; border-radius: 40px; border: none; 
            background: #334155; color: #94a3b8; font-size: 18px; font-weight: bold; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: all 0.2s;
        }
        #holdScanBtn.active { background: #2563eb; color: #fff; transform: scale(0.95); }

        .btn-sync { position: absolute; top: 70px; right: 20px; background: #059669; border: none; padding: 10px 15px; border-radius: 20px; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="scanner-container">
    <div id="reader"></div>
    <div class="status-top" id="statusMsg">Tekan & Tahan tombol di bawah untuk scan.</div>
    <button class="btn-sync" onclick="syncKeServer()">☁️ Sync (<span id="sync-count">0</span>)</button>
    
    <div class="hold-btn-area">
        <button id="holdScanBtn">TAHAN UNTUK SCAN</button>
    </div>
</div>

<script src="config.js"></script>
<script>
    let html5QrCode = new Html5Qrcode("reader");
    let isProcessing = false;
    let localData = JSON.parse(localStorage.getItem('resi_data') || "[]");
    document.getElementById('sync-count').innerText = localData.length;

    const btn = document.getElementById('holdScanBtn');
    const statusMsg = document.getElementById('statusMsg');

    function startScanner() {
        btn.classList.add('active');
        statusMsg.innerText = "Arahkan kamera ke resi...";
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
            if (!isProcessing) {
                isProcessing = true;
                handleScan(decodedText.trim());
            }
        });
    }

    function stopScanner() {
        btn.classList.remove('active');
        statusMsg.innerText = "Tekan & Tahan tombol di bawah untuk scan.";
        html5QrCode.stop();
    }

    function handleScan(resi) {
        if (localData.includes(resi)) {
            statusMsg.innerText = "Resi sudah ada di antrean!";
        } else {
            localData.push(resi);
            localStorage.setItem('resi_data', JSON.stringify(localData));
            document.getElementById('sync-count').innerText = localData.length;
            statusMsg.innerText = "Sukses: " + resi;
        }
        setTimeout(() => isProcessing = false, 1000);
    }

    // Event Listener Push-to-Scan
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); startScanner(); });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); stopScanner(); });
    btn.addEventListener("mousedown", startScanner);
    btn.addEventListener("mouseup", stopScanner);

    async function syncKeServer() {
        if(localData.length === 0) return alert("Antrean kosong");
        statusMsg.innerText = "Sinkronisasi sedang berjalan...";
        
        for (let resi of localData) {
            try {
                let res = await fetch(APP_URL, { 
                    method: "POST", 
                    mode: "cors", 
                    body: JSON.stringify({ resi: resi, source: "pengiriman" }) 
                });
                let data = await res.json();
                if(data.status === "success") {
                    localData = localData.filter(r => r !== resi);
                }
            } catch(e) {}
        }
        localStorage.setItem('resi_data', JSON.stringify(localData));
        document.getElementById('sync-count').innerText = localData.length;
        statusMsg.innerText = "Sinkronisasi selesai.";
    }
</script>
</body>
</html>
