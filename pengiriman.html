<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0f172a">

<title>SRF V3 Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:52px;
    flex-shrink:0;
    background:#0f172a;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;
    z-index:50;
}

.logo{
    font-size:16px;
    font-weight:700;
}

.logo small{
    font-size:10px;
    color:#94a3b8;
    margin-left:4px;
}

.header-actions{
    display:flex;
    gap:5px;
}

.header-btn{
    border:0;
    color:white;
    border-radius:7px;
    padding:7px 9px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.sync-btn{
    background:#2563eb;
}

.clear-btn{
    background:#dc2626;
}

/* =========================
   CAMERA AREA
========================= */

.camera-area{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
    overflow:hidden;
}

#reader{
    position:absolute;
    inset:0;
    width:100% !important;
    height:100% !important;
    border:0 !important;
}

#reader video{
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
}

#reader__scan_region{
    border:0 !important;
}

/* =========================
   TOP STATUS
========================= */

.status-panel{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;

    min-height:52px;

    background:rgba(15,23,42,.88);
    backdrop-filter:blur(8px);

    border-radius:12px;

    display:flex;
    align-items:center;

    padding:9px 12px;

    z-index:20;
}

.status-light{
    width:13px;
    height:13px;
    min-width:13px;

    border-radius:50%;

    background:#f59e0b;

    margin-right:9px;

    box-shadow:0 0 10px currentColor;
}

.status-text{
    color:white;
    font-size:13px;
    font-weight:600;
    line-height:1.25;
}

/* =========================
   SCAN FRAME
========================= */

.scan-frame{
    position:absolute;

    width:70%;
    max-width:330px;
    aspect-ratio:1.65;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:2px solid rgba(255,255,255,.85);

    border-radius:12px;

    z-index:10;

    pointer-events:none;
}

.scan-frame::before,
.scan-frame::after{
    content:"";

    position:absolute;

    width:30px;
    height:30px;

    border-color:#22c55e;
}

.scan-frame::before{
    top:-2px;
    left:-2px;

    border-top:4px solid;
    border-left:4px solid;

    border-radius:8px 0 0 0;
}

.scan-frame::after{
    right:-2px;
    bottom:-2px;

    border-right:4px solid;
    border-bottom:4px solid;

    border-radius:0 0 8px 0;
}

/* =========================
   NOTIFICATION
========================= */

.notification{
    position:absolute;

    top:78px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 30px);

    max-width:380px;

    padding:12px 15px;

    border-radius:12px;

    color:white;

    text-align:center;

    font-size:13px;
    font-weight:700;

    display:none;

    z-index:40;

    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.notification.success{
    background:#16a34a;
}

.notification.warning{
    background:#f59e0b;
}

.notification.error{
    background:#dc2626;
}

.notification.info{
    background:#2563eb;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    position:absolute;

    left:12px;
    right:12px;
    bottom:92px;

    display:flex;
    gap:7px;

    z-index:20;
}

.stat{
    flex:1;

    background:rgba(15,23,42,.88);
    backdrop-filter:blur(7px);

    color:white;

    border-radius:10px;

    padding:7px 5px;

    text-align:center;
}

.stat-title{
    font-size:9px;
    color:#94a3b8;
}

.stat-value{
    font-size:16px;
    font-weight:800;
    margin-top:2px;
}

/* =========================
   HOLD BUTTON
========================= */

.scan-button-area{
    position:absolute;

    left:12px;
    right:12px;
    bottom:15px;

    z-index:30;
}

#holdScanBtn{
    width:100%;

    height:58px;

    border:0;

    border-radius:30px;

    background:#334155;

    color:white;

    font-size:15px;
    font-weight:800;

    box-shadow:0 5px 18px rgba(0,0,0,.45);

    touch-action:none;

    cursor:pointer;

    user-select:none;
}

#holdScanBtn.active{
    background:#16a34a;
}

#holdScanBtn:active{
    transform:scale(.98);
}

/* =========================
   DRAWER
========================= */

.drawer{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:65vh;

    background:white;

    border-radius:18px 18px 0 0;

    z-index:100;

    transform:translateY(calc(100% - 48px));

    transition:transform .25s ease;

    box-shadow:0 -5px 20px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}

.drawer.open{
    transform:translateY(0);
}

.drawer-header{
    height:48px;
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    background:#f1f5f9;

    border-radius:18px 18px 0 0;

    font-size:13px;
    font-weight:800;

    cursor:pointer;
}

.drawer-title span{
    color:#2563eb;
}

.drawer-body{
    overflow-y:auto;
    flex:1;
    padding:8px 12px 25px;
}

.section-title{
    font-size:12px;
    font-weight:800;

    margin:10px 3px 7px;

    color:#475569;
}

.queue-item,
.history-item{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:10px;

    border-bottom:1px solid #e2e8f0;
}

.resi{
    font-size:12px;
    font-weight:700;
    word-break:break-all;
}

.exp{
    font-size:10px;
    font-weight:700;

    padding:4px 7px;

    border-radius:5px;

    background:#e2e8f0;
    color:#475569;
}

.empty{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    padding:20px 10px;
}

/* =========================
   MODAL MANUAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal-box{
    width:100%;
    max-width:360px;

    background:white;

    border-radius:15px;

    padding:18px;
}

.modal-box h3{
    font-size:16px;
    margin-bottom:12px;
}

.manual-input{
    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-size:14px;

    outline:none;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:7px;

    margin-top:12px;
}

.modal-actions button{
    border:0;

    padding:9px 14px;

    border-radius:7px;

    font-weight:700;

    cursor:pointer;
}

.cancel{
    background:#e2e8f0;
}

.save{
    background:#2563eb;
    color:white;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{
        height:50px;
    }

    .logo{
        font-size:14px;
    }

    .header-btn{
        padding:7px;
        font-size:10px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">
        SRF
        <small>V3 SCANNER</small>
    </div>

    <div class="header-actions">

        <button
            class="header-btn sync-btn"
            onclick="syncKeServer()">
            SYNC <span id="pendingCountTop">0</span>
        </button>

        <button
            class="header-btn clear-btn"
            onclick="hapusPending()">
            CLEAR
        </button>

    </div>

</header>


<!-- CAMERA -->

<main class="camera-area">

    <div id="reader"></div>

    <div class="scan-frame"></div>


    <!-- STATUS -->

    <div class="status-panel">

        <div
            id="statusLight"
            class="status-light">
        </div>

        <div
            id="statusText"
            class="status-text">

            Tekan & tahan tombol untuk mulai scan

        </div>

    </div>


    <!-- NOTIFICATION -->

    <div
        id="notification"
        class="notification">
    </div>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="stat">

            <div class="stat-title">
                PENDING
            </div>

            <div
                id="pendingCount"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                RIWAYAT
            </div>

            <div
                id="historyCount"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                STATUS
            </div>

            <div
                id="connectionStatus"
                class="stat-value">
                OFF
            </div>

        </div>

    </div>


    <!-- HOLD SCAN -->

    <div class="scan-button-area">

        <button id="holdScanBtn">

            TAHAN UNTUK SCAN

        </button>

    </div>

</main>


<!-- DRAWER -->

<section
    id="drawer"
    class="drawer">

    <div
        class="drawer-header"
        onclick="toggleDrawer()">

        <div class="drawer-title">

            ANTREAN &
            RIWAYAT

            <span id="drawerCount">
                0
            </span>

        </div>

        <div id="drawerArrow">
            ▲
        </div>

    </div>


    <div class="drawer-body">

        <div class="section-title">
            ANTREAN BELUM SYNC
        </div>

        <div id="queueList"></div>


        <div class="section-title">
            RIWAYAT RESI
        </div>

        <div id="historyList"></div>

    </div>

</section>


<!-- MODAL MANUAL -->

<div
    id="manualModal"
    class="modal">

    <div class="modal-box">

        <h3>
            Input Resi Manual
        </h3>

        <input
            id="manualInput"
            class="manual-input"
            type="text"
            placeholder="Masukkan nomor resi">

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="tutupManual()">

                Batal

            </button>

            <button
                class="save"
                onclick="simpanManual()">

                Simpan

            </button>

        </div>

    </div>

</div>


<script src="config.js"></script>

<script>

/* =========================================================
   SRF V3 FRONTEND
========================================================= */


/* =========================
   STORAGE
========================= */

const PENDING_KEY = "SRF_V3_PENDING";

const HISTORY_KEY = "SRF_V3_HISTORY";


let pending = [];

let history = [];


try {

    pending =
        JSON.parse(
            localStorage.getItem(PENDING_KEY) || "[]"
        );

    history =
        JSON.parse(
            localStorage.getItem(HISTORY_KEY) || "[]"
        );

} catch(e) {

    pending = [];
    history = [];

}


/* =========================
   CAMERA
========================= */

let scanner = null;

let cameraRunning = false;

let processingScan = false;


/* =========================
   TARGET URL
========================= */

function getTargetUrl(){

    if(typeof APP_URL !== "undefined" && APP_URL){
        return APP_URL;
    }

    if(
        typeof CONFIG !== "undefined" &&
        CONFIG.APP_URL
    ){
        return CONFIG.APP_URL;
    }

    return null;
}


/* =========================
   SAVE STORAGE
========================= */

function savePending(){

    localStorage.setItem(
        PENDING_KEY,
        JSON.stringify(pending)
    );

}


function saveHistory(){

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );

}


/* =========================
   NORMALIZE RESI
========================= */

function normalisasiResi(resi){

    return String(resi || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g,"");

}


/* =========================
   EKSPEDISI
========================= */

function getEkspedisi(resi){

    if(
        resi.startsWith("SPX") ||
        resi.startsWith("SPXID")
    ){

        return "SPX";

    }


    if(
        resi.startsWith("JX") ||
        resi.startsWith("JY") ||
        resi.startsWith("JZ")
    ){

        return "J&T";

    }


    return null;

}


/* =========================
   STATUS UI
========================= */

function setStatus(type,text){

    const light =
        document.getElementById("statusLight");

    const message =
        document.getElementById("statusText");


    message.innerText = text;


    if(type === "success"){

        light.style.background = "#22c55e";

    }
    else if(type === "error"){

        light.style.background = "#ef4444";

    }
    else if(type === "warning"){

        light.style.background = "#f59e0b";

    }
    else{

        light.style.background = "#94a3b8";

    }

}


/* =========================
   NOTIFICATION
========================= */

let notificationTimer = null;


function notify(text,type="info"){

    const box =
        document.getElementById("notification");


    clearTimeout(notificationTimer);


    box.className =
        "notification " + type;


    box.innerText = text;

    box.style.display = "block";


    notificationTimer =
        setTimeout(()=>{

            box.style.display = "none";

        },2200);

}


/* =========================
   BEEP
========================= */

function beep(freq,duration){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        oscillator.frequency.value =
            freq;

        oscillator.connect(
            ctx.destination
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + duration
        );

        setTimeout(
            ()=>ctx.close(),
            duration * 1000 + 100
        );

    }catch(e){}

}


function beepSuccess(){

    beep(700,.08);

}


function beepDuplicate(){

    beep(250,.35);

}


function beepError(){

    beep(150,.5);

}


/* =========================
   VOICE
========================= */

function bicara(text){

    try{

        if(
            "speechSynthesis"
            in window
        ){

            speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );

            utterance.lang =
                "id-ID";

            utterance.rate =
                1.05;

            speechSynthesis.speak(
                utterance
            );

        }

    }catch(e){}

}


/* =========================
   DASHBOARD
========================= */

function updateUI(){

    document.getElementById(
        "pendingCount"
    ).innerText =
        pending.length;


    document.getElementById(
        "pendingCountTop"
    ).innerText =
        pending.length;


    document.getElementById(
        "historyCount"
    ).innerText =
        history.length;


    document.getElementById(
        "drawerCount"
    ).innerText =
        pending.length;


    renderQueue();

    renderHistory();

}


/* =========================
   CHECK HISTORY
========================= */

function sudahPernahScan(resi){

    return history.includes(resi);

}


/* =========================
   CHECK PENDING
========================= */

function sedangMenunggu(resi){

    return pending.includes(resi);

}


/* =========================
   ADD SCAN
========================= */

function prosesScan(rawResi){

    const resi =
        normalisasiResi(rawResi);


    if(!resi){

        return;

    }


    const ekspedisi =
        getEkspedisi(resi);


    /* INVALID */

    if(!ekspedisi){

        beepError();

        setStatus(
            "error",
            "Format resi tidak dikenal"
        );

        notify(
            "RESI TIDAK DIKENAL",
            "error"
        );

        bicara(
            "Resi tidak dikenal"
        );

        return;

    }


    /* DOUBLE HISTORY */

    if(sudahPernahScan(resi)){

        beepDuplicate();

        setStatus(
            "warning",
            "RESI SUDAH PERNAH DI-SCAN"
        );

        notify(
            "RESI DOBEL — SUDAH ADA DI RIWAYAT",
            "warning"
        );

        bicara(
            "Resi dobel"
        );

        return;

    }


    /* DOUBLE PENDING */

    if(sedangMenunggu(resi)){

        beepDuplicate();

        setStatus(
            "warning",
            "RESI SUDAH ADA DI ANTREAN"
        );

        notify(
            "RESI SUDAH ADA DI ANTREAN",
            "warning"
        );

        return;

    }


    /* SIMPAN HISTORY */

    history.unshift(resi);

    saveHistory();


    /* SIMPAN PENDING */

    pending.push(resi);

    savePending();


    /* SUCCESS */

    beepSuccess();

    setStatus(
        "success",
        "Tersimpan — " + ekspedisi
    );

    notify(
        "✓ " + ekspedisi + " — " + resi,
        "success"
    );

    bicara(
        ekspedisi === "SPX"
        ? "S P X sukses"
        : "J T sukses"
    );


    updateUI();

}


/* =========================
   START CAMERA
========================= */

async function mulaiScan(){

    if(cameraRunning){

        return;

    }


    cameraRunning = true;

    processingScan = false;


    const button =
        document.getElementById(
            "holdScanBtn"
        );


    button.classList.add("active");

    button.innerText =
        "KAMERA AKTIF — LEPASKAN UNTUK BERHENTI";


    setStatus(
        "warning",
        "Mengaktifkan kamera..."
    );


    try{

        if(!scanner){

            scanner =
                new Html5Qrcode(
                    "reader"
                );

        }


        await scanner.start(

            {
                facingMode:"environment"
            },

            {
                fps:15,

                qrbox:{
                    width:280,
                    height:170
                },

                aspectRatio:1.7777778

            },

            decodedText => {

                if(processingScan){

                    return;

                }


                processingScan = true;


                prosesScan(decodedText);


                setTimeout(()=>{

                    processingScan = false;

                },1200);

            },

            errorMessage => {}

        );


        setStatus(
            "success",
            "Kamera aktif — arahkan ke barcode"
        );


    }catch(error){

        console.error(error);


        cameraRunning = false;


        button.classList.remove(
            "active"
        );

        button.innerText =
            "TAHAN UNTUK SCAN";


        setStatus(
            "error",
            "Kamera gagal dibuka"
        );


        notify(
            "Kamera tidak dapat dibuka. Periksa izin kamera.",
            "error"
        );

        bicara(
            "Kamera gagal dibuka"
        );

    }

}


/* =========================
   STOP CAMERA
========================= */

async function berhentiScan(){

    if(!cameraRunning){

        return;

    }


    cameraRunning = false;


    const button =
        document.getElementById(
            "holdScanBtn"
        );


    button.classList.remove(
        "active"
    );

    button.innerText =
        "TAHAN UNTUK SCAN";


    try{

        if(scanner){

            await scanner.stop();

        }

    }catch(e){}


    setStatus(
        "warning",
        "Scanner berhenti"
    );

}


/* =========================
   HOLD BUTTON
========================= */

const holdBtn =
    document.getElementById(
        "holdScanBtn"
    );


holdBtn.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        mulaiScan();

    },
    {passive:false}
);


holdBtn.addEventListener(
    "touchend",
    e => {

        e.preventDefault();

        berhentiScan();

    },
    {passive:false}
);


holdBtn.addEventListener(
    "touchcancel",
    e => {

        e.preventDefault();

        berhentiScan();

    },
    {passive:false}
);


holdBtn.addEventListener(
    "mousedown",
    e => {

        e.preventDefault();

        mulaiScan();

    }
);


holdBtn.addEventListener(
    "mouseup",
    e => {

        e.preventDefault();

        berhentiScan();

    }
);


holdBtn.addEventListener(
    "mouseleave",
    e => {

        if(cameraRunning){

            berhentiScan();

        }

    }
);


/* =========================
   RENDER QUEUE
========================= */

function renderQueue(){

    const box =
        document.getElementById(
            "queueList"
        );


    box.innerHTML = "";


    if(pending.length === 0){

        box.innerHTML =
            `<div class="empty">
                Tidak ada antrean.
             </div>`;

        return;

    }


    pending
        .slice()
        .reverse()
        .forEach(resi => {

            const ekspedisi =
                getEkspedisi(resi) || "-";


            box.innerHTML += `

                <div class="queue-item">

                    <div class="resi">
                        ${escapeHtml(resi)}
                    </div>

                    <div class="exp">
                        ${ekspedisi}
                    </div>

                </div>

            `;

        });

}


/* =========================
   RENDER HISTORY
========================= */

function renderHistory(){

    const box =
        document.getElementById(
            "historyList"
        );


    box.innerHTML = "";


    if(history.length === 0){

        box.innerHTML =
            `<div class="empty">
                Belum ada riwayat scan.
             </div>`;

        return;

    }


    history
        .slice(0,100)
        .forEach(resi => {

            const ekspedisi =
                getEkspedisi(resi) || "-";


            box.innerHTML += `

                <div class="history-item">

                    <div class="resi">
                        ${escapeHtml(resi)}
                    </div>

                    <div class="exp">
                        ${ekspedisi}
                    </div>

                </div>

            `;

        });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.innerText =
        text;

    return div.innerHTML;

}


/* =========================
   DRAWER
========================= */

function toggleDrawer(){

    const drawer =
        document.getElementById(
            "drawer"
        );


    const arrow =
        document.getElementById(
            "drawerArrow"
        );


    drawer.classList.toggle(
        "open"
    );


    arrow.innerText =
        drawer.classList.contains("open")
        ? "▼"
        : "▲";

}


/* =========================
   SYNC
========================= */

async function syncKeServer(){

    if(pending.length === 0){

        notify(
            "Tidak ada antrean untuk sync",
            "info"
        );

        return;

    }


    const url =
        getTargetUrl();


    if(!url){

        notify(
            "APP_URL belum diatur",
            "error"
        );

        return;

    }


    if(!confirm(
        "Sync " +
        pending.length +
        " resi ke Google Sheet?"
    )){

        return;

    }


    setStatus(
        "warning",
        "Memulai sinkronisasi..."
    );


    let berhasil = 0;

    let gagal = 0;

    let sisa = [];


    const daftar =
        [...pending];


    for(let i=0;i<daftar.length;i++){

        const resi =
            daftar[i];


        setStatus(
            "warning",
            "Sync " +
            (i+1) +
            "/" +
            daftar.length +
            " — " +
            resi
        );


        try{

            const response =
                await fetch(

                    url,

                    {

                        method:"POST",

                        mode:"cors",

                        headers:{
                            "Content-Type":
                            "text/plain;charset=utf-8"
                        },

                        body:JSON.stringify({

                            source:
                            "pengiriman",

                            resi:
                            resi

                        })

                    }

                );


            const text =
                await response.text();


            console.log(
                "SRF RESPONSE:",
                text
            );


            let result;


            try{

                result =
                    JSON.parse(text);

            }catch(e){

                throw new Error(
                    "Response server bukan JSON"
                );

            }


            /* SUCCESS */

            if(
                result.status === "success"
            ){

                berhasil++;

            }


            /* DUPLICATE SERVER */

            else if(
                result.status === "duplicate"
            ){

                /*
                 * Tetap dianggap selesai.
                 * Karena resi memang sudah ada
                 * di server.
                 */

                berhasil++;

            }


            else{

                gagal++;

                sisa.push(resi);

            }


        }catch(error){

            console.error(
                "SYNC ERROR:",
                resi,
                error
            );


            gagal++;

            sisa.push(resi);

        }


        /*
         * Jeda kecil agar Apps Script
         * tidak dihajar terlalu cepat.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );

    }


    pending =
        sisa;


    savePending();


    updateUI();


    if(gagal === 0){

        setStatus(
            "success",
            "Sync selesai — " +
            berhasil +
            " resi"
        );

        notify(
            "✓ Semua " +
            berhasil +
            " resi berhasil diproses",
            "success"
        );

        bicara(
            "Sinkronisasi selesai"
        );

    }else{

        setStatus(
            "warning",
            berhasil +
            " berhasil, " +
            gagal +
            " gagal"
        );

        notify(
            berhasil +
            " berhasil • " +
            gagal +
            " masih di antrean",
            "warning"
        );

    }

}


/* =========================
   CLEAR PENDING
========================= */

function hapusPending(){

    if(pending.length === 0){

        notify(
            "Antrean sudah kosong",
            "info"
        );

        return;

    }


    if(!confirm(
        "Hapus " +
        pending.length +
        " resi dari ANTREAN?\n\n" +

        "RIWAYAT TETAP AMAN dan tidak akan dihapus."
    )){

        return;

    }


    pending = [];

    savePending();

    updateUI();


    notify(
        "Antrean dibersihkan. Riwayat tetap aman.",
        "success"
    );

}


/* =========================
   MANUAL INPUT
========================= */

function bukaManual(){

    document.getElementById(
        "manualModal"
    ).style.display = "flex";


    setTimeout(()=>{

        document.getElementById(
            "manualInput"
        ).focus();

    },100);

}


function tutupManual(){

    document.getElementById(
        "manualModal"
    ).style.display = "none";

}


function simpanManual(){

    const input =
        document.getElementById(
            "manualInput"
        );


    const value =
        input.value.trim();


    if(!value){

        return;

    }


    prosesScan(value);


    input.value = "";


    tutupManual();

}


/* =========================
   DOUBLE CLICK HEADER
   MANUAL INPUT
========================= */

document
    .querySelector(".logo")
    .addEventListener(
        "dblclick",
        bukaManual
    );


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.key === "Escape"
        ){

            tutupManual();

        }

    }
);


/* =========================
   INIT
========================= */

updateUI();

setStatus(
    "warning",
    "Tekan & tahan tombol untuk mulai scan"
);


/* =========================
   CONNECTION TEST
========================= */

async function cekServer(){

    const url =
        getTargetUrl();


    if(!url){

        return;

    }


    try{

        const r =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(r.ok){

            document.getElementById(
                "connectionStatus"
            ).innerText =
                "ON";

        }

    }catch(e){

        document.getElementById(
            "connectionStatus"
        ).innerText =
            "OFF";

    }

}


cekServer();


</script>
