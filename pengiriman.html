<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SRF - Pengiriman</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f172a;
}

body{
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:52px;
    flex-shrink:0;
    background:#1e293b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    z-index:20;
}

.header-title{
    font-size:15px;
    font-weight:700;
}

.header-actions{
    display:flex;
    gap:5px;
}

.header-btn{
    border:0;
    color:white;
    padding:7px 9px;
    border-radius:6px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.refresh{
    background:#d97706;
}

.clear{
    background:#dc2626;
}

.sync{
    background:#2563eb;
}

/* ================= STATS ================= */

.stats{
    height:52px;
    flex-shrink:0;
    background:#334155;
    color:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    text-align:center;
}

.stat{
    font-size:10px;
    color:#cbd5e1;
}

.stat strong{
    display:block;
    color:#38bdf8;
    font-size:16px;
    margin-top:1px;
}

/* ================= SCANNER ================= */

.scanner{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
    overflow:hidden;
}

#reader{
    position:absolute;
    inset:0;
    width:100%!important;
    height:100%!important;
    border:0!important;
}

#reader video{
    width:100%!important;
    height:100%!important;
    object-fit:cover!important;
}

/* hilangkan UI bawaan html5-qrcode yang mengganggu */
#reader img{
    display:none!important;
}

#reader__dashboard{
    display:none!important;
}

#reader__scan_region{
    width:100%!important;
    height:100%!important;
}

/* ================= STATUS ================= */

.status-box{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;

    background:rgba(15,23,42,.88);
    backdrop-filter:blur(8px);

    border-radius:10px;
    padding:10px 12px;

    display:flex;
    align-items:center;
    gap:9px;

    color:white;
}

.lamp{
    width:13px;
    height:13px;
    min-width:13px;
    border-radius:50%;
    background:#facc15;
    box-shadow:0 0 10px currentColor;
}

.status-text{
    font-size:13px;
    font-weight:600;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* ================= NOTIF ================= */

.notif{
    position:absolute;
    top:75px;
    left:50%;
    transform:translateX(-50%);

    z-index:30;

    padding:10px 18px;
    border-radius:25px;

    font-size:13px;
    font-weight:800;

    display:none;
    white-space:nowrap;

    box-shadow:0 5px 15px rgba(0,0,0,.35);
}

.notif.success{
    background:#16a34a;
    color:white;
}

.notif.warning{
    background:#f59e0b;
    color:white;
}

.notif.error{
    background:#dc2626;
    color:white;
}

/* ================= SCAN BUTTON ================= */

.scan-area{
    position:absolute;
    left:14px;
    right:14px;
    bottom:14px;

    z-index:15;
}

.scan-button{
    width:100%;
    height:56px;

    border:0;
    border-radius:30px;

    background:#334155;
    color:white;

    font-size:15px;
    font-weight:800;

    box-shadow:0 5px 15px rgba(0,0,0,.45);

    cursor:pointer;
    touch-action:none;
}

.scan-button.active{
    background:#16a34a;
}

.scan-button:active{
    transform:scale(.98);
}

/* ================= MANUAL ================= */

.manual-button{
    position:absolute;
    right:15px;
    bottom:86px;

    width:50px;
    height:50px;

    border:0;
    border-radius:50%;

    background:#2563eb;
    color:white;

    font-size:20px;

    z-index:15;

    box-shadow:0 5px 12px rgba(0,0,0,.4);
}

/* ================= DRAWER ================= */

.drawer{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:52vh;
    max-height:430px;

    background:white;

    border-radius:17px 17px 0 0;

    z-index:25;

    transform:translateY(calc(100% - 48px));

    transition:transform .25s ease;

    box-shadow:0 -5px 20px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}

.drawer.open{
    transform:translateY(0);
}

.drawer-header{
    height:48px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    background:#e2e8f0;

    border-radius:17px 17px 0 0;

    font-size:13px;
    font-weight:800;

    cursor:pointer;
}

.drawer-content{
    flex:1;
    overflow:auto;
    padding:8px 12px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th{
    background:#f8fafc;
    color:#64748b;
    text-align:left;
    padding:9px;
    position:sticky;
    top:0;
}

td{
    padding:9px;
    border-bottom:1px solid #e2e8f0;
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:5px;
    font-size:10px;
    font-weight:800;
}

.badge-spx{
    background:#dbeafe;
    color:#1d4ed8;
}

.badge-jnt{
    background:#dcfce7;
    color:#166534;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(3px);

    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:330px;

    background:white;

    border-radius:14px;
    padding:20px;
}

.modal-box h3{
    font-size:16px;
    margin-bottom:13px;
}

.modal-box input{
    width:100%;
    padding:12px;

    border:1px solid #cbd5e1;
    border-radius:8px;

    outline:none;
    font-size:14px;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;
}

.modal-buttons button{
    border:0;
    border-radius:7px;
    padding:9px 14px;
    font-weight:700;
}

.cancel{
    background:#e2e8f0;
}

.save{
    background:#2563eb;
    color:white;
}

/* ================= RESPONSIVE ================= */

@media(max-width:380px){

    .header-title{
        font-size:13px;
    }

    .header-btn{
        padding:6px;
        font-size:10px;
    }

    .status-text{
        font-size:12px;
    }

    .scan-button{
        height:52px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-title">
        SRF • Pengiriman
    </div>

    <div class="header-actions">

        <button class="header-btn refresh" onclick="refreshApp()">
            ↻ Refresh
        </button>

        <button class="header-btn sync" onclick="syncKeServer()">
            ☁ Sync <span id="syncCount">0</span>
        </button>

        <button class="header-btn clear" onclick="clearLocal()">
            Clear
        </button>

    </div>

</header>

<!-- ================= STATS ================= -->

<div class="stats">

    <div class="stat">
        Hari Ini
        <strong id="hariIni">0</strong>
    </div>

    <div class="stat">
        Kemarin
        <strong id="kemarin">0</strong>
    </div>

    <div class="stat">
        Minggu Ini
        <strong id="mingguIni">0</strong>
    </div>

</div>

<!-- ================= SCANNER ================= -->

<div class="scanner">

    <div id="reader"></div>

    <div class="status-box">

        <div id="lamp" class="lamp"></div>

        <div id="statusText" class="status-text">
            Tekan dan tahan untuk mulai scan
        </div>

    </div>

    <div id="notif" class="notif"></div>

    <!-- Manual -->
    <button
        class="manual-button"
        onclick="openManual()"
        title="Input manual">
        ⌨
    </button>

    <!-- Tombol scan -->
    <div class="scan-area">

        <button
            id="scanButton"
            class="scan-button">

            📷 TAHAN UNTUK SCAN

        </button>

    </div>

</div>

<!-- ================= DRAWER ================= -->

<div id="drawer" class="drawer">

    <div
        class="drawer-header"
        onclick="toggleDrawer()">

        <span>
            Antrean Belum Sinkron
            (<span id="queueCount">0</span>)
        </span>

        <span id="drawerArrow">
            ▲
        </span>

    </div>

    <div class="drawer-content">

        <table>

            <thead>
                <tr>
                    <th>Resi</th>
                    <th>Ekspedisi</th>
                </tr>
            </thead>

            <tbody id="historyBody"></tbody>

        </table>

    </div>

</div>

<!-- ================= MODAL MANUAL ================= -->

<div id="manualModal" class="modal">

    <div class="modal-box">

        <h3>Input Resi Manual</h3>

        <input
            id="manualInput"
            type="text"
            placeholder="Masukkan nomor resi">

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeManual()">
                Batal
            </button>

            <button
                class="save"
                onclick="saveManual()">
                Simpan
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     PENTING:
     CONFIG DARI FILE config.js TETAP DIPAKAI
========================================================= -->

<script src="config.js"></script>

<script>

/* =========================================================
   CONFIG READER

   Mendukung:
   1. const APP_URL = "..."
   2. const CONFIG = { APP_URL:"..." }
========================================================= */

function getTargetUrl(){

    if(
        typeof APP_URL !== "undefined" &&
        APP_URL
    ){
        return String(APP_URL).trim();
    }

    if(
        typeof CONFIG !== "undefined" &&
        CONFIG &&
        CONFIG.APP_URL
    ){
        return String(CONFIG.APP_URL).trim();
    }

    return "";
}


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_DATA = "srf_pengiriman_queue_v3";

const STORAGE_HISTORY = "srf_pengiriman_history_v3";


let localData =
    JSON.parse(
        localStorage.getItem(STORAGE_DATA) || "[]"
    );

let scanHistory =
    JSON.parse(
        localStorage.getItem(STORAGE_HISTORY) || "[]"
    );


/* =========================================================
   SCANNER VARIABLES
========================================================= */

let html5QrCode = null;

let cameraRunning = false;

let processing = false;


/* =========================================================
   INIT
========================================================= */

window.addEventListener("load", function(){

    updateUI();

    renderHistory();

    loadDashboard();

});


/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById("syncCount").innerText =
        localData.length;

    document.getElementById("queueCount").innerText =
        localData.length;

}


function setStatus(type,text){

    const lamp =
        document.getElementById("lamp");

    const status =
        document.getElementById("statusText");


    status.innerText = text;


    if(type === "green"){

        lamp.style.background = "#22c55e";
        lamp.style.color = "#22c55e";

    }

    else if(type === "red"){

        lamp.style.background = "#ef4444";
        lamp.style.color = "#ef4444";

    }

    else{

        lamp.style.background = "#facc15";
        lamp.style.color = "#facc15";

    }

}


function showNotif(text,type="success"){

    const el =
        document.getElementById("notif");


    el.innerText = text;

    el.className =
        "notif " + type;

    el.style.display = "block";


    clearTimeout(window.notifTimer);

    window.notifTimer =
        setTimeout(function(){

            el.style.display = "none";

        },1800);

}


/* =========================================================
   SOUND
========================================================= */

function beep(freq=600,duration=.08){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        osc.frequency.value =
            freq;

        osc.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + duration
        );

    }catch(e){}

}


/* =========================================================
   TTS
   Nanti karakter/bahasa bisa kamu ubah di sini
========================================================= */

const VOICE_CONFIG = {

    enabled:true,

    lang:"id-ID",

    rate:1.15,

    pitch:1.0,

    volume:1.0

};


function speak(text){

    if(!VOICE_CONFIG.enabled) return;

    if(!("speechSynthesis" in window)) return;


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang =
        VOICE_CONFIG.lang;

    voice.rate =
        VOICE_CONFIG.rate;

    voice.pitch =
        VOICE_CONFIG.pitch;

    voice.volume =
        VOICE_CONFIG.volume;


    speechSynthesis.speak(voice);

}


/* =========================================================
   EKSPEDISI
========================================================= */

function getEkspedisi(resi){

    const r =
        resi.toUpperCase();


    if(
        r.startsWith("SPX") ||
        r.startsWith("SPXID")
    ){

        return "SPX";

    }


    if(
        r.startsWith("JX") ||
        r.startsWith("JY") ||
        r.startsWith("JZ") ||
        /^\d+$/.test(r)
    ){

        return "J&T";

    }


    return null;

}


/* =========================================================
   SIMPAN RESI LOKAL
========================================================= */

function simpanLokal(resi){

    resi =
        String(resi || "")
        .trim()
        .toUpperCase();


    if(!resi) return;


    const ekspedisi =
        getEkspedisi(resi);


    if(!ekspedisi){

        beep(250,.25);

        setStatus(
            "red",
            "Format resi tidak dikenal"
        );

        showNotif(
            "RESI TIDAK DIKENAL",
            "error"
        );

        speak("Resi tidak dikenal");

        return;

    }


    /* =========================
       CEK DOUBLE LOKAL
    ========================= */

    if(localData.includes(resi)){

        beep(300,.35);

        setStatus(
            "red",
            "Resi sudah ada di antrean"
        );

        showNotif(
            "RESI DOBEL",
            "warning"
        );

        speak("Resi sudah ada");

        return;

    }


    /* =========================
       SIMPAN
    ========================= */

    localData.push(resi);


    localStorage.setItem(
        STORAGE_DATA,
        JSON.stringify(localData)
    );


    scanHistory.unshift({

        resi:resi,

        ekspedisi:ekspedisi,

        waktu:new Date().toISOString()

    });


    /* batasi history */
    scanHistory =
        scanHistory.slice(0,200);


    localStorage.setItem(
        STORAGE_HISTORY,
        JSON.stringify(scanHistory)
    );


    beep(750,.08);


    setStatus(
        "green",
        "Tersimpan • " + ekspedisi
    );


    showNotif(
        "✓ RESI TERSIMPAN",
        "success"
    );


    speak(
        ekspedisi === "SPX"
        ? "S P X, berhasil"
        : "J T, berhasil"
    );


    updateUI();

    renderHistory();

}


/* =========================================================
   START CAMERA
========================================================= */

async function mulaiScan(){

    if(cameraRunning) return;


    cameraRunning = true;


    const btn =
        document.getElementById("scanButton");


    btn.classList.add("active");

    btn.innerText =
        "🔴 LEPASKAN UNTUK BERHENTI";


    setStatus(
        "yellow",
        "Menyalakan kamera..."
    );


    try{

        if(!html5QrCode){

            html5QrCode =
                new Html5Qrcode("reader");

        }


        await html5QrCode.start(

            {
                facingMode:"environment"
            },

            {
                fps:15,

                qrbox:{
                    width:280,
                    height:180
                },

                aspectRatio:1.777778

            },

            function(decodedText){

                if(processing) return;


                processing = true;


                simpanLokal(decodedText);


                setTimeout(function(){

                    processing = false;

                },1200);

            }

        );


        setStatus(
            "green",
            "Kamera aktif • siap scan"
        );


    }catch(error){

        console.error(error);


        cameraRunning = false;


        btn.classList.remove("active");

        btn.innerText =
            "📷 TAHAN UNTUK SCAN";


        setStatus(
            "red",
            "Kamera gagal dibuka"
        );


        showNotif(
            "IZINKAN AKSES KAMERA",
            "error"
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function berhentiScan(){

    if(!cameraRunning) return;


    cameraRunning = false;


    const btn =
        document.getElementById("scanButton");


    btn.classList.remove("active");

    btn.innerText =
        "📷 TAHAN UNTUK SCAN";


    try{

        if(html5QrCode){

            await html5QrCode.stop();

        }

    }catch(e){}


    setStatus(
        "yellow",
        "Scanner berhenti"
    );

}


/* =========================================================
   HOLD BUTTON
========================================================= */

const scanButton =
    document.getElementById("scanButton");


scanButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        mulaiScan();

    }
);


scanButton.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        berhentiScan();

    }
);


scanButton.addEventListener(
    "pointercancel",
    function(){

        berhentiScan();

    }
);


scanButton.addEventListener(
    "pointerleave",
    function(){

        if(cameraRunning){

            berhentiScan();

        }

    }
);


/* =========================================================
   DRAWER
========================================================= */

function toggleDrawer(){

    const drawer =
        document.getElementById("drawer");

    const arrow =
        document.getElementById("drawerArrow");


    drawer.classList.toggle("open");


    arrow.innerText =
        drawer.classList.contains("open")
        ? "▼"
        : "▲";

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

    const body =
        document.getElementById("historyBody");


    body.innerHTML = "";


    if(localData.length === 0){

        body.innerHTML = `
        <tr>
            <td colspan="2"
                style="text-align:center;color:#94a3b8;padding:20px">
                Tidak ada antrean
            </td>
        </tr>`;

        return;

    }


    /* hanya tampilkan yang masih belum sync */

    const data =
        scanHistory.filter(function(item){

            return localData.includes(item.resi);

        });


    data.slice(0,100).forEach(function(item){

        const badgeClass =
            item.ekspedisi === "SPX"
            ? "badge-spx"
            : "badge-jnt";


        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                <strong>${escapeHTML(item.resi)}</strong>
            </td>

            <td>
                <span class="badge ${badgeClass}">
                    ${item.ekspedisi}
                </span>
            </td>

        `;


        body.appendChild(tr);

    });

}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MANUAL
========================================================= */

function openManual(){

    document
        .getElementById("manualModal")
        .classList.add("show");


    setTimeout(function(){

        document
            .getElementById("manualInput")
            .focus();

    },100);

}


function closeManual(){

    document
        .getElementById("manualModal")
        .classList.remove("show");

}


function saveManual(){

    const input =
        document.getElementById("manualInput");


    const value =
        input.value.trim();


    if(!value) return;


    simpanLokal(value);


    input.value = "";


    closeManual();

}


document
.getElementById("manualInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            saveManual();

        }

    }
);


/* =========================================================
   SYNC KE APPS SCRIPT
========================================================= */

async function syncKeServer(){

    if(localData.length === 0){

        showNotif(
            "ANTREAN KOSONG",
            "warning"
        );

        return;

    }


    const url =
        getTargetUrl();


    /* =========================
       INI YANG MEMBACA CONFIG.JS
    ========================= */

    if(!url){

        setStatus(
            "red",
            "URL Apps Script tidak ditemukan"
        );

        alert(
            "APP_URL tidak ditemukan dari config.js"
        );

        return;

    }


    const total =
        localData.length;


    setStatus(
        "yellow",
        `Sync 0/${total}`
    );


    let sisa = [];

    let berhasil = 0;


    for(let i=0;i<localData.length;i++){

        const resi =
            localData[i];


        setStatus(
            "yellow",
            `Sync ${i+1}/${total} • ${resi}`
        );


        try{

            const response =
                await fetch(
                    url,
                    {
                        method:"POST",

                        mode:"cors",

                        headers:{
                            "Content-Type":
                            "text/plain;charset=utf-8"
                        },

                        body:JSON.stringify({

                            source:"pengiriman",

                            resi:resi

                        })

                    }
                );


            const text =
                await response.text();


            console.log(
                "SYNC",
                resi,
                text
            );


            const result =
                JSON.parse(text);


            /*
             * SUCCESS = berhasil masuk
             * DUPLICATE = server sudah punya
             *
             * Keduanya boleh dikeluarkan
             * dari antrean lokal.
             */

            if(
                result.status === "success" ||
                result.status === "duplicate"
            ){

                berhasil++;

            }

            else{

                sisa.push(resi);

            }


        }catch(error){

            console.error(
                "SYNC ERROR:",
                error
            );


            sisa.push(resi);

        }


        await new Promise(
            resolve =>
                setTimeout(resolve,250)
        );

    }


    localData =
        sisa;


    localStorage.setItem(
        STORAGE_DATA,
        JSON.stringify(localData)
    );


    updateUI();

    renderHistory();


    if(berhasil > 0){

        setStatus(
            "green",
            `Sync selesai • ${berhasil} berhasil`
        );

        showNotif(
            `✓ ${berhasil} RESI TERSINKRON`,
            "success"
        );


        speak(
            `${berhasil} resi berhasil disinkronkan`
        );

    }

    else{

        setStatus(
            "red",
            "Sync gagal"
        );

        showNotif(
            "SYNC GAGAL",
            "error"
        );

    }

}


/* =========================================================
   DASHBOARD
========================================================= */

async function loadDashboard(){

    const url =
        getTargetUrl();


    if(!url) return;


    try{

        const response =
            await fetch(
                url + "?action=getDashboard"
            );


        const data =
            await response.json();


        if(data.status === "success"){

            document.getElementById("hariIni")
                .innerText =
                data.hariIni || 0;

            document.getElementById("kemarin")
                .innerText =
                data.kemarin || 0;

            document.getElementById("mingguIni")
                .innerText =
                data.mingguIni || 0;

        }

    }catch(e){

        console.log(
            "Dashboard tidak tersedia",
            e
        );

    }

}


/* =========================================================
   CLEAR ANTREAN LOKAL
========================================================= */

function clearLocal(){

    if(localData.length === 0){

        alert(
            "Antrean lokal sudah kosong."
        );

        return;

    }


    const yakin =
        confirm(
            "Hapus semua antrean scan yang belum sinkron dari HP?\n\nData di Google Sheet TIDAK akan dihapus."
        );


    if(!yakin) return;


    localData = [];


    localStorage.removeItem(
        STORAGE_DATA
    );


    updateUI();

    renderHistory();


    setStatus(
        "green",
        "Antrean lokal dibersihkan"
    );


    showNotif(
        "ANTREAN DIBERSIHKAN",
        "success"
    );

}


/* =========================================================
   REFRESH
========================================================= */

function refreshApp(){

    location.reload();

}


/* =========================================================
   CEGAH PAGE SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            !e.target.closest(".drawer-content") &&
            !e.target.closest(".modal-box")
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);

</script>
