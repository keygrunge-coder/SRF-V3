<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengiriman - SRF PROJECT</title>

<!-- PWA & Styling Eksternal -->
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#003399">
</head>
<body>

<div class="header-page">
    <h2>Diserahkan ke Ekspedisi</h2>
    <a href="index.html" class="btn-back">Kembali</a>
</div>

<div class="card">
    <label for="ekspedisi">Pilih Ekspedisi:</label>
    <select id="ekspedisi">
        <option value="J&T">J&T Express</option>
        <option value="SPX">Shopee Xpress</option>
        <option value="ID Express">ID Express</option>
        <option value="JNE">JNE</option>
    </select>

    <label for="resi">Scan / Masukkan No. Resi:</label>
    <input type="text" id="resi" placeholder="Scan barcode resi di sini..." autofocus>
    
    <button id="btnProses">Proses Pengiriman</button>
</div>

<div class="card">
    <h3>Log Aktivitas Scan</h3>
    <div id="log" class="log-box">Sistem siap...</div>
</div>

<!-- Script Eksternal Terpisah -->
<script src="config.js"></script>
<script src="pengiriman.js"></script>

</body>
</html>
