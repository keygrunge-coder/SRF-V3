<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,

}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#0f172a;
}

body{

    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:52px;

    flex-shrink:0;

    background:#1e293b;

    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

}

.header-title{

    font-size:15px;
    font-weight:800;
}

.header-actions{

    display:flex;
    gap:5px;
}

.header-btn{

    border:0;

    color:white;

    padding:7px 9px;

    border-radius:6px;

    font-size:11px;
    font-weight:800;

    cursor:pointer;

    touch-action:manipulation;
}

.refresh{

    background:#d97706;
}

.clear{

    background:#dc2626;
}

.sync{

    background:#2563eb;
}


/* =========================================================
   STATS
========================================================= */

.stats{

    height:52px;

    flex-shrink:0;

    background:#334155;

    color:white;

    display:flex;

    justify-content:space-around;
    align-items:center;

    text-align:center;
}

.stat{

    font-size:10px;

    color:#cbd5e1;
}

.stat strong{

    display:block;

    color:#38bdf8;

    font-size:16px;

    margin-top:1px;
}


/* =========================================================
   SCANNER AREA
========================================================= */

.scanner{

    position:relative;

    flex:1;

    min-height:0;

    background:#000;

    overflow:hidden;
}

#reader{

    position:absolute;

    inset:0;

    width:100%!important;
    height:100%!important;

    border:0!important;

    background:#000;
}

#reader video{

    width:100%!important;
    height:100%!important;

    object-fit:cover!important;
}

#reader img{

    display:none!important;
}

#reader__dashboard{

    display:none!important;
}

#reader__scan_region{

    width:100%!important;
    height:100%!important;
}


/* =========================================================
   STATUS
========================================================= */

.status-box{

    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    z-index:20;

    background:rgba(15,23,42,.88);

    backdrop-filter:blur(8px);

    border-radius:10px;

    padding:10px 12px;

    display:flex;

    align-items:center;

    gap:9px;

    color:white;
}

.lamp{

    width:13px;
    height:13px;

    min-width:13px;

    border-radius:50%;

    background:#facc15;

    box-shadow:
        0 0 10px currentColor;
}

.status-text{

    font-size:13px;

    font-weight:700;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notif{

    position:absolute;

    top:75px;

    left:50%;

    transform:translateX(-50%);

    z-index:40;

    padding:10px 18px;

    border-radius:25px;

    font-size:13px;

    font-weight:800;

    display:none;

    white-space:nowrap;

    box-shadow:
        0 5px 15px rgba(0,0,0,.35);
}

.notif.success{

    background:#16a34a;
    color:white;
}

.notif.warning{

    background:#f59e0b;
    color:white;
}

.notif.error{

    background:#dc2626;
    color:white;
}


/* =========================================================
   TOMBOL ANTREAN RESI
========================================================= */

.queue-button{

    position:absolute;

    right:15px;

    bottom:86px;

    width:54px;
    height:54px;

    border:0;

    border-radius:50%;

    background:#2563eb;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;

    font-weight:900;

    z-index:30;

    box-shadow:
        0 5px 12px rgba(0,0,0,.4);

    cursor:pointer;

    touch-action:manipulation;

    user-select:none;
}

.queue-button:active{

    transform:scale(.94);
}

.queue-icon{

    line-height:1;
}

.queue-count{

    position:absolute;

    top:-4px;
    right:-3px;

    min-width:20px;
    height:20px;

    padding:0 5px;

    border-radius:10px;

    background:#dc2626;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:10px;

    font-weight:900;

    border:2px solid #000;
}


/* =========================================================
   LABEL ANTREAN
========================================================= */

.queue-label{

    position:absolute;

    right:12px;

    bottom:66px;

    z-index:29;

    background:rgba(15,23,42,.85);

    color:white;

    padding:3px 7px;

    border-radius:5px;

    font-size:9px;

    font-weight:800;

    pointer-events:none;
}


/* =========================================================
   SCAN BUTTON
========================================================= */

.scan-area{

    position:absolute;

    left:14px;
    right:14px;

    bottom:14px;

    z-index:30;
}

.scan-button{

    width:100%;

    height:58px;

    border:0;

    border-radius:30px;

    background:#334155;

    color:white;

    font-size:15px;

    font-weight:900;

    box-shadow:
        0 5px 15px rgba(0,0,0,.45);

    cursor:pointer;

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}

.scan-button.active{

    background:#16a34a;
}

.scan-button:active{

    transform:scale(.98);
}


/* =========================================================
   TABLE
========================================================= */

table{

    width:100%;

    border-collapse:collapse;

    font-size:12px;
}

th{

    background:#f8fafc;

    color:#64748b;

}

td{

    padding:9px;

}

.badge{

    padding:3px 7px;

    border-radius:5px;

    font-size:10px;

}

.badge-spx{

    background:#dbeafe;

    color:#1d4ed8;
}

.badge-jnt{

    background:#dcfce7;

}


/* =========================================================

========================================================= */

@media(max-width:380px){

    }

    .queue-button{

        width:50px;
        height:50px;

        right:12px;

        bottom:84px;
    }

    .queue-label{

        right:9px;
        bottom:64px;
    }
}

</style>

</head>

<!-- =========================================================
     CONFIG.JS

     File config.js harus berada satu folder
     dengan file HTML ini.

     Bisa berisi:

     const APP_URL = "URL_APPS_SCRIPT";

     ATAU:

     const CONFIG = {
         APP_URL:"URL_APPS_SCRIPT"
     };

========================================================= -->

<script src="config.js"></script>


<script>

/* =========================================================
   =========================================================
   KONFIGURASI UTAMA
   =========================================================
   ========================================================= */


/* =========================================================
   CONFIG APPS SCRIPT
========================================================= */

function getTargetUrl(){

    try{

        if(
            typeof APP_URL !== "undefined" &&
            APP_URL
        ){

            return String(APP_URL).trim();

        }


        if(
            typeof CONFIG !== "undefined" &&
            CONFIG &&
            CONFIG.APP_URL
        ){

            return String(
                CONFIG.APP_URL
            ).trim();

        }

    }catch(e){

        console.error(
            "CONFIG ERROR:",
            e
        );

    }


    return "";

}


/* =========================================================
   ROBOT / iROBOT
   =========================================================

   BAHASA DIKUNCI INDONESIA.

   Jangan ubah:

   bahasa:"id-ID"

   Semua suara bisa diubah dari sini.

========================================================= */

const ROBOT_CONFIG = {

    enabled:true,

    bahasa:"id-ID",

    rate:1.15,

    pitch:1.0,

    volume:1.0,


    /* =====================================================
       PESAN ROBOT
    ===================================================== */

    pesan:{

        siap:
            "Scanner siap",

        kameraAktif:
            "Kamera aktif, siap scan",

        kameraBerhenti:
            "Scanner berhenti",

        kameraGagal:
            "Tidak dapat membuka kamera",

        resiTidakDikenal:
            "Resi tidak dikenal",

        doubleScan:
            "Resi sudah di scan",

        spxBerhasil:
            "S P X, berhasil",

        jntBerhasil:
            "J dan T, berhasil",

        resiMasukAntrean:
            "Resi masuk antrean",

        syncMulai:
            "Memulai sinkronisasi",

        syncBerhasil:
            "Resi berhasil disinkronkan",

        syncGagal:
            "Sinkronisasi gagal",

        antreanKosong:
            "Antrean kosong",

        antreanDibersihkan:
            "Antrean berhasil dibersihkan"

    }

};


/* =========================================================
   PENGATURAN SCAN
   =========================================================

   Bagian ini bisa kamu ubah.

   allowDoubleScan:

   false = resi yang sama ditolak

   true = resi yang sama boleh discan lagi

========================================================= */

const SCAN_CONFIG = {

    allowDoubleScan:false,

    doubleScanMode:"tolak",

    processingDelay:1200,

    beepSuccess:true,

    beepError:true,

    beepDouble:true

};


/* =========================================================
   MODE DOUBLE SCAN

   Kalau nanti mau ubah perilaku double:

   "tolak"
   "izinkan"

========================================================= */

const DOUBLE_SCAN_MODE = {

    TOLAK:"tolak",

    IZINKAN:"izinkan"

};


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_DATA =
    "srf_pengiriman_queue_v3";

const STORAGE_HISTORY =
    "srf_pengiriman_history_v3";


let localData = [];

let scanHistory = [];


try{

    localData =
        JSON.parse(
            localStorage.getItem(
                STORAGE_DATA
            ) || "[]"
        );

}catch(e){

    localData = [];

}


try{

    scanHistory =
        JSON.parse(
            localStorage.getItem(
                STORAGE_HISTORY
            ) || "[]"
        );

}catch(e){

    scanHistory = [];

}


/* =========================================================
   SCANNER VARIABLES
========================================================= */

let html5QrCode = null;

let cameraRunning = false;

let processing = false;


/* =========================================================
   INIT
========================================================= */

window.addEventListener(
    "load",
    function(){

        updateUI();

        renderHistory();

        loadDashboard();

        setStatus(
            "yellow",
            ROBOT_CONFIG.pesan.siap
        );

    }
);


/* =========================================================
   UI
========================================================= */

function updateUI(){

    const count =
        localData.length;


    document.getElementById(
        "syncCount"
    ).innerText =
        count;


    document.getElementById(
        "queueCount"
    ).innerText =
        count;


    document.getElementById(
        "queueButtonCount"
    ).innerText =
        count;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    type,
    text
){

    const lamp =
        document.getElementById(
            "lamp"
        );


    const status =
        document.getElementById(
            "statusText"
        );


    status.innerText =
        text;


    if(type === "green"){

        lamp.style.background =
            "#22c55e";

        lamp.style.color =
            "#22c55e";

    }

    else if(type === "red"){

        lamp.style.background =
            "#ef4444";

        lamp.style.color =
            "#ef4444";

    }

    else{

        lamp.style.background =
            "#facc15";

        lamp.style.color =
            "#facc15";

    }

}


/* =========================================================
   NOTIFICATION
========================================================= */

function showNotif(
    text,
    type="success"
){

    const el =
        document.getElementById(
            "notif"
        );


    el.innerText =
        text;


    el.className =
        "notif " + type;


    el.style.display =
        "block";


    clearTimeout(
        window.notifTimer
    );


    window.notifTimer =
        setTimeout(
            function(){

                el.style.display =
                    "none";

            },
            1800
        );

}


/* =========================================================
   BEEP
========================================================= */

function beep(
    freq=600,
    duration=.08
){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const osc =
            ctx.createOscillator();


        osc.frequency.value =
            freq;


        osc.connect(
            ctx.destination
        );


        osc.start();


        osc.stop(
            ctx.currentTime +
            duration
        );

    }catch(e){}

}


/* =========================================================
   iROBOT
   BAHASA INDONESIA SAJA
========================================================= */

function speak(text){

    if(
        !ROBOT_CONFIG.enabled
    ){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                text
            );


        /*
         * BAHASA DIKUNCI ID
         */

        voice.lang =
            "id-ID";


        voice.rate =
            ROBOT_CONFIG.rate;


        voice.pitch =
            ROBOT_CONFIG.pitch;


        voice.volume =
            ROBOT_CONFIG.volume;


        speechSynthesis.speak(
            voice
        );

    }catch(e){

        console.error(
            "ROBOT VOICE ERROR:",
            e
        );

    }

}


/* =========================================================
   EKSPEDISI
========================================================= */

function getEkspedisi(
    resi
){

    const r =
        String(resi)
        .trim()
        .toUpperCase();


    if(
        r.startsWith("SPX")
    ){

        return "SPX";

    }


    if(
        r.startsWith("JX") ||
        r.startsWith("JY") ||
        r.startsWith("JZ")
    ){

        return "J&T";

    }


    return null;

}


/* =========================================================
   CEK DOUBLE
========================================================= */

function cekDouble(
    resi
){

    return localData.includes(
        resi
    );

}


/* =========================================================
   SIMPAN RESI LOKAL
========================================================= */

function simpanLokal(
    resi
){

    resi =
        String(resi || "")
        .trim()
        .toUpperCase();


    if(!resi){

        return false;

    }


    const ekspedisi =
        getEkspedisi(
            resi
        );


    /* =====================================================
       FORMAT RESI TIDAK DIKENAL
    ===================================================== */

    if(!ekspedisi){

        if(
            SCAN_CONFIG.beepError
        ){

            beep(
                250,
                .25
            );

        }


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.resiTidakDikenal
        );


        showNotif(
            "RESI TIDAK DIKENAL",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.resiTidakDikenal
        );


        return false;

    }


    /* =====================================================
       DOUBLE SCAN
    ===================================================== */

    if(
        cekDouble(resi)
    ){

        /*
         * MODE TOLAK
         */

        if(
            !SCAN_CONFIG.allowDoubleScan ||
            SCAN_CONFIG.doubleScanMode ===
                DOUBLE_SCAN_MODE.TOLAK
        ){

            if(
                SCAN_CONFIG.beepDouble
            ){

                beep(
                    300,
                    .35
                );

            }


            setStatus(
                "red",
                ROBOT_CONFIG.pesan.doubleScan
            );


            showNotif(
                "RESI DOBEL",
                "warning"
            );


            speak(
                ROBOT_CONFIG.pesan.doubleScan
            );


            return false;

        }

    }


    /* =====================================================
       TAMBAHKAN KE ANTREAN
    ===================================================== */

    localData.push(
        resi
    );


    localStorage.setItem(
        STORAGE_DATA,
        JSON.stringify(
            localData
        )
    );


    /* =====================================================
       HISTORY
    ===================================================== */

    scanHistory.unshift({

        resi:resi,

        ekspedisi:ekspedisi,

        waktu:
            new Date()
            .toISOString()

    });


    scanHistory =
        scanHistory.slice(
            0,
            200
        );


    localStorage.setItem(
        STORAGE_HISTORY,
        JSON.stringify(
            scanHistory
        )
    );


    /* =====================================================
       FEEDBACK
    ===================================================== */

    if(
        SCAN_CONFIG.beepSuccess
    ){

        beep(
            750,
            .08
        );

    }


    setStatus(
        "green",
        ekspedisi === "SPX"
            ? "SPX • berhasil"
            : "J&T • berhasil"
    );


    showNotif(
        "✓ RESI MASUK ANTREAN",
        "success"
    );


    /*
     * SUARA BERDASARKAN EKSPEDISI
     */

    if(
        ekspedisi === "SPX"
    ){

        speak(
            ROBOT_CONFIG.pesan.spxBerhasil
        );

    }else{

        speak(
            ROBOT_CONFIG.pesan.jntBerhasil
        );

    }


    updateUI();

    renderHistory();


    return true;

}


/* =========================================================
   START CAMERA
========================================================= */

async function mulaiScan(){

    if(
        cameraRunning
    ){

        return;

    }


    cameraRunning =
        true;


    const btn =
        document.getElementById(
            "scanButton"
        );


    btn.classList.add(
        "active"
    );


    btn.innerText =
        "🔴 LEPASKAN UNTUK BERHENTI";


    setStatus(
        "yellow",
        "Menyalakan kamera..."
    );


    try{

        if(!html5QrCode){

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps:15,

                qrbox:{

                    width:280,
                    height:180

                },

                aspectRatio:
                    1.777778

            },


            function(decodedText){

                if(processing){

                    return;

                }


                processing =
                    true;


                simpanLokal(
                    decodedText
                );


                setTimeout(
                    function(){

                        processing =
                            false;

                    },
                    SCAN_CONFIG.processingDelay
                );

            }

        );


        setStatus(
            "green",
            ROBOT_CONFIG.pesan.kameraAktif
        );


        speak(
            ROBOT_CONFIG.pesan.kameraAktif
        );


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraRunning =
            false;


        btn.classList.remove(
            "active"
        );


        btn.innerText =
            "📷 TAHAN UNTUK SCAN";


        setStatus(
            "red",
            ROBOT_CONFIG.pesan.kameraGagal
        );


        showNotif(
            "IZINKAN AKSES KAMERA",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.kameraGagal
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function berhentiScan(){

    if(
        !cameraRunning
    ){

        return;

    }


    cameraRunning =
        false;


    const btn =
        document.getElementById(
            "scanButton"
        );


    btn.classList.remove(
        "active"
    );


    btn.innerText =
        "📷 TAHAN UNTUK SCAN";


    try{

        if(html5QrCode){

            await html5QrCode.stop();

        }

    }catch(e){}


    setStatus(
        "yellow",
        ROBOT_CONFIG.pesan.kameraBerhenti
    );

}


/* =========================================================
   HOLD SCAN BUTTON
========================================================= */

const scanButton =
    document.getElementById(
        "scanButton"
    );


scanButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        mulaiScan();

    }
);


scanButton.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        berhentiScan();

    }
);


scanButton.addEventListener(
    "pointercancel",
    function(){

        berhentiScan();

    }
);


scanButton.addEventListener(
    "pointerleave",
    function(){

        if(cameraRunning){

            berhentiScan();

        }

    }
);


/* =========================================================
   BUKA ANTREAN
========================================================= */

function openQueue(){

    const drawer =
        document.getElementById(
            "drawer"
        );


    const arrow =
        document.getElementById(
            "drawerArrow"
        );


    drawer.classList.add(
        "open"
    );


    arrow.innerText =
        "▼";

}


/* =========================================================
   DRAWER
========================================================= */

function toggleDrawer(){

    const drawer =
        document.getElementById(
            "drawer"
        );


    const arrow =
        document.getElementById(
            "drawerArrow"
        );


    drawer.classList.toggle(
        "open"
    );


    arrow.innerText =
        drawer.classList.contains(
            "open"
        )
        ? "▼"
        : "▲";

}


/* =========================================================
   RENDER ANTREAN
========================================================= */

function renderHistory(){

    const body =
        document.getElementById(
            "historyBody"
        );


    body.innerHTML =
        "";


    if(
        localData.length === 0
    ){

        body.innerHTML = `

            <tr>

                <td
                    colspan="2"
                    style="
                        text-align:center;
                        color:#94a3b8;
                        padding:20px;
                    "
                >

                    Antrean kosong

                </td>

            </tr>

        `;

        return;

    }


    /*
     * Hanya tampilkan resi
     * yang masih berada
     * di antrean.
     */

    const data =
        scanHistory.filter(
            function(item){

                return localData.includes(
                    item.resi
                );

            }
        );


    data
    .slice(0,100)
    .forEach(
        function(item){

            const badgeClass =
                item.ekspedisi === "SPX"
                ? "badge-spx"
                : "badge-jnt";


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>

                    <strong>
                        ${escapeHTML(
                            item.resi
                        )}
                    </strong>

                </td>

                <td>

                    <span
                        class="badge
                        ${badgeClass}"
                    >

                        ${escapeHTML(
                            item.ekspedisi
                        )}

                    </span>

                </td>

            `;


            body.appendChild(
                tr
            );

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   SYNC KE GOOGLE APPS SCRIPT
========================================================= */

async function syncKeServer(){

    if(
        localData.length === 0
    ){

        showNotif(
            ROBOT_CONFIG.pesan.antreanKosong,
            "warning"
        );


        setStatus(
            "yellow",
            ROBOT_CONFIG.pesan.antreanKosong
        );


        speak(
            ROBOT_CONFIG.pesan.antreanKosong
        );


        return;

    }


    const url =
        getTargetUrl();


    /* =====================================================
       CEK CONFIG
    ===================================================== */

    if(!url){

        setStatus(
            "red",
            "URL Apps Script tidak ditemukan"
        );


        alert(
            "APP_URL tidak ditemukan dari config.js"
        );


        return;

    }


    const total =
        localData.length;


    setStatus(
        "yellow",
        `Sync 0/${total}`
    );


    speak(
        ROBOT_CONFIG.pesan.syncMulai
    );


    let sisa = [];

    let berhasil = 0;


    /*
     * COPY ARRAY
     */

    const daftarSync =
        [...localData];


    for(
        let i = 0;
        i < daftarSync.length;
        i++
    ){

        const resi =
            daftarSync[i];


        setStatus(
            "yellow",
            `Sync ${i+1}/${total} • ${resi}`
        );


        try{

            const response =
                await fetch(

                    url,

                    {

                        method:
                            "POST",

                        mode:
                            "cors",

                        headers:{

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify({

                                source:
                                    "pengiriman",

                                resi:
                                    resi

                            })

                    }

                );


            const text =
                await response.text();


            console.log(
                "SYNC",
                resi,
                text
            );


            let result;


            try{

                result =
                    JSON.parse(
                        text
                    );

            }catch(e){

                console.error(
                    "JSON ERROR:",
                    text
                );


                sisa.push(
                    resi
                );


                continue;

            }


            /* =================================================
               SUCCESS
            ================================================= */

            if(
                result.status ===
                "success"
            ){

                berhasil++;

            }


            /* =================================================
               DUPLICATE
            ================================================= */

            else if(
                result.status ===
                "duplicate"
            ){

                berhasil++;

            }


            /* =================================================
               ERROR
            ================================================= */

            else{

                sisa.push(
                    resi
                );

            }


        }catch(error){

            console.error(
                "SYNC ERROR:",
                resi,
                error
            );


            sisa.push(
                resi
            );

        }


        await new Promise(
            function(resolve){

                setTimeout(
                    resolve,
                    250
                );

            }
        );

    }


    /* =====================================================
       SIMPAN ANTREAN SISA
    ===================================================== */

    localData =
        sisa;


    localStorage.setItem(
        STORAGE_DATA,
        JSON.stringify(
            localData
        )
    );


    updateUI();

    renderHistory();


    /* =====================================================
       HASIL SYNC
    ===================================================== */

    if(
        berhasil > 0
    ){

        setStatus(
            "green",
            `Sync selesai • ${berhasil} berhasil`
        );


        showNotif(
            `✓ ${berhasil} RESI TERSINKRON`,
            "success"
        );


        speak(
            `${berhasil} ` +
            ROBOT_CONFIG.pesan.syncBerhasil
        );

    }

    else{

        setStatus(
            "red",
            "Tidak ada resi yang tersinkron"
        );


        showNotif(
            "SYNC GAGAL",
            "error"
        );


        speak(
            ROBOT_CONFIG.pesan.syncGagal
        );

    }

}


/* =========================================================
   DASHBOARD
========================================================= */

async function loadDashboard(){

    const url =
        getTargetUrl();


    if(!url){

        return;

    }


    try{

        const response =
            await fetch(
                url +
                "?action=getDashboard"
            );


        const data =
            await response.json();


        if(
            data.status ===
            "success"
        ){

            document.getElementById(
                "hariIni"
            ).innerText =
                data.hariIni || 0;


            document.getElementById(
                "kemarin"
            ).innerText =
                data.kemarin || 0;


            document.getElementById(
                "mingguIni"
            ).innerText =
                data.mingguIni || 0;

        }

    }catch(e){

        console.log(
            "Dashboard tidak tersedia",
            e
        );

    }

}


/* =========================================================
   CLEAR ANTREAN LOKAL
========================================================= */

function clearLocal(){

    if(
        localData.length === 0
    ){

        alert(
            "Antrean lokal sudah kosong."
        );

        return;

    }


    const yakin =
        confirm(

            "Hapus semua antrean scan yang belum sinkron dari HP?\n\nData di Google Sheet TIDAK akan dihapus."

        );


    if(!yakin){

        return;

    }


    localData = [];


    localStorage.removeItem(
        STORAGE_DATA
    );


    updateUI();

    renderHistory();


    setStatus(
        "green",
        ROBOT_CONFIG.pesan.antreanDibersihkan
    );


    showNotif(
        "ANTREAN DIBERSIHKAN",
        "success"
    );


    speak(
        ROBOT_CONFIG.pesan.antreanDibersihkan
    );

}
