<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan - SRF PROJECT</title>

<!-- PWA & Styling Eksternal -->
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#003399">
</head>
<body>

<div class="header-page" style="display:flex; align-items:center; justify-content:space-between; text-align:left; padding:15px;">
    <h2>Pengaturan Aplikasi</h2>
    <a href="index.html" class="btn-back">Kembali</a>
</div>

<div class="card" style="box-shadow:0 3px 8px rgba(0,0,0,.08);">
    <label for="apiUrl">URL Backend (Google Apps Script):</label>
    <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">

    <label for="kunciAkses">Kunci Akses / Token:</label>
    <input type="text" id="kunciAkses" placeholder="Masukkan kunci (Default: SRF)">
    
    <button id="btnSimpanConfig">Simpan Pengaturan</button>
</div>

<div class="card" style="box-shadow:0 3px 8px rgba(0,0,0,.08);">
    <h3>Status Konfigurasi</h3>
    <div id="logConfig" class="log-box">Memuat pengaturan...</div>
</div>

<!-- Script Eksternal Terpisah -->
<script src="config.js"></script>
<script src="pengaturan.js"></script>

</body>
</html>
